<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Detyrat</title>
    <link rel="stylesheet" href="../css/theme-v2.css">
    <script src="../js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="../Sigal-KS-Logo.webp" alt="Sigal Logo">
            <div class="logo-text">
                <span class="logo-text-main">SIGAL</span>
                <span class="logo-text-sub">Insurance Group</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="ballina.html" class="nav-item" data-label="Ballina"><span class="nav-icon"><i data-lucide="home"></i></span><span class="nav-label">Ballina</span></a>
            <a href="oferta.html" class="nav-item" data-label="Oferta"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item" data-label="Kontratat"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item" data-label="Faturimi"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="rinovimet.html" class="nav-item" data-label="Rinovimet"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="debitoret.html" class="nav-item" data-label="Debitorët"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="raportet.html" class="nav-item" data-label="Raportet"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="detyrat.html" class="nav-item active" data-label="Detyrat"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="#" class="nav-item" data-label="Dokumentet"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item" data-label="Stafi"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout" onclick="logout()"><span class="nav-icon"><i data-lucide="log-out"></i></span><span class="nav-label">Dilni</span></a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Detyrat</h1>
            <div class="topbar-right">
                <div class="topbar-actions">
                    <button class="btn-primary" id="btn-perzgjedh" onclick="toggleSelectionMode()" type="button">
                        <i data-lucide="check-square"></i> Përzgjedh
                    </button>
                    <button class="btn-primary" id="btn-shto-detyre" onclick="hapDrawerKrijim()" style="display:none;">
                        <i data-lucide="plus"></i> Shto detyrë
                    </button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <!-- Selection toolbar (i fshehur default) -->
            <div class="det-selection-toolbar" id="det-selection-toolbar" style="display:none;">
                <div class="det-selection-info">
                    <i data-lucide="check-square"></i>
                    <span><span id="det-selection-count">0</span> të zgjedhura</span>
                </div>
                <div class="det-selection-actions">
                    <button class="det-action-bulk det-action-primary" onclick="bulkMerrPersiper()" type="button">
                        <i data-lucide="play"></i> Merr përsipër
                    </button>
                    <button class="det-action-bulk det-action-success" onclick="bulkPerfundo()" type="button">
                        <i data-lucide="check"></i> Përfundo
                    </button>
                    <button class="det-action-bulk det-action-danger" id="btn-bulk-anulo" onclick="bulkAnulo()" type="button" style="display:none;">
                        <i data-lucide="x"></i> Anulo
                    </button>
                    <button class="det-action-bulk det-action-primary" id="btn-bulk-ricakto" onclick="hapModalRicakto()" type="button" style="display:none;">
                        <i data-lucide="user-cog"></i> Ricakto
                    </button>
                    <button class="det-action-bulk det-action-cancel" onclick="toggleSelectionMode()" type="button">
                        Anulo përzgjedhjen
                    </button>
                </div>
            </div>

            <!-- Filter chips -->
            <div class="det-filters" id="det-filters">
                <button class="det-chip active" data-filter="all" onclick="setFilter('all')">
                    Të gjitha <span class="det-chip-count" id="c-all">0</span>
                </button>
                <button class="det-chip" data-filter="te-miat" onclick="setFilter('te-miat')">
                    Detyrat e mia <span class="det-chip-count" id="c-mine">0</span>
                </button>
                <button class="det-chip" data-filter="pa-pergjegjes" onclick="setFilter('pa-pergjegjes')" id="chip-unassigned">
                    Pa përgjegjës <span class="det-chip-count" id="c-unassigned">0</span>
                </button>
            </div>

            <!-- Accordion 4 grupe -->
            <div class="det-accordion" id="det-accordion">
                <div class="det-empty">Duke ngarkuar...</div>
            </div>
        </div>
    </div>

    <!-- Drawer për krijim manual (vetëm për management+) -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="if(event.target===this)mbyllDrawer()">
        <div class="drawer-panel" style="max-width:560px;">
            <div class="drawer-header">
                <div>
                    <div class="drawer-title-gradient" id="drawer-title">Detyrë e re</div>
                    <div class="drawer-subtitle">Plotëso detajet për detyrën manuale</div>
                </div>
                <button class="drawer-close" onclick="mbyllDrawer()" type="button">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="drawer-panel-body">
                <div class="det-form-row">
                    <label>Titulli <span style="color:#dc2626">*</span></label>
                    <input type="text" id="d-titulli" placeholder="Shkurt çfarë duhet bërë">
                </div>
                <div class="det-form-row">
                    <label>Përshkrimi</label>
                    <textarea id="d-pershkrimi" rows="3" placeholder="Detaje shtesë (opsionale)"></textarea>
                </div>
                <div class="det-form-row-2">
                    <div class="det-form-row">
                        <label>Prioriteti</label>
                        <select id="d-prioriteti">
                            <option value="kritike">Kritike</option>
                            <option value="te_rendesishme">Të rëndësishme</option>
                            <option value="normale" selected>Normale</option>
                        </select>
                    </div>
                    <div class="det-form-row">
                        <label>Data e afatit</label>
                        <input type="date" id="d-afati">
                    </div>
                </div>
                <div class="det-form-row">
                    <label>Përgjegjësi</label>
                    <select id="d-pergjegjesi">
                        <option value="">— Pa caktuar —</option>
                    </select>
                </div>
            </div>
            <div class="drawer-footer">
                <button class="btn-cancel" onclick="mbyllDrawer()">Anulo</button>
                <button class="btn-save btn-primary" onclick="ruajDetyre()">
                    <i data-lucide="check"></i> Ruaj
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Ndrysho afatin (vetëm mgmt+) -->
    <div class="det-mini-overlay" id="afati-modal-overlay" onclick="if(event.target===this)mbyllAfatiModal()">
        <div class="det-mini-modal">
            <div class="det-mini-modal-header">
                <i data-lucide="calendar-clock"></i>
                <span>Ndrysho afatin</span>
                <button class="det-mini-close" onclick="mbyllAfatiModal()" type="button"><i data-lucide="x"></i></button>
            </div>
            <div class="det-mini-modal-body">
                <div class="det-form-row">
                    <label>Data e re e afatit</label>
                    <input type="date" id="afati-modal-input">
                </div>
            </div>
            <div class="det-mini-modal-footer">
                <button class="btn-cancel" onclick="mbyllAfatiModal()" type="button">Anulo</button>
                <button class="btn-save btn-primary" onclick="ruajAfatin()" type="button">
                    <i data-lucide="check"></i> Ruaj
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Konfirmim (për bulk actions) -->
    <div class="det-mini-overlay" id="confirm-modal-overlay" onclick="if(event.target===this)mbyllConfirmModal()">
        <div class="det-mini-modal det-confirm-modal">
            <div class="det-mini-modal-header">
                <i data-lucide="alert-triangle" style="color:var(--s-warning)"></i>
                <span>Konfirmim</span>
            </div>
            <div class="det-mini-modal-body">
                <div id="confirm-modal-msg" style="font-size:13px;line-height:1.5;color:var(--s-text-sub);"></div>
            </div>
            <div class="det-mini-modal-footer">
                <button class="btn-cancel" onclick="mbyllConfirmModal()" type="button">Anulo</button>
                <button class="btn-save btn-primary" id="confirm-modal-ok" type="button">
                    <i data-lucide="check"></i> Vazhdo
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Ricakto bulk (vetëm mgmt+) -->
    <div class="det-mini-overlay" id="ricakto-modal-overlay" onclick="if(event.target===this)mbyllRicaktoModal()">
        <div class="det-mini-modal">
            <div class="det-mini-modal-header">
                <i data-lucide="user-cog"></i>
                <span>Ricakto detyrat</span>
                <button class="det-mini-close" onclick="mbyllRicaktoModal()" type="button"><i data-lucide="x"></i></button>
            </div>
            <div class="det-mini-modal-body">
                <div class="det-form-row">
                    <label>Përgjegjësi i ri për <span id="ricakto-count">0</span> detyra</label>
                    <select id="ricakto-pergjegjesi">
                        <option value="">— Pa caktuar —</option>
                    </select>
                </div>
            </div>
            <div class="det-mini-modal-footer">
                <button class="btn-cancel" onclick="mbyllRicaktoModal()" type="button">Anulo</button>
                <button class="btn-save btn-primary" onclick="ruajRicakto()" type="button">
                    <i data-lucide="check"></i> Ricakto
                </button>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="det-toast-container"></div>

    <script src="../js/main.js"></script>
    <script src="../js/detyrat.js"></script>
    <script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>

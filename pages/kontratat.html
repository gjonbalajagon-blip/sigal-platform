<script>
lucide.createIcons();

// Mirror i strip-llojet → llojet-chips inline + clickable filter
(function(){
    const llojiNames={individ:'Individ',familje:'Familje',biznes:'Biznes'};
    const target=document.getElementById('llojet-chips');
    const source=document.getElementById('st-llojet');
    const select=document.getElementById('filter-lloji');
    if(!target||!source||!select)return;

    let activeLloji='all';

    function rebuild(){
        const chips=source.querySelectorAll('.strip-chip');
        const counts={individ:0,familje:0,biznes:0};
        chips.forEach(ch=>{
            const num=parseInt(ch.querySelector('.sc-num')?.textContent||'0');
            const text=ch.textContent.replace(num,'').trim();
            const key=Object.keys(llojiNames).find(k=>llojiNames[k]===text);
            if(key)counts[key]=num;
        });
        const out=['individ','familje','biznes'].map(k=>{
            const isActive=activeLloji===k?' active':'';
            return '<span class="ll-chip '+k+isActive+'" data-lloji="'+k+'"><span class="ll-num">'+counts[k]+'</span> '+llojiNames[k]+'</span>';
        });
        target.innerHTML=out.join('');
        // Bind click
        target.querySelectorAll('.ll-chip').forEach(chip=>{
            chip.addEventListener('click',()=>{
                const lloji=chip.dataset.lloji;
                activeLloji=(activeLloji===lloji)?'all':lloji;
                select.value=activeLloji;
                select.dispatchEvent(new Event('change'));
                rebuild();
            });
        });
    }

    new MutationObserver(rebuild).observe(source,{childList:true,subtree:true});
    setTimeout(rebuild,100);
})();
</script>

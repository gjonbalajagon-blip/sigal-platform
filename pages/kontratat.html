<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Kontratat</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/pako-editor.css">
    <script src="../js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ============================================================
   SIGAL THEME V2 — KONTRATAT
   Override mbi theme.css. Ruajtur ID/klasa qe JS kerkon.
   ============================================================ */

/* ---------- BASE ---------- */
body {
    background: linear-gradient(135deg, #e8f0ff 0%, #eaf4ff 50%, #dfeaff 100%) !important;
    min-height: 100vh;
    color: #0f1a30 !important;
    font-size: 12px;
    font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif !important;
}

/* ---------- SIDEBAR OVERRIDE ---------- */
.sidebar {
    width: 76px !important;
    background: rgba(255,255,255,0.6) !important;
    backdrop-filter: blur(24px) !important;
    -webkit-backdrop-filter: blur(24px) !important;
    border-radius: 28px !important;
    border: 1px solid rgba(255,255,255,0.9) !important;
    box-shadow: 0 10px 40px rgba(30,64,175,0.1) !important;
    margin: 16px 0 16px 16px !important;
    padding: 18px 0 !important;
    height: calc(100vh - 32px) !important;
    position: fixed !important;
    top: 0 !important; left: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
}
.sidebar-logo {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #002B5C, #3b82f6) !important;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(0,43,92,0.35);
    overflow: hidden;
    padding: 0 !important;
}
.sidebar-logo img { width: 32px; height: 32px; object-fit: contain; }
.sidebar-logo .logo-text { display: none !important; }

.sidebar-nav {
    flex: 1;
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    width: 100%;
    align-items: center;
    padding: 4px 0;
    overflow: visible !important;
}
.sidebar-nav .nav-item {
    width: 46px !important; height: 46px !important;
    border-radius: 14px !important;
    background: rgba(255,255,255,0.75) !important;
    border: 1px solid rgba(220,230,250,0.8) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #7c8aa8 !important;
    transition: all 0.2s !important;
    position: relative;
    padding: 0 !important;
    text-decoration: none !important;
}
.sidebar-nav .nav-item .nav-icon {
    width: auto !important; height: auto !important;
    background: none !important;
    margin: 0 !important;
    display: flex; align-items: center; justify-content: center;
}
.sidebar-nav .nav-item .nav-icon i,
.sidebar-nav .nav-item .nav-icon svg {
    width: 19px !important; height: 19px !important;
    color: inherit !important;
    stroke: currentColor !important;
    stroke-width: 1.9 !important;
}
.sidebar-nav .nav-item .nav-label {
    display: none !important;
}
.sidebar-nav .nav-item.active {
    background: linear-gradient(135deg, #002B5C, #3b82f6) !important;
    color: #fff !important;
    border-color: transparent !important;
    box-shadow: 0 8px 20px rgba(0,43,92,0.4) !important;
}
.sidebar-nav .nav-item:not(.active):hover {
    background: #fff !important;
    color: #002B5C !important;
    border-color: rgba(0,43,92,0.2) !important;
}

/* Tooltip on hover */
.sidebar-nav .nav-item::after {
    content: attr(data-label);
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    background: #0f1a30;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: all 0.18s;
    box-shadow: 0 6px 18px rgba(15,26,48,0.25);
    z-index: 1000;
}
.sidebar-nav .nav-item::before {
    content: '';
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: #0f1a30;
    opacity: 0;
    transition: opacity 0.18s;
    pointer-events: none;
    z-index: 1000;
}
.sidebar-nav .nav-item:hover::after {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
}
.sidebar-nav .nav-item:hover::before { opacity: 1; }

.sidebar-footer {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 10px;
    border-top: 1px solid rgba(220,230,250,0.6);
}
.sidebar-footer .nav-item {
    width: 46px !important; height: 46px !important;
    border-radius: 14px !important;
    background: rgba(255,255,255,0.75) !important;
    border: 1px solid rgba(220,230,250,0.8) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #ef4444 !important;
    text-decoration: none !important;
    position: relative;
}
.sidebar-footer .nav-item .nav-icon {
    background: none !important;
    width: auto !important; height: auto !important;
    margin: 0 !important;
}
.sidebar-footer .nav-item .nav-icon i,
.sidebar-footer .nav-item .nav-icon svg {
    width: 19px !important; height: 19px !important;
    stroke-width: 1.9 !important;
}
.sidebar-footer .nav-item .nav-label { display: none !important; }
.sidebar-footer .nav-item:hover {
    background: #fff !important;
    border-color: rgba(239,68,68,0.3) !important;
}
.sidebar-footer .nav-item::after {
    content: 'Dilni';
    position: absolute;
    left: calc(100% + 14px);
    top: 50%;
    transform: translateY(-50%) translateX(-6px);
    background: #0f1a30;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: all 0.18s;
    z-index: 1000;
}
.sidebar-footer .nav-item::before {
    content: '';
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    border: 5px solid transparent;
    border-right-color: #0f1a30;
    opacity: 0;
    transition: opacity 0.18s;
    z-index: 1000;
}
.sidebar-footer .nav-item:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
.sidebar-footer .nav-item:hover::before { opacity: 1; }

/* ---------- MAIN CONTENT ---------- */
.main-content {
    margin-left: 108px !important;
    padding: 18px 24px 24px 24px !important;
    background: transparent !important;
    min-height: 100vh;
}

/* ---------- TOPBAR ---------- */
.topbar {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    margin-bottom: 18px !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}
.topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
}
.topbar-bell {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(220,230,250,0.8);
    display: flex; align-items: center; justify-content: center;
    color: #002B5C;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
}
.topbar-bell:hover { background: #fff; border-color: #002B5C; }
.topbar-bell i, .topbar-bell svg {
    width: 17px !important; height: 17px !important;
    stroke-width: 2 !important;
}
.topbar-bell .bell-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: linear-gradient(135deg, #f43f5e, #ef4444);
    color: #fff;
    font-size: 9.5px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(239,68,68,0.4);
    min-width: 18px;
    text-align: center;
    line-height: 1.2;
}
.topbar-user {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 12px 5px 5px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(220,230,250,0.8);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
}
.topbar-user:hover { background: #fff; border-color: rgba(0,43,92,0.2); }
.tu-avatar {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, #002B5C, #3b82f6);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 12px;
}
.tu-info { display: flex; flex-direction: column; }
.tu-name {
    font-size: 12px;
    font-weight: 700;
    color: #0f1a30;
    line-height: 1.1;
}
.tu-role {
    font-size: 10px;
    color: #7c8aa8;
    font-weight: 600;
    line-height: 1.1;
    margin-top: 1px;
}
@media (max-width: 768px) {
    .topbar-user .tu-info { display: none; }
    .topbar-user { padding: 5px; }
}
@media (max-width: 480px) {
    .topbar-bell { width: 36px; height: 36px; }
    .topbar-right { gap: 8px; }
}
.topbar h1 {
    font-size: 26px !important;
    font-weight: 700 !important;
    background: linear-gradient(135deg, #0f1a30, #002B5C 40%, #3b82f6) !important;
    -webkit-background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    background-clip: text !important;
    letter-spacing: -0.5px !important;
    margin: 0 !important;
}
.topbar .btn-primary {
    background: linear-gradient(135deg, #002B5C, #3b82f6) !important;
    color: #fff !important;
    border: none !important;
    padding: 10px 18px !important;
    border-radius: 12px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    box-shadow: 0 8px 20px rgba(0,43,92,0.3), inset 0 1px 0 rgba(255,255,255,0.2) !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 7px !important;
    transition: all 0.2s !important;
    font-family: inherit !important;
}
.topbar .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 26px rgba(0,43,92,0.4), inset 0 1px 0 rgba(255,255,255,0.25) !important;
}

/* ---------- CONTENT AREA ---------- */
.content-area {
    background: transparent !important;
    padding: 0 !important;
    border: none !important;
    box-shadow: none !important;
}

/* ---------- TABS ROW ---------- */
.tabs-row {
    margin-bottom: 14px !important;
}
.tabs {
    background: rgba(255,255,255,0.75) !important;
    backdrop-filter: blur(20px);
    border-radius: 12px !important;
    padding: 4px !important;
    border: 1px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 18px rgba(30,64,175,0.06);
    display: inline-flex !important;
    gap: 2px !important;
}
.tab-btn {
    padding: 8px 16px !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    color: #7c8aa8 !important;
    border-radius: 9px !important;
    cursor: pointer !important;
    border: none !important;
    background: none !important;
    font-family: inherit !important;
    transition: all 0.2s !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
}
.tab-btn.active {
    background: linear-gradient(135deg, #002B5C, #3b82f6) !important;
    color: #fff !important;
    box-shadow: 0 6px 14px rgba(0,43,92,0.3) !important;
}
.tab-btn .tab-count {
    font-size: 10px !important;
    padding: 1px 7px !important;
    border-radius: 8px !important;
    margin-left: 0 !important;
    font-weight: 700 !important;
    background: #e5e9f0 !important;
    color: #7c8aa8 !important;
}
.tab-btn.active .tab-count {
    background: rgba(255,255,255,0.25) !important;
    color: #fff !important;
}

/* ---------- STATS STRIP (NEW FORMAT) ---------- */
.stats-strip {
    background: transparent !important;
    border-radius: 0 !important;
    overflow: visible !important;
    margin-bottom: 14px !important;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}
.strip-top {
    background: linear-gradient(135deg, #002B5C 0%, #1e40af 50%, #3b82f6 100%) !important;
    border-radius: 18px !important;
    padding: 18px 22px !important;
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 16px !important;
    align-items: stretch !important;
    box-shadow: 0 14px 32px rgba(0,43,92,0.3) !important;
    position: relative;
    overflow: hidden;
}
.strip-top::before {
    content: '';
    position: absolute;
    top: -50%; right: -10%;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(96,165,250,0.35), transparent 70%);
    pointer-events: none;
}
.strip-top::after {
    content: '';
    position: absolute;
    bottom: -40%; left: 30%;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 70%);
    pointer-events: none;
}
.strip-metrics {
    display: contents !important;
}
.strip-metric {
    padding: 0 !important;
    border-right: none !important;
    position: relative;
    z-index: 1;
}
.strip-metric:not(:last-child)::after {
    content: '';
    position: absolute;
    right: -8px; top: 10%; bottom: 10%;
    width: 1px;
    background: rgba(255,255,255,0.12);
}
.strip-metric .sm-num {
    font-size: 26px !important;
    font-weight: 800 !important;
    color: #fff !important;
    line-height: 1 !important;
    letter-spacing: -0.5px;
}
.strip-metric .sm-lbl {
    font-size: 9.5px !important;
    font-weight: 700 !important;
    color: rgba(255,255,255,0.6) !important;
    text-transform: uppercase !important;
    letter-spacing: 0.6px !important;
    margin-top: 5px !important;
}
.strip-metric.aktive .sm-num { color: #4ade80 !important; }
.strip-metric.skadon-shpejt .sm-num { color: #fbbf24 !important; }
.strip-metric.skaduar .sm-num { color: #fca5a5 !important; }

/* Chip-at e llojeve - hidden nga strip-top, do dalin si rresht i veçantë */
.strip-llojet {
    display: none !important;
}

/* Bottom bar — bashkangjit me strip-top brenda të njëjtës kartelë */
.strip-bottom {
    background: rgba(255,255,255,0.85) !important;
    backdrop-filter: blur(20px);
    padding: 12px 18px !important;
    display: flex !important;
    align-items: center !important;
    gap: 14px !important;
    border-radius: 14px !important;
    border: 1px solid rgba(255,255,255,0.95) !important;
    box-shadow: 0 6px 18px rgba(30,64,175,0.06) !important;
}
.strip-bar {
    flex: 1 !important;
    display: flex !important;
    gap: 2px !important;
    height: 8px !important;
    border-radius: 4px !important;
    overflow: hidden !important;
    background: #eef2fa;
}
.strip-bar-seg { height: 100% !important; transition: width 0.4s ease !important; }
.strip-legend {
    display: flex !important;
    gap: 14px !important;
    flex-shrink: 0 !important;
}
.strip-legend span {
    font-size: 10px !important;
    color: #7c8aa8 !important;
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    font-weight: 600 !important;
}
.strip-legend .sl-dot {
    width: 7px !important; height: 7px !important;
    border-radius: 50% !important;
}

/* ---------- LLOJET ROW (i ri, jashte stats-strip) ---------- */
.llojet-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    padding: 12px 18px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 18px rgba(30,64,175,0.06);
    flex-wrap: wrap;
}
.llojet-row .llojet-label {
    font-size: 10px;
    color: #7c8aa8;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
    margin-right: 4px;
}
.llojet-row #llojet-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.llojet-row .ll-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px 5px 5px;
    border-radius: 8px;
    background: #f0f6ff;
    border: 1px solid rgba(200,220,250,0.7);
    font-size: 11px;
    font-weight: 600;
    color: #1e40af;
}
.llojet-row .ll-chip .ll-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px; height: 20px;
    padding: 0 5px;
    background: linear-gradient(135deg, #002B5C, #3b82f6);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    border-radius: 6px;
}
.llojet-row .ll-chip.individ { background: #eff6ff; color: #1e40af; border-color: #dbeafe; }
.llojet-row .ll-chip.familje { background: #f5f3ff; color: #6d28d9; border-color: #ede9fe; }
.llojet-row .ll-chip.familje .ll-num { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
.llojet-row .ll-chip.biznes { background: #ecfdf5; color: #047857; border-color: #d1fae5; }
.llojet-row .ll-chip.biznes .ll-num { background: linear-gradient(135deg, #047857, #10b981); }

/* ---------- FILTERS ROW ---------- */
.filters-row {
    display: flex !important;
    gap: 8px !important;
    align-items: center !important;
    margin-bottom: 14px !important;
    padding: 10px 14px !important;
    background: rgba(255,255,255,0.75) !important;
    backdrop-filter: blur(20px);
    border-radius: 14px !important;
    border: 1px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 18px rgba(30,64,175,0.06);
}
.filters-row select,
.filters-row input {
    font-family: inherit !important;
    font-size: 12px !important;
    padding: 8px 12px !important;
    border: 1px solid rgba(220,230,250,0.9) !important;
    border-radius: 10px !important;
    background: #fff !important;
    color: #0f1a30 !important;
    font-weight: 600 !important;
    outline: none !important;
    transition: border-color 0.15s;
}
.filters-row select:focus,
.filters-row input:focus { border-color: #3b82f6 !important; }
.filters-row input {
    flex: 1 !important;
    max-width: none !important;
    font-weight: 500 !important;
}
.filters-row input::placeholder { color: #9ca8c0; }
.sort-btns {
    display: flex !important;
    gap: 5px !important;
    margin-left: auto !important;
}
.sort-btn {
    font-family: inherit !important;
    font-size: 11px !important;
    padding: 7px 12px !important;
    border: 1px solid rgba(220,230,250,0.9) !important;
    border-radius: 10px !important;
    background: #fff !important;
    color: #7c8aa8 !important;
    cursor: pointer !important;
    font-weight: 600 !important;
    transition: all 0.15s;
}
.sort-btn.active {
    background: linear-gradient(135deg, #002B5C, #3b82f6) !important;
    color: #fff !important;
    border-color: transparent !important;
    box-shadow: 0 6px 14px rgba(0,43,92,0.3);
}

/* ---------- TABLE ---------- */
.table-container {
    background: rgba(255,255,255,0.85) !important;
    backdrop-filter: blur(20px);
    border-radius: 16px !important;
    overflow: hidden !important;
    border: 1px solid rgba(255,255,255,0.95) !important;
    box-shadow: 0 10px 28px rgba(30,64,175,0.07) !important;
}
.table-container table {
    width: 100% !important;
    border-collapse: collapse !important;
}
.table-container table th {
    font-size: 9.5px !important;
    font-weight: 700 !important;
    color: #7c8aa8 !important;
    text-transform: uppercase !important;
    letter-spacing: 0.5px !important;
    padding: 11px 14px !important;
    background: rgba(240,246,255,0.6) !important;
    text-align: left !important;
    border-bottom: 1px solid rgba(220,230,250,0.7) !important;
}
.table-container table td {
    padding: 11px 14px !important;
    font-size: 12px !important;
    border-bottom: 1px solid rgba(230,235,250,0.5) !important;
    color: #4b5563 !important;
}
.table-container table tbody tr:hover td {
    background: rgba(240,246,255,0.4) !important;
}
.table-container table tbody tr:last-child td { border-bottom: none !important; }

.klient-name {
    font-weight: 700 !important;
    font-size: 12.5px !important;
    color: #0f1a30 !important;
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    flex-wrap: wrap !important;
}
.klient-sub {
    font-size: 10.5px !important;
    color: #9ca8c0 !important;
    margin-top: 2px !important;
}
.skadon-cell {
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    font-size: 11px !important;
    font-weight: 600;
}
.skadon-dot {
    width: 7px !important; height: 7px !important;
    border-radius: 50% !important;
    flex-shrink: 0 !important;
}

/* Badge lloji — flat solid pastel */
.badge-lloji {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1px;
    text-transform: capitalize;
}
.badge-lloji.individ { background: #eff6ff !important; color: #1e40af !important; }
.badge-lloji.familje { background: #f5f3ff !important; color: #6d28d9 !important; }

    <script>
    lucide.createIcons();

    // Mirror i strip-llojet → llojet-chips (bridge pa prekur kontratat.js)
    (function(){
        const llojiNames={individ:'Individ',familje:'Familje',biznes:'Biznes'};
        const llojiClass={individ:'individ',familje:'familje',biznes:'biznes'};
        const target=document.getElementById('llojet-chips');
        const source=document.getElementById('st-llojet');
        if(!target||!source)return;
        function rebuild(){
            // Lexo nga strip-chips qe JS ka injektuar, transformo ne ll-chip
            const chips=source.querySelectorAll('.strip-chip');
            if(chips.length===0){target.innerHTML='<span style="font-size:11px;color:#9ca8c0;font-style:italic">Asnjë lloj i pranishëm</span>';return;}
            const out=[];
            chips.forEach(ch=>{
                const num=ch.querySelector('.sc-num')?.textContent||'0';
                const text=ch.textContent.replace(num,'').trim();
                const key=Object.keys(llojiNames).find(k=>llojiNames[k]===text)||'individ';
                out.push('<span class="ll-chip '+llojiClass[key]+'"><span class="ll-num">'+num+'</span> '+text+'</span>');
            });
            target.innerHTML=out.join('');
        }
        // Observer — sa here qe kontratat.js rifresoj st-llojet, ne mirroroj
        new MutationObserver(rebuild).observe(source,{childList:true,subtree:true});
        // Run i pare pas page load
        setTimeout(rebuild,100);
    })();
    </script>

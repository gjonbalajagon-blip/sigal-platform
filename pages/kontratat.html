<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Kontratat</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/pako-editor.css">
    <script src="../js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.tabs{display:flex;gap:0;background:#e5e9f0;border-radius:8px;padding:2px}.tab-btn{padding:7px 18px;font-size:12px;font-weight:600;color:#6b7a8d;border-radius:6px;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s}.tab-btn.active{background:#fff;color:#002B5C;box-shadow:0 1px 3px rgba(0,0,0,.08)}.tab-btn .tab-count{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:700;background:#e5e9f0;color:#6b7a8d}.tab-btn.active .tab-count{background:#002B5C;color:#fff}
        .stats-strip{background:#002B5C;border-radius:14px;overflow:hidden;margin-bottom:14px}.strip-top{padding:16px 24px;display:flex;align-items:flex-end;justify-content:space-between}.strip-metrics{display:flex;gap:0}.strip-metric{padding:0 20px;border-right:1px solid rgba(255,255,255,.08)}.strip-metric:first-child{padding-left:0}.strip-metric:last-child{border-right:none}.strip-metric .sm-num{font-size:28px;font-weight:800;color:#fff;line-height:1}.strip-metric .sm-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}.strip-metric.aktive .sm-num{color:#4ade80}.strip-metric.skadon-shpejt .sm-num{color:#fbbf24}.strip-metric.skaduar .sm-num{color:#fca5a5}.strip-llojet{display:flex;gap:5px;padding-bottom:4px}.strip-chip{font-size:10px;padding:5px 10px;border-radius:10px;font-weight:500;color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;line-height:1}.strip-chip .sc-num{font-weight:800;font-size:13px;color:#fff}.strip-bottom{background:rgba(0,0,0,.15);padding:10px 24px;display:flex;align-items:center;gap:14px}.strip-bar{flex:1;display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}.strip-bar-seg{height:100%;transition:width .4s ease}.strip-legend{display:flex;gap:10px;flex-shrink:0}.strip-legend span{font-size:9px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px}.strip-legend .sl-dot{width:5px;height:5px;border-radius:1.5px}
        .filters-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}.filters-row select,.filters-row input{font-family:inherit;font-size:11px;padding:6px 10px;border:1px solid #e5e9f0;border-radius:6px;background:#fff;color:#1a2332}.filters-row input{flex:1;max-width:220px}.sort-btns{display:flex;gap:4px;margin-left:auto}.sort-btn{font-family:inherit;font-size:10px;padding:5px 10px;border:1px solid #e5e9f0;border-radius:6px;background:#fff;color:#6b7a8d;cursor:pointer;font-weight:600}.sort-btn.active{background:#002B5C;color:#fff;border-color:#002B5C}
        .table-container table th{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px}.table-container table td{padding:8px 12px;font-size:12px}.klient-name{font-weight:600;font-size:12px;color:#1a2332;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.klient-sub{font-size:10px;color:#b0b8c4;margin-top:1px}.skadon-cell{display:flex;align-items:center;gap:4px;font-size:11px}.skadon-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .action-icon-btns{display:flex;gap:3px}.action-icon-btns button{width:28px;height:28px;border-radius:6px;border:1px solid #e5e9f0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}.action-icon-btns button:hover{background:#f0f4ff;border-color:#0047AB}.action-icon-btns button svg{width:13px;height:13px;stroke:#6b7a8d;stroke-width:2;fill:none}.action-icon-btns button:hover svg{stroke:#0047AB}.action-icon-btns .btn-text{width:auto;padding:0 8px;gap:3px;font-size:10px;font-weight:600;font-family:inherit}.action-icon-btns .btn-text svg{width:12px;height:12px}.action-icon-btns .btn-word{color:#0047AB;border-color:#dbeafe;background:#f0f4ff}.action-icon-btns .btn-word:hover{background:#dbeafe}
        .drawer-extra-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #e5e9f0}
        .drawer-extra-fields .form-group{margin-bottom:0}
        @media(max-width:700px){.drawer-extra-fields{grid-template-columns:1fr 1fr}}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../Sigal-KS-Logo.webp" alt="Sigal Logo"><div class="logo-text"><span class="logo-text-main">SIGAL</span><span class="logo-text-sub">Insurance Group</span></div></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span class="nav-label">Dashboard</span></a>
            <a href="oferta.html" class="nav-item"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item active"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html" class="nav-item logout"><span class="nav-icon"><i data-lucide="log-out"></i></span><span class="nav-label">Dilni</span></a></div>
    </div>
    <div class="main-content">
        <div class="topbar"><h1>Kontratat</h1><button class="btn-primary" onclick="shtoKontrate()"><i data-lucide="plus" style="width:15px;height:15px;"></i> Kontratë e Re</button></div>
        <div class="content-area">
            <div class="tabs-row">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-aktive" onclick="ndryshoTab('aktive')">Aktive <span class="tab-count" id="tab-count-aktive">0</span></button>
                    <button class="tab-btn" id="tab-skaduar" onclick="ndryshoTab('skaduar')">Skaduar <span class="tab-count" id="tab-count-skaduar">0</span></button>
                </div>
            </div>
            <div class="stats-strip">
                <div class="strip-top">
                    <div class="strip-metrics">
                        <div class="strip-metric"><div class="sm-num" id="st-total">0</div><div class="sm-lbl">Total</div></div>
                        <div class="strip-metric aktive"><div class="sm-num" id="st-aktive">0</div><div class="sm-lbl">Aktive</div></div>
                        <div class="strip-metric skadon-shpejt"><div class="sm-num" id="st-skadon">0</div><div class="sm-lbl">Skadon shpejt</div></div>
                        <div class="strip-metric skaduar"><div class="sm-num" id="st-skaduar">0</div><div class="sm-lbl">Skaduar</div></div>
                    </div>
                    <div class="strip-llojet" id="st-llojet"></div>
                </div>
                <div class="strip-bottom"><div class="strip-bar" id="st-bar"></div><div class="strip-legend" id="st-legend"></div></div>
            </div>
            <div class="filters-row">
                <select id="filter-lloji" onchange="filtro()"><option value="all">Të gjitha llojet</option><option value="individ">Individ</option><option value="familje">Familje</option><option value="biznes">Biznes</option></select>
                <input type="text" id="search-kontrate" placeholder="Kërko kontratë..." onkeyup="filtro()">
                <div class="sort-btns"><button class="sort-btn active" id="sort-skadon" onclick="ndryshoSort('skadon')">Skadon shpejt</button><button class="sort-btn" id="sort-re" onclick="ndryshoSort('re')">Më e re</button></div>
            </div>
            <div class="table-container">
                <table><thead><tr><th>Klienti</th><th style="width:70px">Nr. ID</th><th style="width:80px">Lloji</th><th>Pakot</th><th style="width:75px">Fillimi</th><th style="width:60px">Skadon</th><th style="width:70px">Statusi</th><th style="width:160px">Veprimet</th></tr></thead><tbody id="kontratat-tbody"></tbody></table>
            </div>
        </div>
    </div>
    <!-- DRAWER -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="if(event.target===this)mbyllDrawer()">
        <div class="drawer-panel">
            <div class="drawer-panel-header"><h2 id="modal-title">Kontratë e Re</h2><button class="drawer-close" onclick="mbyllDrawer()">✕</button></div>
            <div class="drawer-body">
                <div class="form-row">
                    <div class="form-group"><label>Emri Mbiemri / Kompania</label><input id="m-emri" placeholder="Emri Mbiemri / Kompania"></div>
                    <div class="form-group"><label>Email</label><input id="m-email" type="email" placeholder="email@example.com"></div>
                </div>
                <input type="hidden" id="m-lloji" value="individ">
                <div class="drawer-lloji-row">
                    <button class="drawer-lloji-btn active" onclick="zgjidhLlojin('individ',this)">Individuale</button>
                    <button class="drawer-lloji-btn" onclick="zgjidhLlojin('familje',this)">Familjare</button>
                    <button class="drawer-lloji-btn" onclick="zgjidhLlojin('biznes',this)">Biznese</button>
                </div>
                <div id="pakot-container"></div>
                <div class="drawer-extra-fields">
                    <div class="form-group"><label>Adresa</label><input id="m-adresa" placeholder="Rruga, Qyteti"></div>
                    <div class="form-group" id="field-nr-personal"><label>Nr. ID</label><input id="m-nr-personal" placeholder="Nr. Personal"></div>
                    <div class="form-group" id="field-nr-biznesit" style="display:none"><label>NRB</label><input id="m-nr-biznesit" placeholder="NIPT/Nr. Fiskal"></div>
                    <div class="form-group" id="field-perfaqesuesi" style="display:none"><label>Përfaqësuesi</label><input id="m-perfaqesuesi" placeholder="Emri i përfaqësuesit"></div>
                    <div class="form-group" id="field-pozita" style="display:none"><label>Pozita</label><input id="m-pozita" placeholder="Pozita"></div>
                    <div class="form-group"><label>Data e Kontratës</label><input id="m-data-kontrates" placeholder="dd/mm/yyyy" maxlength="10"></div>
                    <div class="form-group"><label>Data Fillimit</label><input id="m-fillimi" placeholder="dd/mm/yyyy" maxlength="10"></div>
                    <div class="form-group"><label>Data Mbarimit</label><input id="m-mbarimi" placeholder="dd/mm/yyyy" maxlength="10"></div>
                    <div class="form-group"><label>Faturimi</label><select id="m-faturimi-lloji"><option value="mujor">Mujor</option><option value="vjetor">Vjetor</option></select></div>
                </div>
                <div class="sp-actions">
                    <button class="sp-btn" onclick="mbyllDrawer()">Anulo</button>
                    <button class="sp-btn primary" onclick="ruajKontrate()">Ruaj</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/pakot.js"></script>
    <script src="../js/kontratat.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Oferta</title>
    <link rel="stylesheet" href="../css/theme-v2.css">
    <link rel="stylesheet" href="../css/pako-editor.css">
    <script src="../js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ====== SPECIFIKE PËR OFERTA ====== */

        /* Version panel */
        .version-panel {
            margin-top: 16px;
            border: 1px solid var(--s-border-light);
            border-radius: var(--r-md);
            overflow: hidden;
            background: rgba(255,255,255,0.5);
        }
        .version-panel-header {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px;
            background: rgba(240,246,255,0.5);
            cursor: pointer;
            border-bottom: 1px solid var(--s-border-light);
        }
        #history-arrow {
            font-size: 10px; color: var(--s-brand-dark);
            transition: transform 0.15s;
        }
        #history-label {
            font-size: 12px; font-weight: 700; color: var(--s-brand-dark);
            flex: 1;
        }
        #version-count {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: linear-gradient(135deg, var(--s-brand-dark), var(--s-brand));
            color: #fff; font-weight: 700;
        }
        #version-body { max-height: 400px; overflow-y: auto; padding: 0; }

        /* Pakot cell në tabelë */
        .pakot-cell {
            font-size: 11px; color: var(--s-text-sub);
            max-width: 220px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
            display: inline-block; vertical-align: middle;
        }
        .pakot-cell .pakot-more {
            background: #eef2ff; color: var(--s-brand-dark);
            font-size: 9px; padding: 2px 6px;
            border-radius: 8px; font-weight: 800; margin-left: 4px;
        }

        /* Version count badge pranë emrit */
        .version-badge {
            background: #eef2ff; color: var(--s-brand-dark);
            font-size: 9px; padding: 2px 6px;
            border-radius: 8px; font-weight: 800; margin-left: 4px;
        }

        /* Notification dot */
        .notif-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--s-red-dot); display: inline-block;
            vertical-align: middle; margin-left: 3px;
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2);
        }

        /* Track badge për status të ofertës */
        .track-badge {
            font-size: 10px; font-weight: 700;
            padding: 3px 9px; border-radius: 10px;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
        }
        .track-badge.e_krijuar  { background: #f1f5f9;  color: #475569; }
        .track-badge.e_derguar  { background: #dbeafe;  color: #1e40af; }
        .track-badge.e_pare     { background: #fef3c7;  color: #92400e; }
        .track-badge.e_konfirmuar {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            color: var(--s-green); border: 1px solid rgba(16,185,129,0.25);
        }
        .track-badge.kontrate {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: var(--s-brand-dark); border: 1px solid rgba(59,130,246,0.25);
        }

        /* Konfirmim banner (brenda drawer kur konfirmuar) */
        #konfirmim-banner {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: var(--r-md);
            padding: 12px 14px;
            margin: 0 0 14px 0;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }

        /* Drawer body padding reset — për pakot-container të shfrytëzojë hapësirën */
        .drawer-panel { max-width: 960px; }
        .drawer-panel-body { padding: 18px 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="../Sigal-KS-Logo.webp" alt="Sigal Logo">
            <div class="logo-text">
                <span class="logo-text-main">SIGAL</span>
                <span class="logo-text-sub">Insurance Group</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item" data-label="Dashboard"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span class="nav-label">Dashboard</span></a>
            <a href="oferta.html" class="nav-item active" data-label="Oferta"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item" data-label="Kontratat"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item" data-label="Faturimi"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="rinovimet.html" class="nav-item" data-label="Rinovimet"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="debitoret.html" class="nav-item" data-label="Debitorët"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="raportet.html" class="nav-item" data-label="Raportet"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="#" class="nav-item" data-label="Detyrat"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="#" class="nav-item" data-label="Dokumentet"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item" data-label="Stafi"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>

        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout"><span class="nav-icon"><i data-lucide="log-out"></i></span><span class="nav-label">Dilni</span></a>
        </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Oferta</h1>
            <div class="topbar-right">
                <button class="btn-primary" onclick="shtoOferte()">
                    <i data-lucide="plus"></i> Ofertë e Re
                </button>
                <!-- bell + user tag injektohen automatikisht nga main.js -->
            </div>
        </div>

        <div class="content-area">
            <!-- Tabs + Period filter -->
            <div class="tabs-row">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-aktive" onclick="ndryshoTab('aktive')">Aktive <span class="tab-count" id="tab-count-aktive">0</span></button>
                    <button class="tab-btn" id="tab-skaduar" onclick="ndryshoTab('skaduar')">Skaduar <span class="tab-count" id="tab-count-skaduar">0</span></button>
                </div>
                <div class="tabs-filters">
                    <label style="font-size:11px;color:var(--s-text-muted);font-weight:600;">Viti:</label>
                    <select id="filter-viti" class="filter-select" onchange="ndryshoViti();filtro()">
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                    </select>
                    <label style="font-size:11px;color:var(--s-text-muted);font-weight:600;margin-left:4px;">Muaji:</label>
                    <select id="filter-muaji" class="filter-select" onchange="filtro()">
                        <option value="all">Total</option>
                        <option value="01">Janar</option>
                        <option value="02">Shkurt</option>
                        <option value="03">Mars</option>
                        <option value="04">Prill</option>
                        <option value="05">Maj</option>
                        <option value="06">Qershor</option>
                        <option value="07">Korrik</option>
                        <option value="08">Gusht</option>
                        <option value="09">Shtator</option>
                        <option value="10">Tetor</option>
                        <option value="11">Nëntor</option>
                        <option value="12">Dhjetor</option>
                    </select>
                </div>
            </div>

            <!-- KPI Cards (clickable për filtrim sipas track status) -->
            <div class="stats-strip">
                <div class="kpi-card" data-filter="all">
                    <div class="kpi-icon kpi-icon-total"><i data-lucide="bar-chart-3"></i></div>
                    <div class="kpi-body">
                        <div class="sm-lbl">Total</div>
                        <div class="sm-num" id="st-total">0</div>
                    </div>
                    <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                </div>
                <div class="kpi-card" data-filter="presin">
                    <div class="kpi-icon kpi-icon-skadon"><i data-lucide="clock"></i></div>
                    <div class="kpi-body">
                        <div class="sm-lbl">Presin përgjigje</div>
                        <div class="sm-num skadon-num" id="st-presin">0</div>
                    </div>
                    <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                </div>
                <div class="kpi-card" data-filter="konfirmuar">
                    <div class="kpi-icon kpi-icon-aktive"><i data-lucide="check-circle"></i></div>
                    <div class="kpi-body">
                        <div class="sm-lbl">Konfirmuar</div>
                        <div class="sm-num aktive-num" id="st-konfirmuar">0</div>
                    </div>
                    <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                </div>
                <div class="kpi-card" data-filter="kontrate">
                    <div class="kpi-icon kpi-icon-total"><i data-lucide="file-check"></i></div>
                    <div class="kpi-body">
                        <div class="sm-lbl">Realizuar</div>
                        <div class="sm-num" id="st-realizuar" style="color:var(--s-brand-dark)">0</div>
                    </div>
                    <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                </div>
            </div>

            <!-- Filters + Sort (pa filter-lloji/statusi — e bëjnë chips + KPI) -->
            <div class="filters-row">
                <!-- MAJTAS: Llojet chips (zëvendësojnë select-in) -->
                <div id="llojet-chips" class="llojet-chips-inline"></div>
                <!-- filter-lloji i fshehur për kompatibilitet (chips e përditësojnë) -->
                <select id="filter-lloji" onchange="filtro()" style="display:none">
                    <option value="all">all</option>
                    <option value="individ">individ</option>
                    <option value="familje">familje</option>
                    <option value="biznes">biznes</option>
                </select>
                <select id="filter-krijuar" class="filter-select" onchange="filtro()">
                    <option value="all">Të gjithë agjentët</option>
                </select>
                <input type="text" id="search-oferte" placeholder="Kërko ofertë..." onkeyup="filtro()">
                <!-- filter-statusi i fshehur për kompatibilitet me KPI -->
                <select id="filter-statusi" style="display:none">
                    <option value="all">Të gjitha statuset</option>
                </select>
                <div class="sort-btns">
                    <button class="sort-btn active" id="sort-skadon" onclick="ndryshoSort('skadon')">Skadon shpejt</button>
                    <button class="sort-btn" id="sort-re" onclick="ndryshoSort('re')">Më e re</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Klienti</th>
                            <th style="width:90px;">Lloji</th>
                            <th>Pakot</th>
                            <th style="width:90px;">Skadon</th>
                            <th style="width:110px;">Statusi</th>
                            <th style="width:220px;text-align:right;">Veprimet</th>
                        </tr>
                    </thead>
                    <tbody id="ofertat-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ====== DRAWER ====== -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="if(event.target===this)mbyllDrawer()">
        <div class="drawer-panel">
            <div class="drawer-panel-header">
                <h2 id="modal-title">Ofertë <span style="font-weight:500">e Re</span></h2>
                <button class="drawer-close" onclick="mbyllDrawer()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="drawer-panel-body">
                <div class="form-grid">
                    <div class="form-group"><label>Emri Mbiemri</label><input id="m-emri" placeholder="Emri Mbiemri / Kompania"></div>
                    <div class="form-group"><label>Email</label><input id="m-email" type="email" placeholder="email@example.com"></div>
                </div>
                <div class="drawer-extra-fields" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--s-border-light);">
                    <div class="form-group"><label>Kërkuar nga</label>
                        <select id="m-kerkuar-nga" onchange="tregoBoxAgjenti()">
                            <option value="direkt">Direkt</option>
                            <option value="online">Online</option>
                            <option value="agjenti">Agjenti</option>
                        </select>
                    </div>
                    <div class="form-group" id="field-agjenti" style="display:none"><label>Emri i Agjentit</label><input id="m-agjenti" placeholder="Emri i agjentit"></div>
                </div>

                <input type="hidden" id="m-lloji" value="individ">

                <div class="lloji-selector" style="margin-top:18px;">
                    <button class="lloji-btn drawer-lloji-btn active" onclick="zgjidhLlojin('individ',this)">Individuale</button>
                    <button class="lloji-btn drawer-lloji-btn" onclick="zgjidhLlojin('familje',this)">Familjare</button>
                    <button class="lloji-btn drawer-lloji-btn" onclick="zgjidhLlojin('biznes',this)">Biznese</button>
                </div>

                <div id="pakot-container"></div>

                <div class="version-panel" id="version-panel" style="display:none">
                    <div class="version-panel-header" onclick="toggleVersions()">
                        <span id="history-arrow">▸</span>
                        <span id="history-label">Historiku i ofertës</span>
                        <span id="version-count">0</span>
                    </div>
                    <div id="version-body" style="display:none;"></div>
                </div>
            </div>
            <div class="drawer-footer">
                <button class="btn-cancel" onclick="mbyllDrawer()" type="button">Anulo</button>
                <button class="btn-save" onclick="ruajOferte()" type="button"><i data-lucide="check"></i> Ruaj</button>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/pakot.js"></script>
    <script src="../js/oferta.js"></script>
    <script src="../js/oferta-tracking.js"></script>
    <script>
        lucide.createIcons();

        // KPI clickable filter — mbush filter-statusi të fshehur
        document.addEventListener('DOMContentLoaded', function() {
            const kpiCards = document.querySelectorAll('.kpi-card[data-filter]');
            let activeKpi = 'all';
            const allCard = document.querySelector('.kpi-card[data-filter="all"]');
            if (allCard) allCard.classList.add('kpi-active');

            kpiCards.forEach(card => {
                card.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    if (activeKpi === filter && filter !== 'all') {
                        activeKpi = 'all';
                    } else {
                        activeKpi = filter;
                    }
                    kpiCards.forEach(c => c.classList.remove('kpi-active'));
                    document.querySelector('.kpi-card[data-filter="'+activeKpi+'"]').classList.add('kpi-active');

                    // Mbush filter-statusi fshehur me value që kupton kodi ekzistues
                    const statusSel = document.getElementById('filter-statusi');
                    if (!statusSel) return;
                    if (activeKpi === 'all') statusSel.value = 'all';
                    else if (activeKpi === 'presin') {
                        // "presin" = e_krijuar + e_derguar + e_pare (multi) — përdor flag
                        window.__ofertaKpiGroup = 'presin';
                        statusSel.value = 'all'; // reset
                    } else if (activeKpi === 'konfirmuar') {
                        window.__ofertaKpiGroup = null;
                        statusSel.value = 'e_konfirmuar';
                    } else if (activeKpi === 'kontrate') {
                        window.__ofertaKpiGroup = null;
                        statusSel.value = 'kontrate';
                    } else {
                        window.__ofertaKpiGroup = null;
                    }
                    if (activeKpi !== 'presin') window.__ofertaKpiGroup = null;
                    if (typeof filtro === 'function') filtro();
                });
            });
        });
    </script>
</body>
</html>

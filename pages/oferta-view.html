<body>
    <div class="header">
        <img src="../Sigal-KS-Logo.webp" alt="Sigal">
        <h1>Sigal KS Insurance Group</h1>
    </div>
    <div class="container" id="container">
        <div class="nuk-gjendet">Duke ngarkuar...</div>
    </div>
    <div class="popup-overlay" id="popup-optional">
        <div class="popup">
            <h3>Shtoni mbrojtje shtesë?</h3>
            <p>Pakot opsionale ofrojnë mbrojtje shtesë për ju dhe familjen tuaj. A dëshironi t'i shqyrtoni?</p>
            <div class="popup-btns">
                <button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button>
                <button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button>
            </div>
        </div>
    </div>
    <script src="../js/pakot.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const ofertaId = params.get('id');
        let ofertaData = null;
        let pakotZgjedhuraGlobal = [];

        const RRJETI = {
            spitalet: [{e:'Spitali Amerikan',q:'Prishtinë'},{e:'Spitali "Lindja"',q:'Prishtinë'},{e:'Klinika Kirurgjike "Aloka"',q:'Prishtinë'},{e:'Spitali Fati Im',q:'Prishtinë'},{e:'Spitali Bahçeçi',q:'Prishtinë–Shkup km9'},{e:'Spitali IHC',q:'Prishtinë–Ferizaj km5'},{e:'Klinika Gjermane e Syrit',q:'Prishtinë'},{e:'Olive Medical Group',q:'Prishtinë'},{e:'Spitali Royal Medical',q:'Prishtinë–Ferizaj km15'},{e:'United Hospital',q:'Prishtinë–Ferizaj km7'}],
            laboratoret: [{e:'ProLab',q:'Prishtinë'},{e:'ImunoLab',q:'Prishtinë'},{e:'Avicena',q:'Prishtinë'},{e:'E-Lab',q:'Prishtinë'},{e:'Mikrobioanaliza',q:'Prishtinë'}],
            dentaret: [{e:'Melisa Dent',q:'Prishtinë'},{e:'Dental Clinic Stomatologjia',q:'Prishtinë'},{e:'Klinika Gjermane e Dhëmbit',q:'Prishtinë'},{e:'Mikro & Dent',q:'Prishtinë'},{e:'Top Dent',q:'Prishtinë'},{e:'Dent In',q:'Prishtinë'}],
            ordinanca: [{e:'Optika Neziri',q:'Prishtinë',z:'10-50%'},{e:'Optika Simoni',q:'Prishtinë',z:'20%'},{e:'DIDA & ROKA Eye Clinic',q:'Prishtinë',z:'10%'},{e:'Farmacia Ime',q:'Prishtinë',z:'10%'},{e:'VSO Clinic',q:'Prishtinë',z:'Paketë 30€'},{e:'Poliklinika Diagnoza',q:'Gjilan',z:'20%'},{e:'IDMG Swiss Clinique 2',q:'Gjilan',z:'20%'},{e:'Biolab',q:'Gjilan',z:'20%'},{e:'Physio Move',q:'Prishtinë',z:'20%'},{e:'Cambridge Clinical Lab',q:'Prishtinë',z:'20%'}]
        };

        const ICONS = {
            hospitalore: '<svg viewBox="0 0 24 24"><path d="M3 21h18M9 8h6M12 8v6M9 21V8a3 3 0 0 1 3-3h0a3 3 0 0 1 3 3v13" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            ambulantore: '<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg>',
            tjera: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        };

        function getColorClass(emri) {
            const e = emri.toLowerCase().replace(/\s+/g, '_');
            if (e === 'bazë' || e === 'baze') return 'pako-color-baze';
            if (e === 'standard') return 'pako-color-standard';
            if (e === 'standard_plus') return 'pako-color-standard_plus';
            if (e === 'premium') return 'pako-color-premium';
            if (e === 'silver') return 'pako-color-silver';
            if (e === 'gold') return 'pako-color-gold';
            return 'pako-color-standard';
        }

        function gjenerTags(p) {
            const t = p.tags || {};
            let html = '<div class="pako-tags">';
            if (t.hospitalore) html += '<span class="cat-tag green">Hospitalizim ' + t.hospitalore + '</span>';

<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Oferta Juaj</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; background: #f4f6f9; color: #1a2332; }

        /* Header */
        .header { background: #002B5C; padding: 16px 24px; display: flex; align-items: center; gap: 14px; }
        .header img { height: 44px; }
        .header h1 { color: white; font-size: 16px; font-weight: 600; }

        /* Container */
        .container { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }

        /* Oferta header */
        .oferta-header { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #e5e9f0; }
        .oferta-header h2 { font-size: 18px; color: #002B5C; margin-bottom: 6px; font-weight: 700; }
        .oferta-header p { color: #6b7a8d; font-size: 13px; line-height: 1.5; }
        .oferta-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
        .oferta-meta span { font-size: 11px; color: #6b7a8d; background: #f4f6f9; padding: 4px 10px; border-radius: 20px; }

        /* Progress bar */
        .progress-bar { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
        .progress-step { flex: 1; text-align: center; position: relative; }
        .progress-step .step-dot { width: 28px; height: 28px; border-radius: 50%; background: #e5e9f0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #6b7a8d; margin-bottom: 4px; transition: all 0.3s; }
        .progress-step.active .step-dot { background: #002B5C; color: white; }
        .progress-step.done .step-dot { background: #22c55e; color: white; }
        .progress-step .step-label { font-size: 10px; color: #6b7a8d; display: block; }
        .progress-step.active .step-label { color: #002B5C; font-weight: 600; }
        .progress-line { flex: 0 0 40px; height: 2px; background: #e5e9f0; margin-bottom: 18px; }
        .progress-line.done { background: #22c55e; }

        /* Section titles */
        .section-title { font-size: 13px; font-weight: 700; color: #002B5C; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Pako cards - compact */
        .pako-card {
            background: white;
            border-radius: 10px;
            border: 2px solid #e5e9f0;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }
        .pako-card:hover { border-color: #b0c4de; }
        .pako-card.selected { border-color: #002B5C; box-shadow: 0 0 0 1px #002B5C; }
        .pako-top {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
        }
        .pako-top input[type=checkbox] { width: 18px; height: 18px; accent-color: #002B5C; cursor: pointer; flex-shrink: 0; }
        .pako-top .pako-info { flex: 1; }
        .pako-top .pako-name { font-size: 14px; font-weight: 700; color: #002B5C; }
        .pako-top .pako-zone { font-size: 11px; color: #6b7a8d; margin-top: 1px; }
        .pako-top .pako-price { font-size: 18px; font-weight: 800; color: #002B5C; white-space: nowrap; }
        .pako-top .pako-price-sub { font-size: 10px; font-weight: 400; color: #6b7a8d; }

        /* Foldable sections */
        .pako-details { display: none; }
        .pako-card.selected .pako-details,
        .pako-card.expanded .pako-details { display: block; }
        .pako-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            font-size: 11px;
            color: #0047AB;
            cursor: pointer;
            border-top: 1px solid #f0f0f0;
            background: #fafbfc;
            gap: 4px;
        }
        .pako-toggle:hover { background: #f0f2f5; }
        .detail-section {
            border-top: 1px solid #f0f0f0;
        }
        .detail-section-header {
            padding: 8px 16px;
            background: #002B5C;
            color: white;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .detail-section-header .fold-arrow { font-size: 10px; transition: transform 0.2s; }
        .detail-section-header.open .fold-arrow { transform: rotate(180deg); }
        .detail-rows { display: none; }
        .detail-rows.open { display: block; }
        .detail-row {
            display: flex;
            padding: 6px 16px;
            font-size: 12px;
            border-bottom: 1px solid #f5f5f5;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .dr-label { flex: 1; color: #6b7a8d; }
        .detail-row .dr-value { flex: 1; font-weight: 600; color: #1a2332; text-align: right; }

        /* Primet summary row */
        .primi-row {
            display: flex;
            padding: 10px 16px;
            background: #f0f4ff;
            border-top: 1px solid #e5e9f0;
        }
        .primi-row .dr-label { flex: 1; font-size: 12px; font-weight: 600; color: #002B5C; }
        .primi-row .dr-value { font-size: 14px; font-weight: 800; color: #002B5C; }

        /* Optional packages (Pika 11) */
        .optional-section { margin-top: 24px; }
        .optional-card {
            background: white;
            border: 2px solid #e5e9f0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .optional-card:hover { border-color: #b0c4de; }
        .optional-card.selected { border-color: #002B5C; background: #f0f4ff; }
        .optional-card input[type=checkbox] { width: 18px; height: 18px; accent-color: #002B5C; }
        .opt-info { flex: 1; }
        .opt-info h4 { font-size: 13px; font-weight: 700; color: #002B5C; }
        .opt-info p { font-size: 11px; color: #6b7a8d; margin-top: 2px; line-height: 1.4; }
        .opt-badge { background: #002B5C; color: white; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }

        /* Koment */
        .koment-box { background: white; border-radius: 10px; padding: 18px; margin-top: 24px; border: 1px solid #e5e9f0; }
        .koment-box h3 { margin-bottom: 8px; color: #002B5C; font-size: 13px; font-weight: 700; }
        .koment-box textarea { width: 100%; border: 1px solid #e5e9f0; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 12px; resize: vertical; min-height: 70px; }

        /* Action buttons (Pika 7) */
        .action-buttons { display: flex; gap: 10px; margin-top: 16px; }
        .btn-confirm {
            flex: 2;
            background: #002B5C;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .btn-confirm:hover { background: #0047AB; }
        .btn-change {
            flex: 1;
            background: white;
            color: #002B5C;
            border: 2px solid #e5e9f0;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-change:hover { border-color: #002B5C; background: #f8fafc; }

        /* Countdown badge */
        .countdown { display: inline-flex; align-items: center; gap: 4px; background: #fff3cd; color: #856404; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .countdown.urgent { background: #f8d7da; color: #721c24; }

        /* Ad banner (Pika 9) */
        .app-banner {
            background: linear-gradient(135deg, #002B5C 0%, #0047AB 100%);
            border-radius: 12px;
            padding: 20px 20px;
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
        }
        .app-banner-icon {
            width: 48px; height: 48px; background: rgba(255,255,255,0.15);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .app-banner-icon svg { stroke: white; }
        .app-banner-text h4 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .app-banner-text p { font-size: 11px; opacity: 0.85; line-height: 1.4; }
        .app-banner-btn {
            background: white;
            color: #002B5C;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Medical network (Pika 10) */
        .network-section { margin-top: 20px; background: white; border-radius: 12px; border: 1px solid #e5e9f0; overflow: hidden; }
        .network-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .network-header:hover { background: #f8fafc; }
        .network-header h4 { font-size: 13px; font-weight: 700; color: #002B5C; display: flex; align-items: center; gap: 8px; }
        .network-header .net-count { background: #002B5C; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
        .network-body { display: none; border-top: 1px solid #e5e9f0; }
        .network-body.open { display: block; }
        .net-category { padding: 8px 18px; background: #002B5C; color: white; font-size: 11px; font-weight: 700; }
        .net-item { display: flex; align-items: center; padding: 8px 18px; font-size: 12px; border-bottom: 1px solid #f5f5f5; gap: 8px; }
        .net-item:last-child { border-bottom: none; }
        .net-dot { width: 6px; height: 6px; border-radius: 50%; background: #0047AB; flex-shrink: 0; }
        .net-item .net-name { font-weight: 600; color: #1a2332; flex: 1; }
        .net-item .net-loc { font-size: 11px; color: #6b7a8d; }

        /* Popup (Pika 11) */
        .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .popup-overlay.active { display: flex; }
        .popup {
            background: white; border-radius: 12px; padding: 28px; max-width: 420px; width: 90%;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .popup h3 { font-size: 16px; color: #002B5C; margin-bottom: 8px; }
        .popup p { font-size: 13px; color: #6b7a8d; margin-bottom: 20px; line-height: 1.5; }
        .popup-btns { display: flex; gap: 10px; }
        .popup-btns button { flex: 1; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .popup-skip { background: #f4f6f9; border: 1px solid #e5e9f0; color: #6b7a8d; }
        .popup-add { background: #002B5C; border: none; color: white; }

        /* Success */
        .success-msg { text-align: center; padding: 60px 20px; }
        .success-msg .check { width: 56px; height: 56px; background: #22c55e; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .success-msg .check svg { stroke: white; }
        .success-msg h2 { color: #002B5C; margin-bottom: 8px; font-size: 20px; }
        .success-msg p { color: #6b7a8d; font-size: 14px; }
        .nuk-gjendet { text-align: center; padding: 80px 20px; color: #888; }

        /* Social proof */
        .social-proof { text-align: center; margin-top: 16px; font-size: 11px; color: #6b7a8d; }
        .social-proof strong { color: #002B5C; }

        /* Footer */
        .oferta-footer { text-align: center; margin-top: 32px; font-size: 11px; color: #aaa; padding: 16px; }

        @media (max-width: 600px) {
            .action-buttons { flex-direction: column; }
            .app-banner { flex-direction: column; text-align: center; }
            .pako-top .pako-price { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="../Sigal-KS-Logo.webp" alt="Sigal">
        <h1>Sigal KS Insurance Group</h1>
    </div>
    <div class="container" id="container">
        <div class="nuk-gjendet">Duke ngarkuar...</div>
    </div>

    <!-- Popup per pakot opsionale -->
    <div class="popup-overlay" id="popup-optional">
        <div class="popup">
            <h3>Shtoni mbrojtje shtesë?</h3>
            <p>Pakot opsionale ofrojnë mbrojtje shtesë për ju dhe familjen tuaj. A dëshironi t'i shqyrtoni?</p>
            <div class="popup-btns">
                <button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button>
                <button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button>
            </div>
        </div>
    </div>

    <script src="../js/pakot.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const ofertaId = params.get('id');
        let ofertaData = null;
        let pakotZgjedhuraGlobal = [];

        // Rrjeti mjekesor data
        const RRJETI = {
            spitalet: [
                { emri: 'Spitali Amerikan', qyteti: 'Prishtinë', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'Spitali "Lindja"', qyteti: 'Prishtinë', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'Klinika Kirurgjike "Aloka"', qyteti: 'Prishtinë', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'Spitali Fati Im', qyteti: 'Prishtinë', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'Spitali Bahçeçi', qyteti: 'Prishtinë–Shkup km9', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'Spitali IHC', qyteti: 'Prishtinë–Ferizaj km5', sherbimi: 'Shërbime kontraktuese' },
                { emri: 'Klinika Gjermane e Syrit', qyteti: 'Prishtinë', sherbimi: 'Shërbime kontraktuese' },
                { emri: 'Olive Medical Group', qyteti: 'Prishtinë', sherbimi: 'Shërbime kontraktuese' },
                { emri: 'Spitali Royal Medical', qyteti: 'Prishtinë–Ferizaj km15', sherbimi: 'Hospitalizim & Lindje' },
                { emri: 'United Hospital', qyteti: 'Prishtinë–Ferizaj km7', sherbimi: 'Shërbime kontraktuese' }
            ],
            laboratoret: [
                { emri: 'ProLab', qyteti: 'Prishtinë' },
                { emri: 'ImunoLab', qyteti: 'Prishtinë' },
                { emri: 'Avicena', qyteti: 'Prishtinë' },
                { emri: 'E-Lab', qyteti: 'Prishtinë' },
                { emri: 'Mikrobioanaliza', qyteti: 'Prishtinë' }
            ],
            dentaret: [
                { emri: 'Melisa Dent', qyteti: 'Prishtinë' },
                { emri: 'Dental Clinic Stomatologjia', qyteti: 'Prishtinë' },
                { emri: 'Klinika Gjermane e Dhëmbit', qyteti: 'Prishtinë' },
                { emri: 'Mikro & Dent', qyteti: 'Prishtinë' },
                { emri: 'Top Dent', qyteti: 'Prishtinë' },
                { emri: 'Dent In', qyteti: 'Prishtinë' }
            ],
            ordinanca: [
                { emri: 'Optika Neziri', qyteti: 'Prishtinë', zbritje: '10-50%' },
                { emri: 'Optika Simoni', qyteti: 'Prishtinë', zbritje: '20%' },
                { emri: 'DIDA & ROKA Eye Clinic', qyteti: 'Prishtinë', zbritje: '10%' },
                { emri: 'Farmacia Ime', qyteti: 'Prishtinë', zbritje: '10%' },
                { emri: 'VSO Clinic', qyteti: 'Prishtinë', zbritje: 'Paketë 30€' },
                { emri: 'Poliklinika Diagnoza', qyteti: 'Gjilan', zbritje: '20%' },
                { emri: 'IDMG Swiss Clinique 2', qyteti: 'Gjilan', zbritje: '20%' },
                { emri: 'Biolab', qyteti: 'Gjilan', zbritje: '20%' },
                { emri: 'Physio Move', qyteti: 'Prishtinë', zbritje: '20%' },
                { emri: 'Cambridge Clinical Lab', qyteti: 'Prishtinë', zbritje: '20%' }
            ]
        };

        function ngarko() {
            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            const oferta = ofertat[ofertaId];

            if (!oferta) {
                document.getElementById('container').innerHTML = '<div class="nuk-gjendet"><h2>Oferta nuk u gjet.</h2><p>Kontaktoni agentin tuaj.</p></div>';
                return;
            }

            ofertaData = oferta;
            const pakotList = oferta.lloji === 'individ' ? PAKOT.individ : PAKOT.familje_biznes;
            pakotZgjedhuraGlobal = pakotList.filter(p =>
                (oferta.pakot || []).some(op =>
                    (typeof op === 'object' ? op.id : op) === p.id ||
                    (typeof op === 'string' && op.toLowerCase().includes(p.emri.toLowerCase()))
                )
            ).map(p => {
                const custom = (oferta.pakot || []).find(op => typeof op === 'object' && op.id === p.id);
                return custom ? { ...p, ...custom } : p;
            });

            if (pakotZgjedhuraGlobal.length === 0) {
                document.getElementById('container').innerHTML = '<div class="nuk-gjendet"><h2>Nuk ka paketa në këtë ofertë.</h2></div>';
                return;
            }

            const eshteIndivid = oferta.lloji === 'individ';
            const diteMbetur = Math.ceil((new Date(oferta.dataSkadon) - new Date()) / (1000*60*60*24));
            const countdownClass = diteMbetur <= 5 ? 'countdown urgent' : 'countdown';
            const totalInst = RRJETI.spitalet.length + RRJETI.laboratoret.length + RRJETI.dentaret.length + RRJETI.ordinanca.length;

            document.getElementById('container').innerHTML = `
                <!-- Progress bar -->
                <div class="progress-bar">
                    <div class="progress-step done"><span class="step-dot">✓</span><span class="step-label">Shiko ofertën</span></div>
                    <div class="progress-line done"></div>
                    <div class="progress-step active"><span class="step-dot">2</span><span class="step-label">Zgjedh paketën</span></div>
                    <div class="progress-line"></div>
                    <div class="progress-step"><span class="step-dot">3</span><span class="step-label">Konfirmo</span></div>
                </div>

                <!-- Header -->
                <div class="oferta-header">
                    <h2>Ofertë për ${oferta.emri}</h2>
                    <p>Zgjidhni paketën/pakot që ju përshtaten dhe konfirmoni zgjedhjen tuaj. Mundeni të zgjidhni më shumë se një paketë.</p>
                    <div class="oferta-meta">
                        <span class="${countdownClass}">⏱ Skadon për ${diteMbetur > 0 ? diteMbetur + ' ditë' : 'Skaduar'}</span>
                        <span>📅 Krijuar: ${oferta.dataKrijimit}</span>
                    </div>
                </div>

                <!-- Pakot -->
                <div class="section-title">Zgjidhni paketën/pakot</div>
                ${pakotZgjedhuraGlobal.map((p, i) => `
                <div class="pako-card" id="card-${p.id}" onclick="togglePako('${p.id}')">
                    <div class="pako-top">
                        <input type="checkbox" id="cb-${p.id}" onclick="event.stopPropagation(); togglePako('${p.id}')">
                        <div class="pako-info">
                            <div class="pako-name">${p.emri}</div>
                            <div class="pako-zone">${p.zona}</div>
                        </div>
                        <div style="text-align:right;">
                            <div class="pako-price">€ ${p.primi_madh}</div>
                            <div class="pako-price-sub">${eshteIndivid ? 'për vit' : 'për muaj'}</div>
                        </div>
                    </div>
                    <div class="pako-details" id="det-${p.id}">
                        <div class="detail-row"><div class="dr-label">Shuma e Siguruar</div><div class="dr-value">€ ${p.shuma}</div></div>
                        <div class="detail-section">
                            <div class="detail-section-header" onclick="event.stopPropagation();toggleSection(this)">Trajtimet Hospitalore <span class="fold-arrow">▾</span></div>
                            <div class="detail-rows">
                                <div class="detail-row"><div class="dr-label">Mbulimi</div><div class="dr-value">${p.hospitalore}</div></div>
                            </div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-section-header" onclick="event.stopPropagation();toggleSection(this)">Trajtimet Ambulantore <span class="fold-arrow">▾</span></div>
                            <div class="detail-rows">
                                <div class="detail-row"><div class="dr-label">Mbulimi</div><div class="dr-value">${p.ambulatore}</div></div>
                            </div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-section-header open" onclick="event.stopPropagation();toggleSection(this)">Trajtime tjera <span class="fold-arrow">▾</span></div>
                            <div class="detail-rows open">
                                <div class="detail-row"><div class="dr-label">Shtatzania dhe lindja</div><div class="dr-value">${p.shtatzania}</div></div>
                                <div class="detail-row"><div class="dr-label">Kujdesi dentar</div><div class="dr-value">${p.dentar}</div></div>
                                <div class="detail-row"><div class="dr-label">Kujdesi optik</div><div class="dr-value">${p.optik}</div></div>
                                <div class="detail-row"><div class="dr-label">Kujdesi për dëgim</div><div class="dr-value">${p.degim}</div></div>
                                <div class="detail-row"><div class="dr-label">Kujdesi psikiatrik</div><div class="dr-value">${p.psikiatrik}</div></div>
                                <div class="detail-row"><div class="dr-label">Fizioterapia</div><div class="dr-value">${p.fizioterapi}</div></div>
                                <div class="detail-row"><div class="dr-label">Autoambulanca</div><div class="dr-value">${p.autoambulanca}</div></div>
                                <div class="detail-row"><div class="dr-label">Aksidenti</div><div class="dr-value">${p.aksidentit}</div></div>
                                <div class="detail-row"><div class="dr-label">Trajtimet onkologjike</div><div class="dr-value">${p.onkologjike}</div></div>
                            </div>
                        </div>
                        <div class="primi-row">
                            <div class="dr-label">Primi${!eshteIndivid && p.primi_femije ? ' (mbi 18 vjeç)' : ''}</div>
                            <div class="dr-value">€ ${p.primi_madh}${eshteIndivid ? '/vit' : '/muaj'}</div>
                        </div>
                        ${!eshteIndivid && p.primi_femije ? `<div class="primi-row" style="background:#f8fafc;"><div class="dr-label">Primi (fëmijë nën 18)</div><div class="dr-value">€ ${p.primi_femije}/muaj</div></div>` : ''}
                    </div>
                </div>`).join('')}

                <!-- Pakot opsionale (Pika 11) -->
                <div class="optional-section">
                    <div class="section-title">Mbrojtje shtesë (opsionale)</div>
                    <div class="optional-card" id="opt-jete" onclick="toggleOptional('jete')">
                        <input type="checkbox" id="cb-opt-jete" onclick="event.stopPropagation();toggleOptional('jete')">
                        <div class="opt-info">
                            <h4>Jetë Plus Cash</h4>
                            <p>Mbulim financiar shtesë në rast ndodhie të papritur. Përfitoni kompensim të menjëhershëm monetar për familjen.</p>
                        </div>
                        <span class="opt-badge">Rekomanduar</span>
                    </div>
                    <div class="optional-card" id="opt-opinion" onclick="toggleOptional('opinion')">
                        <input type="checkbox" id="cb-opt-opinion" onclick="event.stopPropagation();toggleOptional('opinion')">
                        <div class="opt-info">
                            <h4>Opinioni i Dytë Mjekësor</h4>
                            <p>Merrni mendimin e një specialisti të dytë nga rrjeti ndërkombëtar për diagnoza dhe trajtime të rëndësishme.</p>
                        </div>
                        <span class="opt-badge">I ri</span>
                    </div>
                </div>

                <!-- Koment -->
                <div class="koment-box">
                    <h3>Koment (opsional)</h3>
                    <textarea id="koment" placeholder="Keni pyetje ose kërkesa të veçanta? Shkruani këtu..."></textarea>
                </div>

                <!-- Buttons (Pika 7) -->
                <div class="action-buttons">
                    <button class="btn-confirm" onclick="paraKonfirmimit()">Konfirmoj Zgjedhjen</button>
                    <button class="btn-change" onclick="kerkoNdryshim()">Kërko Ndryshim</button>
                </div>

                <div class="social-proof">
                    <strong>1,500+</strong> klientë të siguruar me SIGAL Health
                </div>

                <!-- App banner (Pika 9) -->
                <div class="app-banner">
                    <div class="app-banner-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3" stroke-linecap="round"/></svg>
                    </div>
                    <div class="app-banner-text">
                        <h4>Shkarko Aplikacionin SIGAL Kosova</h4>
                        <p>Paraqitni demet krejt online — ngarkoni dokumente, lexohen automatikisht të dhënat. Shërbim falas për klientë.</p>
                    </div>
                    <button class="app-banner-btn" onclick="window.open('https://sigal-ks.com/#','_blank')">Shkarko</button>
                </div>

                <!-- Rrjeti mjekosor (Pika 10) -->
                <div class="network-section">
                    <div class="network-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <h4>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#002B5C" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                            Rrjeti Mjekësor SIGAL
                            <span class="net-count">${totalInst}</span>
                        </h4>
                        <span style="font-size:11px;color:#6b7a8d;">Shiko ▾</span>
                    </div>
                    <div class="network-body">
                        <div class="net-category">Spitalet (${RRJETI.spitalet.length})</div>
                        ${RRJETI.spitalet.map(s => `<div class="net-item"><span class="net-dot"></span><span class="net-name">${s.emri}</span><span class="net-loc">${s.qyteti}</span></div>`).join('')}
                        <div class="net-category">Laboratoret (${RRJETI.laboratoret.length})</div>
                        ${RRJETI.laboratoret.map(s => `<div class="net-item"><span class="net-dot"></span><span class="net-name">${s.emri}</span><span class="net-loc">${s.qyteti}</span></div>`).join('')}
                        <div class="net-category">Dentarët (${RRJETI.dentaret.length})</div>
                        ${RRJETI.dentaret.map(s => `<div class="net-item"><span class="net-dot"></span><span class="net-name">${s.emri}</span><span class="net-loc">${s.qyteti}</span></div>`).join('')}
                        <div class="net-category">Ordinanca me zbritje (${RRJETI.ordinanca.length})</div>
                        ${RRJETI.ordinanca.map(s => `<div class="net-item"><span class="net-dot"></span><span class="net-name">${s.emri}</span><span class="net-loc">${s.qyteti} · ${s.zbritje}</span></div>`).join('')}
                    </div>
                </div>

                <div class="oferta-footer">
                    © ${new Date().getFullYear()} SIGAL Insurance Group Kosovo · Të gjitha të drejtat e rezervuara<br>
                    <a href="https://sigal-ks.com" style="color:#0047AB;">sigal-ks.com</a> · demet.shendetsore@sigal-ks.com · +383 38 240 241
                </div>
            `;
        }

        function togglePako(id) {
            const card = document.getElementById('card-' + id);
            const cb = document.getElementById('cb-' + id);
            card.classList.toggle('selected');
            cb.checked = card.classList.contains('selected');
        }

        function toggleOptional(id) {
            const card = document.getElementById('opt-' + id);
            const cb = document.getElementById('cb-opt-' + id);
            card.classList.toggle('selected');
            cb.checked = card.classList.contains('selected');
        }

        function toggleSection(header) {
            header.classList.toggle('open');
            const rows = header.nextElementSibling;
            rows.classList.toggle('open');
        }

        function getSelectedPakot() {
            return pakotZgjedhuraGlobal.filter(p => {
                const cb = document.getElementById('cb-' + p.id);
                return cb && cb.checked;
            });
        }

        function paraKonfirmimit() {
            const selected = getSelectedPakot();
            if (selected.length === 0) {
                alert('Ju lutem zgjidhni së paku një paketë!');
                return;
            }

            // Check if optional packages were considered
            const optJete = document.getElementById('cb-opt-jete');
            const optOpinion = document.getElementById('cb-opt-opinion');
            if (optJete && optOpinion && !optJete.checked && !optOpinion.checked) {
                document.getElementById('popup-optional').classList.add('active');
                return;
            }

            dergoPako();
        }

        function vazhdo(shtoOpsionale) {
            document.getElementById('popup-optional').classList.remove('active');
            if (shtoOpsionale) {
                // Scroll to optional section
                document.querySelector('.optional-section').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            dergoPako();
        }

        async function dergoPako() {
            const selected = getSelectedPakot();
            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            const oferta = ofertat[ofertaId];

            const pakotEmra = selected.map(p => p.emri || p.id).join(', ');
            const optJete = document.getElementById('cb-opt-jete')?.checked;
            const optOpinion = document.getElementById('cb-opt-opinion')?.checked;
            let extras = [];
            if (optJete) extras.push('Jetë Plus Cash');
            if (optOpinion) extras.push('Opinioni i Dytë Mjekësor');

            ofertat[ofertaId].pakaZgjedhur = pakotEmra + (extras.length ? ' + ' + extras.join(', ') : '');
            ofertat[ofertaId].komentKlient = document.getElementById('koment').value;
            ofertat[ofertaId].konfirmuar = true;
            ofertat[ofertaId].dataKonfirmimit = new Date().toISOString().split('T')[0];
            localStorage.setItem('ofertat', JSON.stringify(ofertat));

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte', {
                    method: 'POST',
                    signal: controller.signal,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emriKlientit: oferta.emri,
                        emailKlientit: oferta.email,
                        pakaZgjedhur: pakotEmra + (extras.length ? ' + ' + extras.join(', ') : ''),
                        koment: document.getElementById('koment').value,
                        emailAgjentit: oferta.krijuarNgaEmail || 'gjonbalajagon@gmail.com'
                    })
                });
                clearTimeout(timeout);
            } catch(e) {
                console.error('Email error:', e);
            }

            document.getElementById('container').innerHTML = `
                <div class="success-msg">
                    <div class="check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div>
                    <h2>Faleminderit!</h2>
                    <p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti juaj do t'ju kontaktojë së shpejti.</p>
                </div>`;
        }

        function kerkoNdryshim() {
            const koment = document.getElementById('koment').value.trim();
            if (!koment) {
                alert('Ju lutem shkruani në koment çfarë ndryshimesh dëshironi, pastaj klikoni "Kërko Ndryshim".');
                document.getElementById('koment').focus();
                return;
            }

            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            ofertat[ofertaId].komentKlient = 'KËRKESË PËR NDRYSHIM: ' + koment;
            ofertat[ofertaId].konfirmuar = false;
            localStorage.setItem('ofertat', JSON.stringify(ofertat));

            try {
                fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emriKlientit: ofertaData.emri,
                        emailKlientit: ofertaData.email,
                        pakaZgjedhur: 'KËRKESË PËR NDRYSHIM',
                        koment: koment,
                        emailAgjentit: ofertaData.krijuarNgaEmail || 'gjonbalajagon@gmail.com'
                    })
                });
            } catch(e) {}

            document.getElementById('container').innerHTML = `
                <div class="success-msg">
                    <div class="check" style="background:#0047AB;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke="white"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
                    <h2>Kërkesa u dërgua!</h2>
                    <p>Agjenti juaj do ta shqyrtojë kërkesën tuaj<br>dhe do t'ju kontaktojë me ofertë të përditësuar.</p>
                </div>`;
        }

        ngarko();
    </script>
</body>
</html>

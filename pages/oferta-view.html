<div class="header"><img src="../Sigal-KS-Logo.webp" alt="Sigal"><h1>Sigal KS Insurance Group</h1></div>
<div class="container" id="container"><div style="text-align:center;padding:40px;color:#888">Duke ngarkuar...</div></div>
<div class="popup-overlay" id="popup-optional"><div class="popup"><h3>Dëshironi të shtoni mbrojtje shtesë?</h3><p><strong>Jetë Plus Cash</strong> — nga € 2.50/muaj<br>Mbështetje financiare për sëmundje të rënda.<br><br><strong>Opinioni i Dytë Mjekësor</strong> — € 1/muaj<br>Mendim ndërkombëtar nga qendrat më të mira.</p><div class="popup-btns"><button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button><button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button></div></div></div>
<script src="../js/pakot.js"></script>
<script>
const params=new URLSearchParams(window.location.search),ofertaId=params.get('id');
let ofertaData=null,pakotGlobal=[],activeTab=0,selectedPakot=new Set(),openSections={};
const RRJETI={spitalet:[{e:'Spitali Amerikan',q:'Prishtinë'},{e:'Spitali "Lindja"',q:'Prishtinë'},{e:'Klinika Kirurgjike "Aloka"',q:'Prishtinë'},{e:'Spitali Fati Im',q:'Prishtinë'},{e:'Spitali Bahçeçi',q:'Prishtinë–Shkup km9'},{e:'Spitali IHC',q:'Prishtinë–Ferizaj km5'},{e:'Klinika Gjermane e Syrit',q:'Prishtinë'},{e:'Olive Medical Group',q:'Prishtinë'},{e:'Spitali Royal Medical',q:'Prishtinë–Ferizaj km15'},{e:'United Hospital',q:'Prishtinë–Ferizaj km7'}],laboratoret:[{e:'ProLab',q:'Prishtinë'},{e:'ImunoLab',q:'Prishtinë'},{e:'Avicena',q:'Prishtinë'},{e:'E-Lab',q:'Prishtinë'},{e:'Mikrobioanaliza',q:'Prishtinë'}],dentaret:[{e:'Melisa Dent',q:'Prishtinë'},{e:'Dental Clinic Stomatologjia',q:'Prishtinë'},{e:'Klinika Gjermane e Dhëmbit',q:'Prishtinë'},{e:'Mikro & Dent',q:'Prishtinë'},{e:'Top Dent',q:'Prishtinë'},{e:'Dent In',q:'Prishtinë'}],ordinanca:[{e:'Optika Neziri',q:'Prishtinë',z:'10-50%'},{e:'Optika Simoni',q:'Prishtinë',z:'20%'},{e:'DIDA & ROKA Eye Clinic',q:'Prishtinë',z:'10%'},{e:'Farmacia Ime',q:'Prishtinë',z:'10%'},{e:'VSO Clinic',q:'Prishtinë',z:'Paketë 30€'},{e:'Poliklinika Diagnoza',q:'Gjilan',z:'20%'},{e:'IDMG Swiss Clinique 2',q:'Gjilan',z:'20%'},{e:'Biolab',q:'Gjilan',z:'20%'},{e:'Physio Move',q:'Prishtinë',z:'20%'},{e:'Cambridge Clinical Lab',q:'Prishtinë',z:'20%'}]};
const ICN={h:'<svg viewBox="0 0 24 24"><path d="M3 21h18M9 8h6M12 8v6M9 21V8a3 3 0 0 1 3-3h0a3 3 0 0 1 3 3v13" stroke-linecap="round" stroke-linejoin="round"/></svg>',a:'<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg>',t:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>'};


function catHTML(key,icon,title,sub,badge,badgeCls,p){
    const isOpen=openSections[key];
    let h='<div class="cat-hdr" onclick="toggleCat(\''+key+'\')"><div class="ch-left"><div class="ch-icon">'+icon+'</div><div><div class="ch-t">'+title+'</div><div class="ch-sub">'+sub+'</div></div></div><div class="ch-right"><span class="ch-badge '+badgeCls+'">'+badge+'</span><span class="ch-toggle">'+(isOpen?'Mbyll ▴':'Shih mbulimet ▾')+'</span></div></div>';
    h+='<div class="cat-body'+(isOpen?' open':'')+'">';
    const dotCls=key==='hosp'?'':'b';
    if(key==='hosp'){
        const s=p.hospitalore_pikat&&p.hospitalore_pikat.every(x=>x.vlera===p.hospitalore_pikat[0].vlera);
        if(s){h+='<div class="mi-wrap">';p.hospitalore_pikat.forEach(x=>{h+='<div class="mi-item"><span class="mi-dot"></span>'+x.emri+'</div>';});h+='</div>';}
        else p.hospitalore_pikat.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});
    }else if(key==='amb'){
        if(p.ambulantore_zbritje){h+='<div class="nc">Nuk mbulohet - Zbritje brenda Rrjetit Mjekësor</div><div class="nc-items">';p.ambulantore_pikat.forEach(x=>{h+='<div class="mi-item"><span class="mi-dot"></span>'+x.emri+'</div>';});h+='</div>';}
        else{const s=p.ambulantore_pikat&&p.ambulantore_pikat.every(x=>x.vlera===p.ambulantore_pikat[0].vlera);
            if(s){h+='<div class="mi-wrap">';p.ambulantore_pikat.forEach(x=>{h+='<div class="mi-item"><span class="mi-dot b"></span>'+x.emri+'</div>';});h+='</div>';}
            else p.ambulantore_pikat.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});}
    }else{
        const tc=p.tjera_pikat.filter(x=>!x.zbritje),tn=p.tjera_pikat.filter(x=>x.zbritje);

    const pakotList=oferta.lloji==='individ'?PAKOT.individ:PAKOT.familje_biznes;
    pakotGlobal=pakotList.filter(p=>(oferta.pakot||[]).some(op=>(typeof op==='object'?op.id:op)===p.id||(typeof op==='string'&&op.toLowerCase().includes(p.emri.toLowerCase())))).map(p=>{const c=(oferta.pakot||[]).find(op=>typeof op==='object'&&op.id===p.id);return c?{...p,...c}:p;});

function getSelected(){return pakotGlobal.filter(p=>selectedPakot.has(p.id));}
function paraKonfirmimit(){if(!getSelected().length){alert('Ju lutem zgjidhni së paku një paketë!');return;}const fj=document.getElementById('f-jete'),fo=document.getElementById('f-opinion');if(fj&&fo&&!fj.classList.contains('sel')&&!fo.classList.contains('sel')){document.getElementById('popup-optional').classList.add('active');return;}dergoPako();}
function vazhdo(shto){document.getElementById('popup-optional').classList.remove('active');if(shto){document.querySelector('.f-banner').scrollIntoView({behavior:'smooth'});return;}dergoPako();}
async function dergoPako(){
    const sel=getSelected(),ofertat=JSON.parse(localStorage.getItem('ofertat'))||[],oferta=ofertat[ofertaId];
    const pe=sel.map(p=>p.emri||p.id).join(', ');let ex=[];
    if(document.getElementById('f-jete')?.classList.contains('sel'))ex.push('Jetë Plus Cash');
    if(document.getElementById('f-opinion')?.classList.contains('sel'))ex.push('Opinioni i Dytë Mjekësor');
    const zf=pe+(ex.length?' + '+ex.join(', '):'');
    ofertat[ofertaId].pakaZgjedhur=zf;ofertat[ofertaId].komentKlient=document.getElementById('koment').value;
    ofertat[ofertaId].konfirmuar=true;ofertat[ofertaId].dataKonfirmimit=new Date().toISOString().split('T')[0];
    ofertat[ofertaId].notification={type:'konfirmim',msg:'Klienti konfirmoi: '+zf,data:new Date().toISOString().split('T')[0],lexuar:false};
    ofertat[ofertaId].statusi='e_konfirmuar';
    localStorage.setItem('ofertat',JSON.stringify(ofertat));
    trackKonfirmim(zf,ex,document.getElementById('koment').value);
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({emriKlientit:oferta.emri,emailKlientit:oferta.email,pakaZgjedhur:zf,koment:document.getElementById('koment').value,emailAgjentit:oferta.krijuarNgaEmail||'gjonbalajagon@gmail.com'})});clearTimeout(t);}catch(e){}
    document.getElementById('container').innerHTML='<div class="success-msg"><div class="check" style="background:#22c55e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><h2>Faleminderit!</h2><p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti do t\'ju kontaktojë së shpejti.</p></div>';
}

const TAPI='https://sigal-platform-production.up.railway.app';
let tStart=Date.now();
function trackHapje(){try{fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'hapje',data:{userAgent:navigator.userAgent}})});}catch(e){}}
function trackKoha(){const s=Math.round((Date.now()-tStart)/1000);try{navigator.sendBeacon?navigator.sendBeacon(TAPI+'/api/oferta-track',new Blob([JSON.stringify({ofertaId,event:'koha',data:{sekonda:s}})],{type:'application/json'})):fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'koha',data:{sekonda:s}}),keepalive:true});}catch(e){}}
function trackKonfirmim(pakot,ops,kom){try{fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'konfirmim',data:{pakot,opsionale:ops,koment:kom}})});}catch(e){}}
if(ofertaId){trackHapje();window.addEventListener('beforeunload',trackKoha);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')trackKoha();});}

ngarko();

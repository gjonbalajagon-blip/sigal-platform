<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:#f4f6f9;color:#1a2332}
.header{background:#002B5C;padding:14px 20px;display:flex;align-items:center;gap:12px}

.container{max-width:640px;margin:0 auto;padding:20px 14px 60px}
.oferta-header{background:white;border-radius:10px;padding:20px;margin-bottom:16px;border:1px solid #e5e9f0}

/* Primi pills */

/* Category headers */
.cat-hdr{padding:10px 14px;background:#002B5C;color:white;display:flex;align-items:center;justify-content:space-between}
.ch-left{display:flex;align-items:center;gap:8px;flex:1}
.ch-icon{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-icon svg{width:13px;height:13px;stroke:white;stroke-width:2;fill:none}
.ch-t{font-size:12px;font-weight:700}
.ch-sub{font-size:9px;opacity:0.7;margin-top:1px}
.ch-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ch-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;max-width:200px;text-align:center;line-height:1.3}
.ch-badge.g{background:#22c55e;color:white}

/* Opt cards */

/* Price table static */
.price-table-wrap{padding:8px 14px;border-top:1px solid #e5e9f0}

.app-logo{width:44px;height:44px;border-radius:10px;flex-shrink:0;overflow:hidden;background:white}
.app-logo img{width:44px;height:44px;border-radius:10px;display:block}
.app-text{flex:1;min-width:0}
.app-text .at-title{font-size:12px;font-weight:700;color:white}
.app-text .at-free{font-size:10px;color:#22c55e;font-weight:700;margin-top:2px}
.app-text .at-features{font-size:9px;color:rgba(255,255,255,0.7);margin-top:3px;line-height:1.4}
.app-stores{display:flex;gap:6px;margin-top:6px}
.store-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.15);color:white;font-size:9px;font-weight:600;padding:4px 10px;border-radius:6px;text-decoration:none}

.net-trigger{background:white;border-radius:10px;border:1px solid #e5e9f0;margin:12px 0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}

.net-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:flex-end;justify-content:center}
.net-overlay.active{display:flex}
.net-popup{background:white;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:80vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.net-popup-hdr{padding:14px 16px;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1;border-radius:16px 16px 0 0}
.net-popup-hdr h3{font-size:14px;font-weight:700;color:#002B5C}
.net-close{width:28px;height:28px;border-radius:50%;background:#f4f6f9;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6b7a8d}
.nk{padding:10px 14px;background:#f0f4ff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:10px}
.nk-icon{width:36px;height:24px;border-radius:4px;background:#002B5C;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.nk-text{flex:1}.nk-text .nkt{font-size:11px;font-weight:700;color:#002B5C}.nk-text .nkd{font-size:9px;color:#4a5568;margin-top:1px}
.net-cat{padding:5px 14px;background:#002B5C;color:white;font-size:10px;font-weight:700}
.net-item{display:flex;align-items:center;padding:5px 14px;font-size:11px;border-bottom:1px solid #f8f8f8;gap:6px}
.net-item:last-child{border-bottom:none}
.net-dot{width:5px;height:5px;border-radius:50%;background:#0047AB;flex-shrink:0}
.net-item .nn{font-weight:600;color:#1a2332;flex:1}.net-item .nl{font-size:10px;color:#6b7a8d}
.koment-box{background:white;border-radius:10px;padding:16px;margin-top:16px;border:1px solid #e5e9f0}
.koment-box h3{margin-bottom:6px;color:#002B5C;font-size:12px;font-weight:700}
.koment-box textarea{width:100%;border:1px solid #e5e9f0;border-radius:6px;padding:8px 10px;font-family:inherit;font-size:11px;resize:vertical;min-height:60px}
.action-btns{margin-top:12px}
.btn-confirm{display:block;width:100%;background:#002B5C;color:white;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-confirm:hover{background:#0047AB}
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
.popup-overlay.active{display:flex}
.popup{background:white;border-radius:12px;padding:24px;max-width:400px;width:90%;text-align:center}
.popup h3{font-size:15px;color:#002B5C;margin-bottom:6px}
.popup p{font-size:12px;color:#6b7a8d;margin-bottom:16px;line-height:1.5}
.popup-btns{display:flex;gap:8px}
.popup-btns button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.popup-skip{background:#f4f6f9;border:1px solid #e5e9f0;color:#6b7a8d}
.popup-add{background:#002B5C;border:none;color:white}
.success-msg{text-align:center;padding:50px 16px}
.success-msg .check{width:50px;height:50px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.success-msg .check svg{stroke:white}
.success-msg h2{color:#002B5C;margin-bottom:6px;font-size:18px}
.success-msg p{color:#6b7a8d;font-size:13px;line-height:1.5}
.oferta-footer{text-align:center;margin-top:24px;font-size:10px;color:#aaa;padding:12px}
.oferta-footer a{color:#0047AB}
@media(max-width:480px){.action-btns{flex-direction:column}.app-banner{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="header"><img src="../Sigal-KS-Logo.webp" alt="Sigal"><h1>Sigal KS Insurance Group</h1></div>
<div class="container" id="container"><div style="text-align:center;padding:40px;color:#888">Duke ngarkuar...</div></div>
<div class="popup-overlay" id="popup-optional"><div class="popup"><h3>Dëshironi të shtoni mbrojtje shtesë?</h3><p><strong>Jetë Plus Cash</strong> — nga € 2.50/muaj<br>Mbështetje financiare për sëmundje të rënda.<br><br><strong>Opinioni i Dytë Mjekësor</strong> — € 1/muaj<br>Mendim ndërkombëtar nga qendrat më të mira.</p><div class="popup-btns"><button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button><button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button></div></div></div>
<div class="net-overlay" id="net-overlay" onclick="if(event.target===this)mbyllRrjetin()"><div class="net-popup" id="net-popup"></div></div>
<script src="../js/pakot.js"></script>
<script>
const params=new URLSearchParams(window.location.search),ofertaId=params.get('id');
let ofertaData=null,pakotGlobal=[],activeTab=0,selectedPakot=new Set(),openSections={};
const RRJETI={spitalet:[{e:'Spitali Amerikan',q:'Prishtinë'},{e:'Spitali "Lindja"',q:'Prishtinë'},{e:'Klinika Kirurgjike "Aloka"',q:'Prishtinë'},{e:'Spitali Fati Im',q:'Prishtinë'},{e:'Spitali Bahçeçi',q:'Prishtinë–Shkup km9'},{e:'Spitali IHC',q:'Prishtinë–Ferizaj km5'},{e:'Klinika Gjermane e Syrit',q:'Prishtinë'},{e:'Olive Medical Group',q:'Prishtinë'},{e:'Spitali Royal Medical',q:'Prishtinë–Ferizaj km15'},{e:'United Hospital',q:'Prishtinë–Ferizaj km7'}],laboratoret:[{e:'ProLab',q:'Prishtinë'},{e:'ImunoLab',q:'Prishtinë'},{e:'Avicena',q:'Prishtinë'},{e:'E-Lab',q:'Prishtinë'},{e:'Mikrobioanaliza',q:'Prishtinë'}],dentaret:[{e:'Melisa Dent',q:'Prishtinë'},{e:'Dental Clinic Stomatologjia',q:'Prishtinë'},{e:'Klinika Gjermane e Dhëmbit',q:'Prishtinë'},{e:'Mikro & Dent',q:'Prishtinë'},{e:'Top Dent',q:'Prishtinë'},{e:'Dent In',q:'Prishtinë'}],ordinanca:[{e:'Optika Neziri',q:'Prishtinë',z:'10-50%'},{e:'Optika Simoni',q:'Prishtinë',z:'20%'},{e:'DIDA & ROKA Eye Clinic',q:'Prishtinë',z:'10%'},{e:'Farmacia Ime',q:'Prishtinë',z:'10%'},{e:'VSO Clinic',q:'Prishtinë',z:'Paketë 30€'},{e:'Poliklinika Diagnoza',q:'Gjilan',z:'20%'},{e:'IDMG Swiss Clinique 2',q:'Gjilan',z:'20%'},{e:'Biolab',q:'Gjilan',z:'20%'},{e:'Physio Move',q:'Prishtinë',z:'20%'},{e:'Cambridge Clinical Lab',q:'Prishtinë',z:'20%'}]};
const ICN={h:'<svg viewBox="0 0 24 24"><path d="M3 21h18M9 8h6M12 8v6M9 21V8a3 3 0 0 1 3-3h0a3 3 0 0 1 3 3v13" stroke-linecap="round" stroke-linejoin="round"/></svg>',a:'<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg>',t:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>'};


function catHTML(key,icon,title,sub,badge,badgeCls,p){
    const isOpen=openSections[key];
    let h='<div class="cat-hdr"><div class="ch-left"><div class="ch-icon">'+icon+'</div><div><div class="ch-t">'+title+'</div><div class="ch-sub">'+sub+'</div></div></div><div class="ch-right"><span class="ch-badge '+badgeCls+'">'+badge+'</span><span class="ch-toggle" onclick="toggleCat(\''+key+'\')">'+(isOpen?'Mbyll ▴':'Shih mbulimet ▾')+'</span></div></div>';
    h+='<div class="cat-body'+(isOpen?' open':'')+'">';
    if(key==='hosp'){
        const s=p.hospitalore_pikat&&p.hospitalore_pikat.every(x=>x.vlera===p.hospitalore_pikat[0].vlera);
        if(s){h+='<div class="mi-wrap">';p.hospitalore_pikat.forEach(x=>{h+='<span class="mi">'+x.emri+'</span>';});h+='</div>';}
        else p.hospitalore_pikat.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});
    }else if(key==='amb'){
        if(p.ambulantore_zbritje){h+='<div class="nc">Nuk mbulohet - Zbritje brenda Rrjetit Mjekësor</div><div class="nc-items">';p.ambulantore_pikat.forEach(x=>{h+='<span class="mi">'+x.emri+'</span>';});h+='</div>';}
        else{const s=p.ambulantore_pikat&&p.ambulantore_pikat.every(x=>x.vlera===p.ambulantore_pikat[0].vlera);
            if(s){h+='<div class="mi-wrap">';p.ambulantore_pikat.forEach(x=>{h+='<span class="mi">'+x.emri+'</span>';});h+='</div>';}
            else p.ambulantore_pikat.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});}
    }else{
        const tc=p.tjera_pikat.filter(x=>!x.zbritje),tn=p.tjera_pikat.filter(x=>x.zbritje);
        if(p.tjera_merged){h+='<div class="nc">Nuk mbulohet - Zbritje brenda Rrjetit Mjekësor</div><div class="nc-items">';tn.forEach(x=>{h+='<span class="mi">'+x.emri+'</span>';});h+='</div>';tc.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});}
        else p.tjera_pikat.forEach(x=>{h+='<div class="dr"><div class="dl">'+x.emri+'</div><div class="dv">'+x.vlera+'</div></div>';});
    }
    h+='</div>';return h;
}

function renderDetail(){
    const p=pakotGlobal[activeTab];if(!p)return;
    const ei=ofertaData.lloji==='individ',isSel=selectedPakot.has(p.id);
    let abBadge=p.ambulantore,abCls='b';
    if(p.ambulantore==='Nuk mbulohet'||p.ambulantore_zbritje){abBadge='Zbritje';abCls='gr';}
    let tBadge='Mbulohet',tCls='b';

function getSelected(){return pakotGlobal.filter(p=>selectedPakot.has(p.id));}
function paraKonfirmimit(){if(!getSelected().length){alert('Ju lutem zgjidhni së paku një paketë!');return;}const oj=document.getElementById('cb-opt-jete'),oo=document.getElementById('cb-opt-opinion');if(oj&&oo&&!oj.checked&&!oo.checked){document.getElementById('popup-optional').classList.add('active');return;}dergoPako();}
function vazhdo(shto){document.getElementById('popup-optional').classList.remove('active');if(shto){document.querySelector('.opt-card').scrollIntoView({behavior:'smooth'});return;}dergoPako();}
async function dergoPako(){
    const sel=getSelected(),ofertat=JSON.parse(localStorage.getItem('ofertat'))||[],oferta=ofertat[ofertaId];
    const pe=sel.map(p=>p.emri||p.id).join(', ');let ex=[];
    if(document.getElementById('cb-opt-jete')?.checked)ex.push('Jetë Plus Cash');
    if(document.getElementById('cb-opt-opinion')?.checked)ex.push('Opinioni i Dytë Mjekësor');
    const zf=pe+(ex.length?' + '+ex.join(', '):'');
    ofertat[ofertaId].pakaZgjedhur=zf;ofertat[ofertaId].komentKlient=document.getElementById('koment').value;
    ofertat[ofertaId].konfirmuar=true;ofertat[ofertaId].dataKonfirmimit=new Date().toISOString().split('T')[0];
    ofertat[ofertaId].notification={type:'konfirmim',msg:'Klienti konfirmoi: '+zf,data:new Date().toISOString().split('T')[0],lexuar:false};
    localStorage.setItem('ofertat',JSON.stringify(ofertat));
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({emriKlientit:oferta.emri,emailKlientit:oferta.email,pakaZgjedhur:zf,koment:document.getElementById('koment').value,emailAgjentit:oferta.krijuarNgaEmail||'gjonbalajagon@gmail.com'})});clearTimeout(t);}catch(e){}
    document.getElementById('container').innerHTML='<div class="success-msg"><div class="check" style="background:#22c55e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><h2>Faleminderit!</h2><p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti do t\'ju kontaktojë së shpejti.</p></div>';
}

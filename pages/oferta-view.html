<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sigal Health | Oferta Juaj</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Inter','Segoe UI',sans-serif;background:linear-gradient(135deg,#e8f0ff 0%,#eaf4ff 50%,#dfeaff 100%);color:#0f1a30;font-size:12px;min-height:100vh}

/* TOPBAR */
.header{background:linear-gradient(135deg,#002B5C,#1e40af 60%,#3b82f6);padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,43,92,0.15)}
.header img{height:40px;filter:brightness(0) invert(1)}

/* CONTAINER */
.container{max-width:820px;margin:0 auto;padding:20px 20px 60px}

/* OFERTA HEADER (glass) */
.oferta-header{background:rgba(255,255,255,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:18px;padding:20px 24px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.95);box-shadow:0 12px 32px rgba(30,64,175,0.08)}
.oferta-header h2{font-size:22px;font-weight:700;background:linear-gradient(135deg,#0f1a30,#002B5C 40%,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.4px;margin-bottom:4px}
.oferta-header p{color:#7c8aa8;font-size:12px;line-height:1.5;font-weight:500}
.oferta-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.oferta-meta span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:0.1px;background:#dbeafe;color:#1e40af;padding:4px 9px;border-radius:6px}
.countdown{background:#fef3c7 !important;color:#b45309 !important;font-weight:600}
.countdown.urgent{background:#fee2e2 !important;color:#b91c1c !important}

/* SECTION TITLE */
.section-title{font-size:10px;font-weight:700;color:#7c8aa8;margin:18px 0 8px;text-transform:uppercase;letter-spacing:0.7px;padding-left:3px}

/* PACKAGES (tab-bar) */
.tab-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:transparent;border:none;border-radius:0;overflow:visible;margin-bottom:16px}
.tab-item{flex:none;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:14px 16px;border:2px solid rgba(220,230,250,0.8);box-shadow:0 4px 14px rgba(30,64,175,0.05);text-align:center;cursor:pointer;min-width:0;transition:all 0.2s}
.tab-item:last-child{border-right:2px solid rgba(220,230,250,0.8)}
.tab-item .ti-name{font-size:12px;font-weight:700;color:#0f1a30;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tab-item .ti-price{font-size:18px;font-weight:800;color:#002B5C;letter-spacing:-0.4px;line-height:1.1;margin-top:0}
.tab-item .ti-per{font-size:9.5px;color:#7c8aa8;margin-top:1px}
.tab-item.active{background:linear-gradient(135deg,#002B5C,#1e40af 60%,#3b82f6);border-color:transparent;box-shadow:0 10px 24px rgba(0,43,92,0.32),inset 0 1px 0 rgba(255,255,255,0.15)}
.tab-item.active .ti-name,.tab-item.active .ti-price{color:white}
.tab-item.active .ti-per{color:rgba(255,255,255,0.7)}
.tab-item:hover:not(.active){transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,64,175,0.1);background:rgba(255,255,255,0.95)}
.tab-item.sel-mark{border-color:#22c55e;box-shadow:0 4px 16px rgba(34,197,94,0.2)}

/* TAB DETAIL (selected card) */
.tab-detail{background:rgba(255,255,255,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:18px;border:1px solid rgba(255,255,255,0.95);box-shadow:0 10px 26px rgba(30,64,175,0.08);overflow:hidden;padding:20px 22px;margin-bottom:16px}
.td-hdr{padding:0 0 14px;border-bottom:none}
.td-row1{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.td-info{flex:1;min-width:0}
.td-name{font-size:18px;font-weight:700;color:#0f1a30;letter-spacing:-0.3px}
.td-zone{font-size:10px;color:#7c8aa8;margin-top:3px;font-weight:600;letter-spacing:0.4px;line-height:1.4}
.td-shuma-wrap{text-align:right;flex-shrink:0}
.td-shuma{font-size:22px;font-weight:800;background:linear-gradient(135deg,#002B5C,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.6px}
.td-shuma-lbl{font-size:9.5px;color:#7c8aa8;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:1px}
.td-primi{display:flex;gap:8px;margin:0 0 16px}
.td-pi{flex:1;background:linear-gradient(135deg,#f0f6ff,#e4edff);padding:10px 14px;border-radius:11px;border:1px solid rgba(200,220,250,0.7);text-align:left;min-width:0}
.td-pi .pl{font-size:9.5px;color:#7c8aa8;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;display:block;white-space:nowrap}
.td-pi .pv{font-size:15px;font-weight:800;color:#002B5C;display:block;margin-top:1px;letter-spacing:-0.2px}

/* FLOAT PILL */
.float-pill{position:fixed;bottom:20px;right:16px;z-index:100;background:linear-gradient(135deg,#002B5C,#1e40af 60%,#3b82f6);color:white;border:none;padding:11px 20px;border-radius:24px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;display:none;align-items:center;gap:7px;box-shadow:0 8px 22px rgba(0,43,92,0.4);transition:all 0.2s;letter-spacing:0.2px}
.float-pill:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,43,92,0.5)}
.float-pill.show{display:flex}
.float-pill .fp-count{background:#22c55e;color:white;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.float-pill svg{width:12px;height:12px;stroke:white;stroke-width:2.5;fill:none}

/* CAT (Coverage section) */
.cat-hdr{padding:10px 14px;background:linear-gradient(135deg,#002B5C,#1e40af);color:white;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-radius:11px;border:1px solid rgba(220,230,250,0.6);margin-top:9px;transition:filter 0.15s}
.cat-hdr:first-of-type{margin-top:0}
.cat-hdr:hover{filter:brightness(1.08)}
.cat-hdr:has(+ .cat-body.open){border-radius:11px 11px 0 0;border-bottom:none}
.ch-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.ch-icon{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;backdrop-filter:blur(8px)}
.ch-icon svg{width:13px;height:13px;stroke:white;stroke-width:2;fill:none}
.ch-t{font-size:12px;font-weight:700;line-height:1.2}
.ch-sub{font-size:10px;opacity:0.78;margin-top:1px}
.ch-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ch-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;max-width:200px;text-align:center;line-height:1.3;letter-spacing:0.1px}
.ch-badge.g{background:#10b981;color:white}
.ch-badge.b{background:#3b82f6;color:white}
.ch-badge.gr{background:rgba(255,255,255,0.22);color:white}
.ch-toggle{font-size:10px;opacity:0.9;white-space:nowrap}
.cat-body{display:none;background:white;padding:12px 14px;border:1px solid rgba(220,230,250,0.8);border-top:none;border-radius:0 0 11px 11px}
.cat-body.open{display:block}

/* Coverage items */
.mi-wrap{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;padding:0}
.mi-item{display:flex;align-items:center;gap:6px;padding:0;font-size:11px;color:#4b5563;line-height:1.35;border-bottom:none}
.mi-dot{width:7px;height:7px;border-radius:50%;background:#10b981;flex-shrink:0}
.mi-dot.b{background:#60a5fa}

/* Not covered notice */
.nc{padding:8px 12px;background:#fff8f0;font-size:10.5px;color:#9a3412;font-weight:600;border-radius:8px;border-bottom:none;margin-bottom:8px}
.nc-items{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;padding:0 0 6px}
.nc-items .mi-item{color:#9a3412}
.nc-items .mi-dot{background:#f59e0b}

/* Detail rows (table) */
.dr{display:flex;padding:7px 0;font-size:11px;border-top:1px solid #f1f5f9;border-bottom:none}
.dr:first-child{border-top:none}
.dr .dl{flex:1;color:#4b5563;line-height:1.35}
.dr .dv{font-weight:700;color:#0f1a30;text-align:right;flex-shrink:0;padding-left:12px}

.nota{padding:8px 14px 0;font-size:10px;color:#7c8aa8;background:transparent;border-top:none;font-style:italic;margin-top:4px}

/* ZGJEDH BUTTON */
.btn-z-wrap{padding:14px 0 0;border-top:none}
.btn-z{display:block;width:100%;padding:13px;text-align:center;font-size:13px;font-weight:700;border-radius:12px;cursor:pointer;font-family:inherit;border:none;background:linear-gradient(135deg,#002B5C,#1e40af 60%,#3b82f6);color:white;box-shadow:0 10px 24px rgba(0,43,92,0.32),inset 0 1px 0 rgba(255,255,255,0.2);letter-spacing:0.2px;transition:all 0.2s}
.btn-z:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(0,43,92,0.4)}
.btn-z.active{background:white;color:#002B5C;border:1.5px solid #002B5C;box-shadow:none}
.btn-z.active:hover{background:#f0f6ff;transform:translateY(-1px)}
.btn-z-note{text-align:center;font-size:11px;color:#7c8aa8;margin-top:8px;font-weight:600}

/* OPT (extras) cards */
.opt-card{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.95);border-radius:16px;padding:18px 20px;margin-bottom:12px;box-shadow:0 8px 22px rgba(30,64,175,0.07);overflow:hidden;cursor:pointer;transition:all 0.2s}
.opt-card:hover{box-shadow:0 12px 28px rgba(30,64,175,0.1)}
.opt-card.open{border-color:rgba(59,130,246,0.4);box-shadow:0 12px 28px rgba(59,130,246,0.15)}
.opt-card.selected{border:1.5px solid #22c55e;box-shadow:0 8px 24px rgba(34,197,94,0.18)}
.opt-preview{padding:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.opt-main{flex:1;min-width:260px}
.opt-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.opt-title{font-size:15px;font-weight:700;color:#0f1a30;letter-spacing:-0.2px}
.opt-badge{font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:0.1px;display:inline-flex;align-items:center;gap:3px}
.opt-badge.rec{background:#dbeafe;color:#1e40af}
.opt-badge.new{background:#d1fae5;color:#047857}
.opt-tagline{font-size:12px;color:#4b5563;margin-top:8px;line-height:1.45}
.opt-highlights{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.opt-hl{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.opt-hl::before{content:'✓';font-weight:900;font-size:9px}
.opt-hl.feature{background:#eff6ff;color:#1e40af}
.opt-hl.zona{background:#fffbeb;color:#b45309}
.opt-hl.benefit{background:#ecfdf5;color:#047857}
.opt-hl svg{display:none}
.opt-toggle-hint{font-size:11px;color:#3b82f6;margin-top:10px;font-weight:600;display:flex;align-items:center;gap:4px}
.opt-toggle-hint svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;transition:transform 0.2s}
.opt-card.open .opt-toggle-hint svg{transform:rotate(180deg)}
.opt-price-side{text-align:right;flex-shrink:0;padding-top:2px;white-space:nowrap}
.ops-price{font-size:19px;font-weight:800;background:linear-gradient(135deg,#002B5C,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.4px}
.ops-per{font-size:10px;color:#7c8aa8;font-weight:600}

.opt-details{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #eef2fa;background:transparent}
.opt-card.open .opt-details{display:block}
.opt-det-hdr{padding:9px 14px;background:linear-gradient(135deg,#002B5C,#1e40af);color:white;font-size:11.5px;font-weight:700;border-radius:8px 8px 0 0;margin-top:10px}
.opt-det-hdr:first-child{margin-top:0}
.opt-det-r{display:flex;padding:7px 14px;font-size:11px;border-bottom:1px solid #f1f5f9;background:white;border-left:1px solid rgba(220,230,250,0.8);border-right:1px solid rgba(220,230,250,0.8)}
.opt-det-r:last-child{border-bottom:1px solid rgba(220,230,250,0.8);border-radius:0 0 8px 8px}
.opt-det-r .dl{flex:1;color:#4b5563;line-height:1.35}
.opt-det-r .dv{font-weight:700;color:#047857}
.opt-note{padding:8px 4px 0;font-size:10px;color:#7c8aa8;line-height:1.5;font-style:italic;border-top:none}

.opt-zgjedh-wrap{padding:12px 0 0;border-top:none;background:transparent}
.opt-zgjedh-btn{display:block;width:100%;padding:11px;text-align:center;font-size:12px;font-weight:700;border-radius:12px;cursor:pointer;font-family:inherit;border:1.5px solid #002B5C;background:white;color:#002B5C;transition:all 0.2s}
.opt-zgjedh-btn:hover{background:#f0f6ff}
.opt-zgjedh-btn.sel{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;border-color:transparent;box-shadow:0 6px 16px rgba(34,197,94,0.3)}
.opt-zgjedh-note{text-align:center;font-size:11px;color:#7c8aa8;margin-top:6px;font-weight:600}
.opt-sel-badge{display:none;font-size:9.5px;font-weight:700;background:#22c55e;color:white;padding:2px 8px;border-radius:6px;margin-left:auto}
.opt-card.selected .opt-sel-badge{display:inline-block}

/* PRICE TABLE */
.price-table-wrap{padding:16px 0 0;border-top:none}
.price-table-title{font-size:12px;font-weight:700;color:#0f1a30;margin-bottom:4px}
.price-table-sub{font-size:11px;color:#7c8aa8;margin-bottom:8px;font-weight:500}
.price-table{width:100%;border-collapse:collapse;font-size:11px}
.price-table th{background:linear-gradient(135deg,#f0f6ff,#e4edff);color:#0f1a30;padding:7px 6px;font-weight:700;font-size:10px;text-align:center;border:1px solid #dbeafe}
.price-table th:first-child{text-align:left;padding-left:11px;border-radius:8px 0 0 0}
.price-table th:last-child{border-radius:0 8px 0 0}
.price-table td{padding:6px;border:1px solid #eef2fa;text-align:center;font-size:11px;color:#4b5563}
.price-table td:first-child{text-align:left;padding-left:11px;font-weight:700;color:#0f1a30}
.price-table tr:nth-child(even) td:not(:first-child){background:#fafbff}
.price-table tr:nth-child(even){background:transparent}

/* APP BANNER */
.app-banner{background:linear-gradient(135deg,#002B5C 0%,#1e40af 50%,#3b82f6 100%);border-radius:16px;padding:18px 22px;margin:16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(0,43,92,0.32);color:white}
.app-banner::before{content:'';position:absolute;top:-40%;right:-10%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,0.35),transparent 70%);pointer-events:none}
.app-logo{width:50px;height:50px;border-radius:12px;flex-shrink:0;overflow:hidden;background:white;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.app-logo img{width:50px;height:50px;border-radius:12px;display:block}
.app-text{flex:1;min-width:0;position:relative;z-index:1}
.app-text .at-title{font-size:14px;font-weight:800;color:white;margin-bottom:3px}
.app-text .at-free{font-size:11px;color:#86efac;font-weight:700;margin-bottom:3px;margin-top:0}
.app-text .at-features{font-size:10px;opacity:0.85;font-weight:500;color:white;line-height:1.4;margin-top:0}
.app-stores{display:flex;gap:7px;margin-top:8px;position:relative;z-index:1;flex-wrap:wrap}
.store-btn{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,0.55);color:white;font-size:10.5px;font-weight:700;padding:7px 12px;border-radius:9px;text-decoration:none;border:1px solid rgba(255,255,255,0.15);transition:all 0.2s}
.store-btn:hover{background:rgba(0,0,0,0.75)}
.store-btn svg{width:14px;height:14px;fill:white}

/* NETWORK TRIGGER */
.net-trigger{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.95);border-radius:14px;margin:14px 0;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 6px 18px rgba(30,64,175,0.06);gap:14px;flex-wrap:wrap;transition:all 0.2s}
.net-trigger:hover{box-shadow:0 10px 24px rgba(30,64,175,0.1);transform:translateY(-1px)}
.net-trigger h4{font-size:13px;font-weight:700;color:#0f1a30;display:flex;align-items:center;gap:8px}
.net-trigger .net-desc{font-size:11px;color:#7c8aa8;margin-top:2px;font-weight:500}
.net-count{background:#002B5C;color:white;font-size:10px;padding:2px 8px;border-radius:6px;font-weight:800}

/* NET POPUP */
.net-overlay{display:none;position:fixed;inset:0;background:rgba(15,26,48,0.6);backdrop-filter:blur(8px);z-index:1000;align-items:flex-end;justify-content:center}
.net-overlay.active{display:flex}
.net-popup{background:white;border-radius:16px 16px 0 0;width:100%;max-width:820px;max-height:80vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.net-popup-hdr{padding:14px 18px;border-bottom:1px solid #eef2fa;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:white;z-index:1;border-radius:16px 16px 0 0}
.net-popup-hdr h3{font-size:14px;font-weight:700;color:#0f1a30}
.net-close{width:30px;height:30px;border-radius:50%;background:#f4f6f9;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#7c8aa8}
.nk{padding:10px 18px;background:linear-gradient(135deg,#f0f6ff,#e4edff);border-bottom:1px solid #eef2fa;display:flex;align-items:center;gap:10px}
.nk-icon{width:36px;height:24px;border-radius:4px;background:#002B5C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nk-icon svg{width:16px;height:16px;stroke:white;stroke-width:2;fill:none}
.nk-text{flex:1}.nk-text .nkt{font-size:11.5px;font-weight:700;color:#002B5C}.nk-text .nkd{font-size:10px;color:#4b5563;margin-top:2px}
.net-cat{padding:6px 18px;background:linear-gradient(135deg,#002B5C,#1e40af);color:white;font-size:10.5px;font-weight:700;letter-spacing:0.2px}
.net-item{display:flex;align-items:center;padding:7px 18px;font-size:11px;border-bottom:1px solid #f8f8f8;gap:8px}
.net-item:last-child{border-bottom:none}
.net-dot{width:6px;height:6px;border-radius:50%;background:#3b82f6;flex-shrink:0}
.net-item .nn{font-weight:600;color:#0f1a30;flex:1}.net-item .nl{font-size:10px;color:#7c8aa8}

/* KOMENT */
.koment-box{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;padding:16px 20px;margin-top:14px;border:1px solid rgba(255,255,255,0.95);box-shadow:0 8px 22px rgba(30,64,175,0.07)}
.koment-box h3{margin-bottom:8px;color:#0f1a30;font-size:12px;font-weight:700}
.koment-box textarea{width:100%;border:1px solid rgba(220,230,250,0.9);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:12px;resize:vertical;min-height:74px;background:#f8faff;color:#0f1a30;outline:none}
.koment-box textarea:focus{border-color:#3b82f6;background:white}
.koment-box textarea::placeholder{color:#9ca8c0}

/* CONFIRM */
.action-btns{margin-top:14px}
.btn-confirm{display:block;width:100%;background:linear-gradient(135deg,#002B5C,#1e40af 50%,#3b82f6);color:white;border:none;padding:15px;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:0.3px;box-shadow:0 14px 30px rgba(0,43,92,0.38),inset 0 1px 0 rgba(255,255,255,0.2);transition:all 0.2s}
.btn-confirm:hover{transform:translateY(-1px);box-shadow:0 18px 36px rgba(0,43,92,0.46)}

/* POPUP */

function ngarko(){

    if(!oferta){document.getElementById('container').innerHTML='<div style="text-align:center;padding:60px"><h2 style="color:#1e3a8a">Oferta nuk u gjet.</h2><p style="color:#6b7a8d;margin-top:4px">Kontaktoni agentin tuaj.</p></div>';return;}
    ofertaData=oferta;
    const pakotList=oferta.lloji==='individ'?PAKOT.individ:PAKOT.familje_biznes;
        pakotGlobal=pakotList.filter(p=>(oferta.pakot||[]).some(op=>(typeof op==='object'?op.id:op)===p.id||(typeof op==='string'&&op.toLowerCase().includes(p.emri.toLowerCase())))).map(p=>{
        const c=(oferta.pakot||[]).find(op=>typeof op==='object'&&op.id===p.id);
        if(!c)return p;
        const merged={...p,...c};
        // Apliko tjera_0..tjera_8 mbi tjera_pikat
        if(merged.tjera_pikat){
            for(let ti=0;ti<9;ti++){
                const key='tjera_'+ti;
                if(c[key]!==undefined&&c[key]!==''){
                    merged.tjera_pikat[ti]={...merged.tjera_pikat[ti],vlera:c[key]};
                }
            }
        }
        return merged;
    });

function getSelected(){return pakotGlobal.filter(p=>selectedPakot.has(p.id));}
function isOptSelected(id){var c=document.getElementById('opt-'+id);return c&&c.classList.contains('selected');}
function paraKonfirmimit(){if(!getSelected().length){alert('Ju lutem zgjidhni së paku një paketë!');return;}if(!isOptSelected('jete')&&!isOptSelected('opinion')){document.getElementById('popup-optional').classList.add('active');return;}dergoPako();}
function vazhdo(shto){document.getElementById('popup-optional').classList.remove('active');if(shto){document.querySelector('.opt-card').scrollIntoView({behavior:'smooth'});return;}dergoPako();}

async function dergoPako(){
    const sel=getSelected(),ofertat=JSON.parse(localStorage.getItem('ofertat'))||[],oferta=ofertat[ofertaId];
    const pe=sel.map(p=>p.emri||p.id).join(', ');let ex=[];
    if(isOptSelected('jete'))ex.push('Jetë Plus Cash');
    if(isOptSelected('opinion'))ex.push('Opinioni i Dytë Mjekësor');
    const zf=pe+(ex.length?' + '+ex.join(', '):'');

    // Krijo version automatik me zgjedhjen e klientit
    const versione=ofertat[ofertaId].versione||[];
    versione.push({
        data:new Date().toISOString().split('T')[0],
        lloji:oferta.lloji,
        pakot:sel.map(p=>{const o={id:p.id,emri:p.emri,zona:p.zona,shuma:p.shuma,hospitalore:p.hospitalore,ambulantore:p.ambulantore||p.ambulatore,primi_madh:p.primi_madh,primi_femije:p.primi_femije,tjera_pikat:p.tjera_pikat};if(p.tjera_pikat&&Array.isArray(p.tjera_pikat))p.tjera_pikat.forEach((tp,idx)=>{if(tp&&tp.vlera)o['tjera_'+idx]=tp.vlera;});return o;}),
        emri:oferta.emri,
        burim:'konfirmim_klient',
        pakaZgjedhur:zf,
        koment:document.getElementById('koment').value
    });
    ofertat[ofertaId].versione=versione;

    ofertat[ofertaId].pakaZgjedhur=zf;ofertat[ofertaId].komentKlient=document.getElementById('koment').value;
    ofertat[ofertaId].konfirmuar=true;ofertat[ofertaId].dataKonfirmimit=new Date().toISOString().split('T')[0];
    ofertat[ofertaId].notification={type:'konfirmim',msg:'Klienti konfirmoi: '+zf,data:new Date().toISOString().split('T')[0],lexuar:false};
    ofertat[ofertaId].statusi='e_konfirmuar';
    localStorage.setItem('ofertat',JSON.stringify(ofertat));
    trackKonfirmim(zf,ex,document.getElementById('koment').value);
    try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({emriKlientit:oferta.emri,emailKlientit:oferta.email,pakaZgjedhur:zf,koment:document.getElementById('koment').value,emailAgjentit:oferta.krijuarNgaEmail||'gjonbalajagon@gmail.com'})});clearTimeout(t);}catch(e){}
    document.getElementById('container').innerHTML='<div class="success-msg"><div class="check" style="background:#22c55e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><h2>Faleminderit!</h2><p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti do t\'ju kontaktojë së shpejti.</p></div>';
}
// === TRACKING ===
const TAPI='https://sigal-platform-production.up.railway.app';
let tStart=Date.now();
function trackHapje(){try{fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'hapje',data:{userAgent:navigator.userAgent}})});}catch(e){}}
function trackKoha(){const s=Math.round((Date.now()-tStart)/1000);try{navigator.sendBeacon?navigator.sendBeacon(TAPI+'/api/oferta-track',new Blob([JSON.stringify({ofertaId,event:'koha',data:{sekonda:s}})],{type:'application/json'})):fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'koha',data:{sekonda:s}}),keepalive:true});}catch(e){}}
function trackKonfirmim(pakot,ops,kom){try{fetch(TAPI+'/api/oferta-track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ofertaId,event:'konfirmim',data:{pakot,opsionale:ops,koment:kom}})});}catch(e){}}
if(ofertaId){trackHapje();window.addEventListener('beforeunload',trackKoha);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')trackKoha();});}

ngarko();
</script>

<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Oferta Juaj</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'IBM Plex Sans',sans-serif;background:#f4f6f9;color:#1a2332}

        /* Header */
        .header{background:#002B5C;padding:14px 20px;display:flex;align-items:center;gap:12px}
        .header img{height:40px}
        .header h1{color:white;font-size:15px;font-weight:600}
        .container{max-width:640px;margin:0 auto;padding:20px 14px 60px}

        /* Oferta header */
        .oferta-header{background:white;border-radius:10px;padding:20px;margin-bottom:16px;border:1px solid #e5e9f0}
        .oferta-header h2{font-size:17px;color:#002B5C;margin-bottom:4px;font-weight:700}
        .oferta-header p{color:#6b7a8d;font-size:12px;line-height:1.5}
        .oferta-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .oferta-meta span{font-size:10px;color:#6b7a8d;background:#f4f6f9;padding:3px 8px;border-radius:14px}
        .countdown{background:#fff3cd !important;color:#856404 !important;font-weight:600}
        .countdown.urgent{background:#f8d7da !important;color:#721c24 !important}

        /* Section title */
        .section-title{font-size:11px;font-weight:700;color:#002B5C;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.5px}

        /* Category tags */
        .cat-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
        .cat-tag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:10px;display:inline-flex;align-items:center;gap:3px}
        .cat-tag.green{background:#dcfce7;color:#166534}
        .cat-tag.blue{background:#dbeafe;color:#1e40af}
        .cat-tag.orange{background:#ffedd5;color:#9a3412}
        .cat-tag.red{background:#fee2e2;color:#991b1b}
        .cat-tag.gray{background:#f3f4f6;color:#6b7280}

        /* Pako card */
        .pako-card{background:white;border-radius:8px;border:2px solid #e5e9f0;margin-bottom:6px;overflow:hidden;cursor:pointer;transition:all 0.2s}
        .pako-card:hover{border-color:#b0c4de}
        .pako-card.selected{border-color:#002B5C}

        .pako-row{padding:10px 14px;display:flex;align-items:flex-start;gap:10px}
        .pako-row input[type=checkbox]{width:18px;height:18px;accent-color:#002B5C;cursor:pointer;flex-shrink:0;margin-top:2px}
        .pako-row .p-info{flex:1;min-width:0}
        .pako-row .p-name{font-size:13px;font-weight:700;color:#002B5C}
        .pako-row .p-zone{font-size:10px;color:#6b7a8d;margin-top:1px}
        .pako-row .p-right{text-align:right;flex-shrink:0}
        .pako-row .p-price{font-size:17px;font-weight:800;color:#002B5C}
        .pako-row .p-per{font-size:9px;color:#6b7a8d}

        /* Foldable details */
        .pako-det{display:none;border-top:1px solid #f0f0f0}
        .pako-card.selected .pako-det{display:block}

        /* === PIKA 3: Shuma e siguruar me e madhe === */
        .shuma-banner{display:flex;align-items:center;justify-content:center;padding:10px 14px;background:linear-gradient(135deg,#002B5C 0%,#0047AB 100%);gap:8px}
        .shuma-banner .shuma-label{font-size:10px;color:rgba(255,255,255,0.8);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
        .shuma-banner .shuma-val{font-size:22px;font-weight:800;color:white;letter-spacing:-0.5px}

        /* === PIKA 4: Seksionet kryesore me te medha === */
        .section-hdr{padding:10px 14px;background:#002B5C;color:white;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background 0.2s}
        .section-hdr:hover{background:#003570}
        .section-hdr .sh-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
        .section-hdr .sh-icon{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .section-hdr .sh-icon svg{width:13px;height:13px;stroke:white;stroke-width:2;fill:none}
        .section-hdr .sh-title{font-size:12px;font-weight:700;letter-spacing:0.2px}
        .section-hdr .sh-subtitle{font-size:9px;opacity:0.7;font-weight:400;margin-top:1px}
        .section-hdr .sh-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-right:6px}
        .section-hdr .sh-badge.green{background:#22c55e;color:white}
        .section-hdr .sh-badge.blue{background:#3b82f6;color:white}
        .section-hdr .sh-badge.gray{background:rgba(255,255,255,0.2);color:white}
        .section-hdr .sh-badge.orange{background:#f59e0b;color:white}
        .section-hdr .arr{font-size:10px;transition:transform 0.2s;flex-shrink:0;opacity:0.7}
        .section-hdr.open .arr{transform:rotate(180deg)}

        .section-body{display:none;background:#fafbfc}
        .section-body.open{display:block}

        /* === PIKA 6: Mbulimet e mbledhura — me i dalluar === */
        .merged-summary{padding:10px 14px;background:#f0f4ff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:8px}
        .merged-summary .ms-badge{font-size:11px;font-weight:700;color:#002B5C;background:white;padding:3px 10px;border-radius:6px;border:1px solid #d0ddef}
        .merged-summary .ms-text{font-size:10px;color:#4a5568;line-height:1.4}
        .merged-items{padding:6px 14px 8px;display:flex;flex-wrap:wrap;gap:4px}
        .merged-items .mi{font-size:9px;color:#6b7a8d;background:white;padding:2px 7px;border-radius:4px;border:1px solid #e5e9f0}

        /* === PIKA 2: Nuk mbulohet — me zbritje === */
        .not-covered-summary{padding:10px 14px;background:#fff8f0;border-bottom:1px solid #f0e6d8;display:flex;align-items:flex-start;gap:8px}
        .not-covered-summary .nc-badge{font-size:10px;font-weight:700;color:#9a3412;background:#ffedd5;padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}
        .not-covered-summary .nc-text{font-size:10px;color:#78350f;line-height:1.4}
        .not-covered-summary .nc-text strong{font-weight:700}

        /* Rreshtat e detajeve */
        .det-r{display:flex;padding:6px 14px;font-size:11px;border-bottom:1px solid #f0f0f0;align-items:flex-start;gap:6px}
        .det-r:last-child{border-bottom:none}
        .det-r .dl{flex:1;color:#4a5568;line-height:1.3}
        .det-r .dv{flex-shrink:0;font-weight:600;color:#1a2332;text-align:right;max-width:45%}
        .det-r .dv.not-covered{color:#9a3412;font-weight:500;font-size:10px}
        .det-r .dv.not-covered .zbritje-note{display:block;font-size:9px;color:#b45309;font-weight:400;margin-top:1px}

        /* Primi rows */
        .primi-section{border-top:2px solid #002B5C}
        .primi-r{display:flex;padding:10px 14px;background:#f0f4ff;align-items:center}
        .primi-r .dl{flex:1;font-size:12px;font-weight:600;color:#002B5C}
        .primi-r .dv{font-size:16px;font-weight:800;color:#002B5C}
        .primi-r+.primi-r{background:#f8fafc;border-top:1px solid #e5e9f0}
        .primi-r+.primi-r .dv{font-size:14px;font-weight:700}

        /* Nota e spitalit publik */
        .nota-spital{padding:8px 14px;font-size:9px;color:#6b7a8d;background:#f8f9fa;border-top:1px solid #f0f0f0;line-height:1.4;font-style:italic}

        /* === PIKA 7: Pakot opsionale — me sqarime para selektimit === */
        .opt-card{background:white;border:2px solid #e5e9f0;border-radius:10px;margin-bottom:8px;overflow:hidden;cursor:pointer;transition:all 0.2s}
        .opt-card:hover{border-color:#b0c4de}
        .opt-card.selected{border-color:#002B5C}

        .opt-preview{padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
        .opt-preview input[type=checkbox]{width:18px;height:18px;accent-color:#002B5C;cursor:pointer;flex-shrink:0;margin-top:2px}
        .opt-preview .opt-main{flex:1;min-width:0}
        .opt-preview .opt-title{font-size:13px;font-weight:700;color:#002B5C;display:flex;align-items:center;gap:6px}
        .opt-preview .opt-tagline{font-size:10px;color:#4a5568;margin-top:2px;line-height:1.4}
        .opt-preview .opt-highlights{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
        .opt-preview .opt-hl{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600}
        .opt-preview .opt-hl.price{background:#dcfce7;color:#166534}
        .opt-preview .opt-hl.feature{background:#dbeafe;color:#1e40af}
        .opt-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0;align-self:flex-start;margin-top:2px}
        .opt-badge.rec{background:#002B5C;color:white}
        .opt-badge.new{background:#22c55e;color:white}

        /* Detajet e produktit opsional — shfaqen vetem pas selektimit */
        .opt-details{display:none;border-top:1px solid #f0f0f0;background:#fafbfc}
        .opt-card.selected .opt-details{display:block}
        .opt-det-hdr{padding:6px 14px;background:#002B5C;color:white;font-size:10px;font-weight:700}
        .opt-det-r{display:flex;padding:5px 14px;font-size:11px;border-bottom:1px solid #f0f0f0}
        .opt-det-r:last-child{border-bottom:none}
        .opt-det-r .dl{flex:1;color:#4a5568}
        .opt-det-r .dv{font-weight:600;color:#002B5C}
        .opt-primi{display:flex;padding:8px 14px;background:#f0f4ff;border-top:1px solid #e5e9f0}
        .opt-primi .dl{flex:1;font-size:11px;font-weight:600;color:#002B5C}
        .opt-primi .dv{font-size:13px;font-weight:800;color:#002B5C}

        /* App banner */
        .app-banner{background:#002B5C;border-radius:10px;padding:14px 16px;margin:16px 0;display:flex;align-items:center;gap:12px}
        .app-logo{width:44px;height:44px;border-radius:10px;flex-shrink:0;overflow:hidden;background:white}
        .app-logo img{width:44px;height:44px;border-radius:10px;display:block}
        .app-text{flex:1;min-width:0}
        .app-text .at-title{font-size:12px;font-weight:700;color:white}
        .app-text .at-free{font-size:10px;color:#22c55e;font-weight:700;margin-top:2px}
        .app-text .at-features{font-size:9px;color:rgba(255,255,255,0.7);margin-top:3px;line-height:1.4}
        .app-stores{display:flex;gap:6px;margin-top:6px}
        .store-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.15);color:white;font-size:9px;font-weight:600;padding:4px 10px;border-radius:6px;text-decoration:none;transition:background 0.2s}
        .store-btn:hover{background:rgba(255,255,255,0.25)}
        .store-btn svg{width:12px;height:12px;fill:white}

        /* === PIKA 8: Rrjeti mjekesor me kartele === */
        .net-section{background:white;border-radius:10px;border:1px solid #e5e9f0;margin:12px 0;overflow:hidden}
        .net-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .net-hdr:hover{background:#f8fafc}
        .net-hdr h4{font-size:12px;font-weight:700;color:#002B5C;display:flex;align-items:center;gap:6px}
        .net-hdr .net-desc{font-size:10px;color:#6b7a8d;font-weight:400;margin-top:2px;line-height:1.4}
        .net-count{background:#002B5C;color:white;font-size:9px;padding:1px 7px;border-radius:10px}
        .net-body{display:none;border-top:1px solid #e5e9f0}
        .net-body.open{display:block}
        .net-kartele{padding:10px 14px;background:#f0f4ff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:10px}
        .net-kartele-icon{width:36px;height:24px;border-radius:4px;background:#002B5C;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .net-kartele-icon svg{width:16px;height:16px;stroke:white;stroke-width:2;fill:none}
        .net-kartele-text{flex:1}
        .net-kartele-text .nkt{font-size:11px;font-weight:700;color:#002B5C}
        .net-kartele-text .nkd{font-size:9px;color:#4a5568;margin-top:1px;line-height:1.3}
        .net-cat{padding:5px 14px;background:#002B5C;color:white;font-size:10px;font-weight:700}
        .net-item{display:flex;align-items:center;padding:5px 14px;font-size:11px;border-bottom:1px solid #f8f8f8;gap:6px}
        .net-item:last-child{border-bottom:none}
        .net-dot{width:5px;height:5px;border-radius:50%;background:#0047AB;flex-shrink:0}
        .net-item .nn{font-weight:600;color:#1a2332;flex:1}
        .net-item .nl{font-size:10px;color:#6b7a8d}

        /* Koment + buttons */
        .koment-box{background:white;border-radius:10px;padding:16px;margin-top:16px;border:1px solid #e5e9f0}
        .koment-box h3{margin-bottom:6px;color:#002B5C;font-size:12px;font-weight:700}
        .koment-box textarea{width:100%;border:1px solid #e5e9f0;border-radius:6px;padding:8px 10px;font-family:inherit;font-size:11px;resize:vertical;min-height:60px}
        .action-btns{display:flex;gap:8px;margin-top:12px}
        .btn-confirm{flex:2;background:#002B5C;color:white;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.2s}
        .btn-confirm:hover{background:#0047AB}
        .btn-change{flex:1;background:white;color:#002B5C;border:2px solid #e5e9f0;padding:13px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn-change:hover{border-color:#002B5C}

        /* Popup */
        .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
        .popup-overlay.active{display:flex}
        .popup{background:white;border-radius:12px;padding:24px;max-width:380px;width:90%;text-align:center}
        .popup h3{font-size:15px;color:#002B5C;margin-bottom:6px}
        .popup p{font-size:12px;color:#6b7a8d;margin-bottom:16px;line-height:1.4}
        .popup-btns{display:flex;gap:8px}
        .popup-btns button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
        .popup-skip{background:#f4f6f9;border:1px solid #e5e9f0;color:#6b7a8d}
        .popup-add{background:#002B5C;border:none;color:white}

        /* Success & error */
        .success-msg{text-align:center;padding:50px 16px}
        .success-msg .check{width:50px;height:50px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
        .success-msg .check svg{stroke:white}
        .success-msg h2{color:#002B5C;margin-bottom:6px;font-size:18px}
        .success-msg p{color:#6b7a8d;font-size:13px;line-height:1.5}
        .nuk-gjendet{text-align:center;padding:60px 16px;color:#888}
        .oferta-footer{text-align:center;margin-top:24px;font-size:10px;color:#aaa;padding:12px}
        .oferta-footer a{color:#0047AB}

        @media(max-width:480px){.action-btns{flex-direction:column}.app-banner{flex-wrap:wrap}}
    </style>
</head>
<body>
    <div class="header">
        <img src="../Sigal-KS-Logo.webp" alt="Sigal">
        <h1>Sigal KS Insurance Group</h1>
    </div>
    <div class="container" id="container">
        <div class="nuk-gjendet">Duke ngarkuar...</div>
    </div>

    <!-- Popup per pakot opsionale -->
    <div class="popup-overlay" id="popup-optional">
        <div class="popup">
            <h3>Shtoni mbrojtje shtesë?</h3>
            <p>Pakot opsionale ofrojnë mbrojtje shtesë për ju dhe familjen tuaj. A dëshironi t'i shqyrtoni?</p>
            <div class="popup-btns">
                <button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button>
                <button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button>
            </div>
        </div>
    </div>

    <script src="../js/pakot.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const ofertaId = params.get('id');
        let ofertaData = null;
        let pakotZgjedhuraGlobal = [];

        // Rrjeti mjekesor
        const RRJETI = {
            spitalet: [
                {e:'Spitali Amerikan',q:'Prishtinë'},{e:'Spitali "Lindja"',q:'Prishtinë'},
                {e:'Klinika Kirurgjike "Aloka"',q:'Prishtinë'},{e:'Spitali Fati Im',q:'Prishtinë'},
                {e:'Spitali Bahçeçi',q:'Prishtinë–Shkup km9'},{e:'Spitali IHC',q:'Prishtinë–Ferizaj km5'},
                {e:'Klinika Gjermane e Syrit',q:'Prishtinë'},{e:'Olive Medical Group',q:'Prishtinë'},
                {e:'Spitali Royal Medical',q:'Prishtinë–Ferizaj km15'},{e:'United Hospital',q:'Prishtinë–Ferizaj km7'}
            ],
            laboratoret: [
                {e:'ProLab',q:'Prishtinë'},{e:'ImunoLab',q:'Prishtinë'},{e:'Avicena',q:'Prishtinë'},
                {e:'E-Lab',q:'Prishtinë'},{e:'Mikrobioanaliza',q:'Prishtinë'}
            ],
            dentaret: [
                {e:'Melisa Dent',q:'Prishtinë'},{e:'Dental Clinic Stomatologjia',q:'Prishtinë'},
                {e:'Klinika Gjermane e Dhëmbit',q:'Prishtinë'},{e:'Mikro & Dent',q:'Prishtinë'},
                {e:'Top Dent',q:'Prishtinë'},{e:'Dent In',q:'Prishtinë'}
            ],
            ordinanca: [
                {e:'Optika Neziri',q:'Prishtinë',z:'10-50%'},{e:'Optika Simoni',q:'Prishtinë',z:'20%'},
                {e:'DIDA & ROKA Eye Clinic',q:'Prishtinë',z:'10%'},{e:'Farmacia Ime',q:'Prishtinë',z:'10%'},
                {e:'VSO Clinic',q:'Prishtinë',z:'Paketë 30€'},{e:'Poliklinika Diagnoza',q:'Gjilan',z:'20%'},
                {e:'IDMG Swiss Clinique 2',q:'Gjilan',z:'20%'},{e:'Biolab',q:'Gjilan',z:'20%'},
                {e:'Physio Move',q:'Prishtinë',z:'20%'},{e:'Cambridge Clinical Lab',q:'Prishtinë',z:'20%'}
            ]
        };

        // SVG icons per seksionet
        const ICONS = {
            hospitalore: '<svg viewBox="0 0 24 24"><path d="M3 21h18M9 8h6M12 8v6M9 21V8a3 3 0 0 1 3-3h0a3 3 0 0 1 3 3v13" stroke-linecap="round" stroke-linejoin="round"/></svg>',
            ambulantore: '<svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6" stroke-linecap="round"/></svg>',
            tjera: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        };

        // Tags per pako card
        function gjenerTags(p) {
            const t = p.tags || {};
            let html = '<div class="cat-tags">';
            if (t.hospitalore) {
                html += `<span class="cat-tag green">Hospitalizim ${t.hospitalore}</span>`;
            }
            if (t.ambulantore) {
                if (t.ambulantore === 'Nuk mbulohet') {
                    html += '<span class="cat-tag gray">Ambulantore: Rrjeti</span>';
                } else {
                    html += `<span class="cat-tag blue">Ambulantore ${t.ambulantore}</span>`;
                }
            }
            if (t.tjera) {
                if (t.tjera === 'Rrjeti Mjekësor') {
                    html += '<span class="cat-tag gray">Përfitime: Rrjeti</span>';
                } else {
                    html += `<span class="cat-tag orange">Përfitime ${t.tjera}</span>`;
                }
            }
            if (t.aksidente) {
                html += `<span class="cat-tag red">Aksidente ${t.aksidente}</span>`;
            }
            html += '</div>';
            return html;
        }

        // Gjenero detajet e plota per nje pako
        function gjenerDetaje(p, ei) {
            let html = '';

            // === PIKA 3: Shuma e siguruar — e madhe dhe e dalluar ===
            html += `<div class="shuma-banner">
                <span class="shuma-label">Shuma e Siguruar</span>
                <span class="shuma-val">€ ${p.shuma}</span>
            </div>`;

            // === HOSPITALORE ===
            const hospAllSame = p.hospitalore_pikat && p.hospitalore_pikat.every(h => h.vlera === p.hospitalore_pikat[0].vlera);
            const hospBadgeCls = p.hospitalore === '100%' ? 'green' : 'blue';
            html += `<div class="section-hdr" onclick="event.stopPropagation();tglSection(this)">
                <div class="sh-left">
                    <div class="sh-icon">${ICONS.hospitalore}</div>
                    <div>
                        <div class="sh-title">Trajtimet Mjekësore Hospitalore</div>
                        <div class="sh-subtitle">Shtrirje në spital · Dhomë gjysëmprivate</div>
                    </div>
                </div>
                <span class="sh-badge ${hospBadgeCls}">${p.hospitalore}</span>
                <span class="arr">▾</span>
            </div>`;
            html += `<div class="section-body">`;
            if (hospAllSame) {
                html += `<div class="merged-summary">
                    <span class="ms-badge">${p.hospitalore_pikat[0].vlera}</span>
                    <span class="ms-text">Të gjitha shërbimet hospitalore mbulohen në këtë përqindje</span>
                </div>`;
                html += `<div class="merged-items">`;
                p.hospitalore_pikat.forEach(h => { html += `<span class="mi">${h.emri}</span>`; });
                html += `</div>`;
            } else {
                p.hospitalore_pikat.forEach(h => {
                    html += `<div class="det-r"><div class="dl">${h.emri}</div><div class="dv">${h.vlera}</div></div>`;
                });
            }
            html += `</div>`;

            // === AMBULANTORE ===
            const ambAllSame = p.ambulantore_pikat && p.ambulantore_pikat.every(a => a.vlera === p.ambulantore_pikat[0].vlera);
            let ambBadgeCls = 'blue';
            let ambBadgeText = p.ambulantore;
            if (p.ambulantore === 'Nuk mbulohet' || p.ambulantore_zbritje) {
                ambBadgeCls = 'gray';
                ambBadgeText = 'Zbritje';
            }
            if (ambBadgeText.length > 12) ambBadgeText = ambBadgeText.substring(0, 10) + '…';

            html += `<div class="section-hdr" onclick="event.stopPropagation();tglSection(this)">
                <div class="sh-left">
                    <div class="sh-icon">${ICONS.ambulantore}</div>
                    <div>
                        <div class="sh-title">Trajtimet Mjekësore Ambulantore</div>
                        <div class="sh-subtitle">Trajtime pa shtrirje në spital</div>
                    </div>
                </div>
                <span class="sh-badge ${ambBadgeCls}">${ambBadgeText}</span>
                <span class="arr">▾</span>
            </div>`;
            html += `<div class="section-body">`;

            // === PIKA 2: Kur nuk mbulohet — sheno me zbritje ===
            if (p.ambulantore_zbritje) {
                html += `<div class="not-covered-summary">
                    <span class="nc-badge">Nuk mbulohet</span>
                    <div class="nc-text"><strong>Zbritje brenda Rrjetit Mjekësor</strong> sipas marrëveshjeve me institucionet partnere</div>
                </div>`;
                html += `<div class="merged-items">`;
                p.ambulantore_pikat.forEach(a => { html += `<span class="mi">${a.emri}</span>`; });
                html += `</div>`;
            } else if (ambAllSame) {
                html += `<div class="merged-summary">
                    <span class="ms-badge">${p.ambulantore_pikat[0].vlera}</span>
                    <span class="ms-text">Të gjitha shërbimet ambulantore mbulohen në këtë nivel</span>
                </div>`;
                html += `<div class="merged-items">`;
                p.ambulantore_pikat.forEach(a => { html += `<span class="mi">${a.emri}</span>`; });
                html += `</div>`;
            } else {
                p.ambulantore_pikat.forEach(a => {
                    html += `<div class="det-r"><div class="dl">${a.emri}</div><div class="dv">${a.vlera}</div></div>`;
                });
            }
            html += `</div>`;

            // === TRAJTIME MJEKESORE TJERA (me aksidentin dhe onkologjine brenda — PIKA 5) ===
            // Percakto badge
            const tjeraCovers = p.tjera_pikat.filter(t => !t.zbritje);
            const tjeraNonCovers = p.tjera_pikat.filter(t => t.zbritje);
            let tjeraBadgeCls = 'orange';
            let tjeraBadgeText = 'Mikse';
            if (tjeraNonCovers.length === 0) { tjeraBadgeCls = 'blue'; tjeraBadgeText = 'Mbulohet'; }
            else if (tjeraCovers.length <= 3) { tjeraBadgeCls = 'gray'; tjeraBadgeText = 'Zbritje'; }
            else { tjeraBadgeCls = 'blue'; tjeraBadgeText = 'Mbulohet'; }

            html += `<div class="section-hdr" onclick="event.stopPropagation();tglSection(this)">
                <div class="sh-left">
                    <div class="sh-icon">${ICONS.tjera}</div>
                    <div>
                        <div class="sh-title">Trajtime Mjekësore tjera</div>
                        <div class="sh-subtitle">Shtatzani · Dentar · Optik · Aksidente · Onkologji</div>
                    </div>
                </div>
                <span class="sh-badge ${tjeraBadgeCls}">${tjeraBadgeText}</span>
                <span class="arr">▾</span>
            </div>`;
            html += `<div class="section-body">`;

            if (p.tjera_merged) {
                // Kur te gjitha "nuk mbulohet" — shfaq merged me zbritje
                html += `<div class="not-covered-summary">
                    <span class="nc-badge">Nuk mbulohet</span>
                    <div class="nc-text"><strong>Zbritje brenda Rrjetit Mjekësor</strong> sipas marrëveshjeve me institucionet</div>
                </div>`;
                html += `<div class="merged-items">`;
                tjeraNonCovers.forEach(t => { html += `<span class="mi">${t.emri}</span>`; });
                html += `</div>`;
                // Rreshtat qe mbulohen (autoambulanca, aksidenti, onkologjike)
                tjeraCovers.forEach(t => {
                    html += `<div class="det-r"><div class="dl">${t.emri}</div><div class="dv">${t.vlera}</div></div>`;
                });
            } else {
                // Te gjitha me vlera te ndryshme
                p.tjera_pikat.forEach(t => {
                    html += `<div class="det-r"><div class="dl">${t.emri}</div><div class="dv">${t.vlera}</div></div>`;
                });
            }
            html += `</div>`;

            // === PRIMET ===
            html += `<div class="primi-section">`;
            html += `<div class="primi-r"><div class="dl">Primi${!ei && p.primi_femije ? ' mujor (mbi 18 vjeç)' : (ei ? ' vjetor' : ' mujor')}</div><div class="dv">€ ${p.primi_madh}${p.primi_suffix}</div></div>`;
            if (!ei && p.primi_femije) {
                html += `<div class="primi-r"><div class="dl">Primi mujor (fëmijë nën 18 vjeç)</div><div class="dv">€ ${p.primi_femije}/muaj</div></div>`;
            }
            html += `</div>`;

            // Nota e spitalit publik
            html += `<div class="nota-spital">*Nëse shërbimet në kuadër të shtrimit në spital merren në spital publik pa pagesë, i siguruari do të dëmshpërblehet 50% deri në 500€ të shpenzimeve sikur shërbimet të ishin marrë në spital privat.</div>`;

            return html;
        }

        // === PIKA 7: Gjenero kartelën opsionale me sqarime para selektimit ===
        function gjenerOptCard(opt, idSuffix) {
            const o = PAKOT.opsionale[opt];
            if (!o) return '';
            const badgeCls = o.badge === 'Rekomanduar' ? 'rec' : 'new';
            return `
            <div class="opt-card" id="opt-${idSuffix}" onclick="toggleOpt('${idSuffix}')">
                <div class="opt-preview">
                    <input type="checkbox" id="cb-opt-${idSuffix}" onclick="event.stopPropagation();toggleOpt('${idSuffix}')">
                    <div class="opt-main">
                        <div class="opt-title">${o.emri} <span class="opt-badge ${badgeCls}">${o.badge}</span></div>
                        <div class="opt-tagline">${o.tagline}</div>
                        <div class="opt-highlights">
                            <span class="opt-hl price">${o.primi_mujor}</span>
                            ${o.detajet.slice(0, 2).map(d => `<span class="opt-hl feature">${d.emri}</span>`).join('')}
                        </div>
                    </div>
                </div>
                <div class="opt-details">
                    <div class="opt-det-hdr">Detajet e mbulimit</div>
                    ${o.detajet.map(d => `<div class="opt-det-r"><div class="dl">${d.emri}</div><div class="dv">${d.vlera}</div></div>`).join('')}
                    <div class="opt-primi"><div class="dl">Primi</div><div class="dv">${o.primi_mujor} · ${o.primi_vjetor}</div></div>
                </div>
            </div>`;
        }

        function ngarko() {
            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            const oferta = ofertat[ofertaId];
            if (!oferta) {
                document.getElementById('container').innerHTML = '<div class="nuk-gjendet"><h2>Oferta nuk u gjet.</h2><p>Kontaktoni agentin tuaj.</p></div>';
                return;
            }

            ofertaData = oferta;
            const pakotList = oferta.lloji === 'individ' ? PAKOT.individ : PAKOT.familje_biznes;
            pakotZgjedhuraGlobal = pakotList.filter(p =>
                (oferta.pakot || []).some(op =>
                    (typeof op === 'object' ? op.id : op) === p.id ||
                    (typeof op === 'string' && op.toLowerCase().includes(p.emri.toLowerCase()))
                )
            ).map(p => {
                const c = (oferta.pakot || []).find(op => typeof op === 'object' && op.id === p.id);
                return c ? { ...p, ...c } : p;
            });

            if (pakotZgjedhuraGlobal.length === 0) {
                document.getElementById('container').innerHTML = '<div class="nuk-gjendet"><h2>Nuk ka paketa.</h2></div>';
                return;
            }

            const ei = oferta.lloji === 'individ';
            const dm = Math.ceil((new Date(oferta.dataSkadon) - new Date()) / 86400000);
            const cc = dm <= 5 ? 'countdown urgent' : 'countdown';
            const ti = RRJETI.spitalet.length + RRJETI.laboratoret.length + RRJETI.dentaret.length + RRJETI.ordinanca.length;

            document.getElementById('container').innerHTML = `
                <div class="oferta-header">
                    <h2>Ofertë për ${oferta.emri}</h2>
                    <p>Zgjidhni paketën ose pakot që ju përshtaten dhe konfirmoni zgjedhjen tuaj.</p>
                    <div class="oferta-meta">
                        <span class="${cc}">Skadon për ${dm > 0 ? dm + ' ditë' : 'Skaduar'}</span>
                        <span>Krijuar: ${oferta.dataKrijimit}</span>
                    </div>
                </div>

                <div class="section-title">Zgjidhni paketën</div>
                ${pakotZgjedhuraGlobal.map(p => `
                <div class="pako-card" id="card-${p.id}" onclick="togglePako('${p.id}')">
                    <div class="pako-row">
                        <input type="checkbox" id="cb-${p.id}" onclick="event.stopPropagation();togglePako('${p.id}')">
                        <div class="p-info">
                            <div class="p-name">${p.emri}</div>
                            <div class="p-zone">${p.zona} · € ${p.shuma} mbulim</div>
                            ${gjenerTags(p)}
                        </div>
                        <div class="p-right">
                            <div class="p-price">€ ${p.primi_madh}</div>
                            <div class="p-per">${p.primi_suffix === '/vit' ? 'për vit' : 'për muaj'}</div>
                        </div>
                    </div>
                    <div class="pako-det">${gjenerDetaje(p, ei)}</div>
                </div>`).join('')}

                <!-- Pakot opsionale -->
                <div class="section-title">Mbrojtje shtesë (opsionale)</div>
                ${gjenerOptCard('jete_plus_cash', 'jete')}
                ${gjenerOptCard('opinioni_dyte', 'opinion')}

                <!-- App banner -->
                <div class="app-banner">
                    <div class="app-logo">
                        <img src="../sigal-app-icon.png" alt="Sigal App" onerror="this.style.display='none';this.parentElement.innerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;white&quot; stroke-width=&quot;2&quot; style=&quot;width:24px;height:24px&quot;><rect x=&quot;5&quot; y=&quot;2&quot; width=&quot;14&quot; height=&quot;20&quot; rx=&quot;2&quot;/></svg>'">
                    </div>
                    <div class="app-text">
                        <div class="at-title">Sigal Kosova App</div>
                        <div class="at-free">FALAS: Paraqitja e rimbursimeve 100% online</div>
                        <div class="at-features">Aplikim online · Upload dokumentesh · Lexim automatik i faturave · Ndjekja e statusit · Historiku i kërkesave · Blerje me zbritje</div>
                        <div class="app-stores">
                            <a href="https://apps.apple.com/us/app/sigal-kosova/id6756305258" target="_blank" class="store-btn">
                                <svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83"/><path d="M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>
                                App Store
                            </a>
                            <a href="https://play.google.com/store/apps/details?id=com.sigalkosova.einsureapp" target="_blank" class="store-btn">
                                <svg viewBox="0 0 24 24"><path d="M3 20.5V3.5c0-.59.34-1.11.84-1.35L13.69 12l-9.85 9.85c-.5-.24-.84-.76-.84-1.35zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm2.59-1.46c.37.22.6.63.6 1.04s-.23.82-.6 1.04l-1.94 1.13-2.5-2.5 2.5-2.5 1.94 1.13zM6.05 2.66l10.76 6.22-2.27 2.27-8.49-8.49z"/></svg>
                                Google Play
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Rrjeti mjekosor -->
                <div class="net-section">
                    <div class="net-hdr" onclick="this.nextElementSibling.classList.toggle('open')">
                        <div>
                            <h4>Rrjeti Mjekësor SIGAL <span class="net-count">${ti}</span></h4>
                            <div class="net-desc">Institucionet mjekësore me të cilat kemi bashkëpunim për shfrytëzim të Kartelës SIGAL. Prezantoni kartelën dhe përfitoni mbulim direkt.</div>
                        </div>
                        <span style="font-size:10px;color:#6b7a8d">Shiko ▾</span>
                    </div>
                    <div class="net-body">
                        <div class="net-kartele">
                            <div class="net-kartele-icon">
                                <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                            </div>
                            <div class="net-kartele-text">
                                <div class="nkt">Kartela SIGAL</div>
                                <div class="nkd">Paraqiteni kartelën tuaj të sigurimit në çdo institucion brenda rrjetit për mbulim direkt pa pagesë paraprake</div>
                            </div>
                        </div>
                        <div class="net-cat">Spitalet (${RRJETI.spitalet.length})</div>
                        ${RRJETI.spitalet.map(s => `<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}
                        <div class="net-cat">Laboratoret (${RRJETI.laboratoret.length})</div>
                        ${RRJETI.laboratoret.map(s => `<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}
                        <div class="net-cat">Dentarët (${RRJETI.dentaret.length})</div>
                        ${RRJETI.dentaret.map(s => `<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}
                        <div class="net-cat">Ordinanca me zbritje (${RRJETI.ordinanca.length})</div>
                        ${RRJETI.ordinanca.map(s => `<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q} · ${s.z}</span></div>`).join('')}
                    </div>
                </div>

                <div class="koment-box">
                    <h3>Koment (opsional)</h3>
                    <textarea id="koment" placeholder="Keni pyetje ose kërkesa? Shkruani këtu..."></textarea>
                </div>
                <div class="action-btns">
                    <button class="btn-confirm" onclick="paraKonfirmimit()">Konfirmoj Zgjedhjen</button>
                    <button class="btn-change" onclick="kerkoNdryshim()">Kërko Ndryshim</button>
                </div>
                <div class="oferta-footer">
                    © ${new Date().getFullYear()} SIGAL Insurance Group Kosovo<br>
                    <a href="https://sigal-ks.com">sigal-ks.com</a> · demet.shendetsore@sigal-ks.com · +383 38 240 241
                </div>
            `;
        }

        function togglePako(id) {
            const c = document.getElementById('card-' + id);
            const cb = document.getElementById('cb-' + id);
            c.classList.toggle('selected');
            cb.checked = c.classList.contains('selected');
        }

        function toggleOpt(id) {
            const c = document.getElementById('opt-' + id);
            const cb = document.getElementById('cb-opt-' + id);
            c.classList.toggle('selected');
            cb.checked = c.classList.contains('selected');
        }

        function tglSection(h) {
            h.classList.toggle('open');
            h.nextElementSibling.classList.toggle('open');
        }

        function getSelected() {
            return pakotZgjedhuraGlobal.filter(p => {
                const cb = document.getElementById('cb-' + p.id);
                return cb && cb.checked;
            });
        }

        function paraKonfirmimit() {
            if (getSelected().length === 0) {
                alert('Ju lutem zgjidhni së paku një paketë!');
                return;
            }
            const oj = document.getElementById('cb-opt-jete');
            const oo = document.getElementById('cb-opt-opinion');
            if (oj && oo && !oj.checked && !oo.checked) {
                document.getElementById('popup-optional').classList.add('active');
                return;
            }
            dergoPako();
        }

        function vazhdo(shto) {
            document.getElementById('popup-optional').classList.remove('active');
            if (shto) {
                document.querySelector('.opt-card').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            dergoPako();
        }

        async function dergoPako() {
            const sel = getSelected();
            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            const oferta = ofertat[ofertaId];
            const pe = sel.map(p => p.emri || p.id).join(', ');
            let ex = [];
            if (document.getElementById('cb-opt-jete')?.checked) ex.push('Jetë Plus Cash');
            if (document.getElementById('cb-opt-opinion')?.checked) ex.push('Opinioni i Dytë Mjekësor');

            const zgjedhjaFull = pe + (ex.length ? ' + ' + ex.join(', ') : '');

            ofertat[ofertaId].pakaZgjedhur = zgjedhjaFull;
            ofertat[ofertaId].komentKlient = document.getElementById('koment').value;
            ofertat[ofertaId].konfirmuar = true;
            ofertat[ofertaId].dataKonfirmimit = new Date().toISOString().split('T')[0];
            ofertat[ofertaId].notification = {
                type: 'konfirmim',
                msg: 'Klienti konfirmoi: ' + zgjedhjaFull,
                data: new Date().toISOString().split('T')[0],
                lexuar: false
            };
            localStorage.setItem('ofertat', JSON.stringify(ofertat));

            try {
                const c = new AbortController();
                const t = setTimeout(() => c.abort(), 5000);
                await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte', {
                    method: 'POST',
                    signal: c.signal,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emriKlientit: oferta.emri,
                        emailKlientit: oferta.email,
                        pakaZgjedhur: zgjedhjaFull,
                        koment: document.getElementById('koment').value,
                        emailAgjentit: oferta.krijuarNgaEmail || 'gjonbalajagon@gmail.com'
                    })
                });
                clearTimeout(t);
            } catch (e) {
                console.error('Email error:', e);
            }

            document.getElementById('container').innerHTML = `
                <div class="success-msg">
                    <div class="check" style="background:#22c55e">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h2>Faleminderit!</h2>
                    <p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti juaj do t'ju kontaktojë së shpejti.</p>
                </div>`;
        }

        function kerkoNdryshim() {
            const k = document.getElementById('koment').value.trim();
            if (!k) {
                alert('Shkruani në koment çfarë ndryshimesh dëshironi, pastaj klikoni "Kërko Ndryshim".');
                document.getElementById('koment').focus();
                return;
            }

            const ofertat = JSON.parse(localStorage.getItem('ofertat')) || [];
            ofertat[ofertaId].komentKlient = 'KËRKESË PËR NDRYSHIM: ' + k;
            ofertat[ofertaId].konfirmuar = false;
            ofertat[ofertaId].notification = {
                type: 'ndryshim',
                msg: 'Klienti kërkon ndryshim: ' + k.substring(0, 80),
                data: new Date().toISOString().split('T')[0],
                lexuar: false
            };
            localStorage.setItem('ofertat', JSON.stringify(ofertat));

            try {
                fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emriKlientit: ofertaData.emri,
                        emailKlientit: ofertaData.email,
                        pakaZgjedhur: 'KËRKESË PËR NDRYSHIM',
                        koment: k,
                        emailAgjentit: ofertaData.krijuarNgaEmail || 'gjonbalajagon@gmail.com'
                    })
                });
            } catch (e) {}

            document.getElementById('container').innerHTML = `
                <div class="success-msg">
                    <div class="check" style="background:#0047AB">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke="white">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </div>
                    <h2>Kërkesa u dërgua!</h2>
                    <p>Agjenti juaj do ta shqyrtojë kërkesën<br>dhe do t'ju kontaktojë me ofertë të përditësuar.</p>
                </div>`;
        }

        ngarko();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Oferta Juaj</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'IBM Plex Sans',sans-serif;background:#f4f6f9;color:#1a2332}
        .header{background:#002B5C;padding:14px 20px;display:flex;align-items:center;gap:12px}
        .header img{height:40px}
        .header h1{color:white;font-size:15px;font-weight:600}
        .container{max-width:640px;margin:0 auto;padding:20px 14px 60px}
        .oferta-header{background:white;border-radius:10px;padding:20px;margin-bottom:16px;border:1px solid #e5e9f0}
        .oferta-header h2{font-size:17px;color:#002B5C;margin-bottom:4px;font-weight:700}
        .oferta-header p{color:#6b7a8d;font-size:12px;line-height:1.5}
        .oferta-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .oferta-meta span{font-size:10px;color:#6b7a8d;background:#f4f6f9;padding:3px 8px;border-radius:14px}
        .countdown{background:#fff3cd !important;color:#856404 !important;font-weight:600}
        .countdown.urgent{background:#f8d7da !important;color:#721c24 !important}
        .section-title{font-size:11px;font-weight:700;color:#002B5C;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.5px}
        .pako-card{background:white;border-radius:8px;border:2px solid #e5e9f0;margin-bottom:6px;overflow:hidden;cursor:pointer;transition:all 0.2s}
        .pako-card:hover{border-color:#b0c4de}
        .pako-card.selected{border-color:#002B5C}
        .pako-row{padding:10px 14px;display:flex;align-items:center;gap:10px}
        .pako-row input[type=checkbox]{width:18px;height:18px;accent-color:#002B5C;cursor:pointer;flex-shrink:0}
        .pako-row .p-info{flex:1;min-width:0}
        .pako-row .p-name{font-size:13px;font-weight:700;color:#002B5C}
        .pako-row .p-zone{font-size:11px;color:#6b7a8d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pako-row .p-right{text-align:right;flex-shrink:0}
        .pako-row .p-price{font-size:17px;font-weight:800;color:#002B5C}
        .pako-row .p-per{font-size:9px;color:#6b7a8d}
        .pako-det{display:none;border-top:1px solid #f0f0f0}
        .pako-card.selected .pako-det{display:block}
        .det-hdr{padding:5px 14px;background:#002B5C;color:white;font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
        .det-hdr .arr{font-size:9px;transition:transform 0.2s}
        .det-hdr.open .arr{transform:rotate(180deg)}
        .det-rows{display:none}
        .det-rows.open{display:block}
        .det-r{display:flex;padding:5px 14px;font-size:11px;border-bottom:1px solid #f8f8f8}
        .det-r:last-child{border-bottom:none}
        .det-r .dl{flex:1;color:#6b7a8d}
        .det-r .dv{flex:1;font-weight:600;color:#1a2332;text-align:right}
        .primi-r{display:flex;padding:8px 14px;background:#f0f4ff;border-top:1px solid #e5e9f0}
        .primi-r .dl{flex:1;font-size:11px;font-weight:600;color:#002B5C}
        .primi-r .dv{font-size:14px;font-weight:800;color:#002B5C}
        .opt-card{background:white;border:2px solid #e5e9f0;border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.2s}
        .opt-card:hover{border-color:#b0c4de}
        .opt-card.selected{border-color:#002B5C;background:#f0f4ff}
        .opt-card input[type=checkbox]{width:18px;height:18px;accent-color:#002B5C}
        .opt-info{flex:1}
        .opt-info h4{font-size:12px;font-weight:700;color:#002B5C}
        .opt-info p{font-size:10px;color:#6b7a8d;margin-top:1px;line-height:1.3}
        .opt-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap}
        .opt-badge.rec{background:#002B5C;color:white}
        .opt-badge.new{background:#22c55e;color:white}
        .app-banner{background:#002B5C;border-radius:10px;padding:14px 16px;margin:16px 0;display:flex;align-items:center;gap:12px}
        .app-logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .app-logo svg{stroke:white;width:20px;height:20px}
        .app-text{flex:1;min-width:0}
        .app-text .at-title{font-size:12px;font-weight:700;color:white}
        .app-text .at-free{font-size:10px;color:#22c55e;font-weight:700;margin-top:1px}
        .app-text .at-desc{font-size:9px;color:rgba(255,255,255,0.7);margin-top:1px}
        .app-stores{display:flex;gap:6px;margin-top:6px}
        .store-btn{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.15);color:white;font-size:9px;font-weight:600;padding:4px 10px;border-radius:6px;text-decoration:none;transition:background 0.2s}
        .store-btn:hover{background:rgba(255,255,255,0.25)}
        .store-btn svg{width:12px;height:12px;fill:white}
        .net-section{background:white;border-radius:10px;border:1px solid #e5e9f0;margin:12px 0;overflow:hidden}
        .net-hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
        .net-hdr:hover{background:#f8fafc}
        .net-hdr h4{font-size:12px;font-weight:700;color:#002B5C;display:flex;align-items:center;gap:6px}
        .net-count{background:#002B5C;color:white;font-size:9px;padding:1px 7px;border-radius:10px}
        .net-body{display:none;border-top:1px solid #e5e9f0}
        .net-body.open{display:block}
        .net-cat{padding:5px 14px;background:#002B5C;color:white;font-size:10px;font-weight:700}
        .net-item{display:flex;align-items:center;padding:5px 14px;font-size:11px;border-bottom:1px solid #f8f8f8;gap:6px}
        .net-item:last-child{border-bottom:none}
        .net-dot{width:5px;height:5px;border-radius:50%;background:#0047AB;flex-shrink:0}
        .net-item .nn{font-weight:600;color:#1a2332;flex:1}
        .net-item .nl{font-size:10px;color:#6b7a8d}
        .koment-box{background:white;border-radius:10px;padding:16px;margin-top:16px;border:1px solid #e5e9f0}
        .koment-box h3{margin-bottom:6px;color:#002B5C;font-size:12px;font-weight:700}
        .koment-box textarea{width:100%;border:1px solid #e5e9f0;border-radius:6px;padding:8px 10px;font-family:inherit;font-size:11px;resize:vertical;min-height:60px}
        .action-btns{display:flex;gap:8px;margin-top:12px}
        .btn-confirm{flex:2;background:#002B5C;color:white;border:none;padding:13px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.2s}
        .btn-confirm:hover{background:#0047AB}
        .btn-change{flex:1;background:white;color:#002B5C;border:2px solid #e5e9f0;padding:13px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn-change:hover{border-color:#002B5C}
        .social-proof{text-align:center;margin-top:10px;font-size:10px;color:#6b7a8d}
        .social-proof strong{color:#002B5C}
        .popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
        .popup-overlay.active{display:flex}
        .popup{background:white;border-radius:12px;padding:24px;max-width:380px;width:90%;text-align:center}
        .popup h3{font-size:15px;color:#002B5C;margin-bottom:6px}
        .popup p{font-size:12px;color:#6b7a8d;margin-bottom:16px;line-height:1.4}
        .popup-btns{display:flex;gap:8px}
        .popup-btns button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
        .popup-skip{background:#f4f6f9;border:1px solid #e5e9f0;color:#6b7a8d}
        .popup-add{background:#002B5C;border:none;color:white}
        .success-msg{text-align:center;padding:50px 16px}
        .success-msg .check{width:50px;height:50px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
        .success-msg .check svg{stroke:white}
        .success-msg h2{color:#002B5C;margin-bottom:6px;font-size:18px}
        .success-msg p{color:#6b7a8d;font-size:13px;line-height:1.5}
        .nuk-gjendet{text-align:center;padding:60px 16px;color:#888}
        .oferta-footer{text-align:center;margin-top:24px;font-size:10px;color:#aaa;padding:12px}
        .oferta-footer a{color:#0047AB}
        @media(max-width:480px){.action-btns{flex-direction:column}.app-banner{flex-wrap:wrap}}
    </style>
</head>
<body>
    <div class="header"><img src="../Sigal-KS-Logo.webp" alt="Sigal"><h1>Sigal KS Insurance Group</h1></div>
    <div class="container" id="container"><div class="nuk-gjendet">Duke ngarkuar...</div></div>
    <div class="popup-overlay" id="popup-optional"><div class="popup"><h3>Shtoni mbrojtje shtesë?</h3><p>Pakot opsionale ofrojnë mbrojtje shtesë për ju dhe familjen tuaj. A dëshironi t'i shqyrtoni?</p><div class="popup-btns"><button class="popup-skip" onclick="vazhdo(false)">Jo, faleminderit</button><button class="popup-add" onclick="vazhdo(true)">Po, shikoji</button></div></div></div>
    <script src="../js/pakot.js"></script>
    <script>
const params=new URLSearchParams(window.location.search),ofertaId=params.get('id');
let ofertaData=null,pakotZgjedhuraGlobal=[];
const RRJETI={spitalet:[{e:'Spitali Amerikan',q:'Prishtinë'},{e:'Spitali "Lindja"',q:'Prishtinë'},{e:'Klinika Kirurgjike "Aloka"',q:'Prishtinë'},{e:'Spitali Fati Im',q:'Prishtinë'},{e:'Spitali Bahçeçi',q:'Prishtinë–Shkup km9'},{e:'Spitali IHC',q:'Prishtinë–Ferizaj km5'},{e:'Klinika Gjermane e Syrit',q:'Prishtinë'},{e:'Olive Medical Group',q:'Prishtinë'},{e:'Spitali Royal Medical',q:'Prishtinë–Ferizaj km15'},{e:'United Hospital',q:'Prishtinë–Ferizaj km7'}],laboratoret:[{e:'ProLab',q:'Prishtinë'},{e:'ImunoLab',q:'Prishtinë'},{e:'Avicena',q:'Prishtinë'},{e:'E-Lab',q:'Prishtinë'},{e:'Mikrobioanaliza',q:'Prishtinë'}],dentaret:[{e:'Melisa Dent',q:'Prishtinë'},{e:'Dental Clinic Stomatologjia',q:'Prishtinë'},{e:'Klinika Gjermane e Dhëmbit',q:'Prishtinë'},{e:'Mikro & Dent',q:'Prishtinë'},{e:'Top Dent',q:'Prishtinë'},{e:'Dent In',q:'Prishtinë'}],ordinanca:[{e:'Optika Neziri',q:'Prishtinë',z:'10-50%'},{e:'Optika Simoni',q:'Prishtinë',z:'20%'},{e:'DIDA & ROKA Eye Clinic',q:'Prishtinë',z:'10%'},{e:'Farmacia Ime',q:'Prishtinë',z:'10%'},{e:'VSO Clinic',q:'Prishtinë',z:'Paketë 30€'},{e:'Poliklinika Diagnoza',q:'Gjilan',z:'20%'},{e:'IDMG Swiss Clinique 2',q:'Gjilan',z:'20%'},{e:'Biolab',q:'Gjilan',z:'20%'},{e:'Physio Move',q:'Prishtinë',z:'20%'},{e:'Cambridge Clinical Lab',q:'Prishtinë',z:'20%'}]};

function ngarko(){
const ofertat=JSON.parse(localStorage.getItem('ofertat'))||[];const oferta=ofertat[ofertaId];
if(!oferta){document.getElementById('container').innerHTML='<div class="nuk-gjendet"><h2>Oferta nuk u gjet.</h2><p>Kontaktoni agentin tuaj.</p></div>';return;}
ofertaData=oferta;const pakotList=oferta.lloji==='individ'?PAKOT.individ:PAKOT.familje_biznes;
pakotZgjedhuraGlobal=pakotList.filter(p=>(oferta.pakot||[]).some(op=>(typeof op==='object'?op.id:op)===p.id||(typeof op==='string'&&op.toLowerCase().includes(p.emri.toLowerCase())))).map(p=>{const c=(oferta.pakot||[]).find(op=>typeof op==='object'&&op.id===p.id);return c?{...p,...c}:p;});
if(pakotZgjedhuraGlobal.length===0){document.getElementById('container').innerHTML='<div class="nuk-gjendet"><h2>Nuk ka paketa.</h2></div>';return;}
const ei=oferta.lloji==='individ',dm=Math.ceil((new Date(oferta.dataSkadon)-new Date())/86400000),cc=dm<=5?'countdown urgent':'countdown',ti=RRJETI.spitalet.length+RRJETI.laboratoret.length+RRJETI.dentaret.length+RRJETI.ordinanca.length;

document.getElementById('container').innerHTML=`
<div class="oferta-header"><h2>Ofertë për ${oferta.emri}</h2><p>Zgjidhni paketën ose pakot që ju përshtaten dhe konfirmoni zgjedhjen tuaj.</p><div class="oferta-meta"><span class="${cc}">Skadon për ${dm>0?dm+' ditë':'Skaduar'}</span><span>Krijuar: ${oferta.dataKrijimit}</span></div></div>
<div class="section-title">Zgjidhni paketën</div>
${pakotZgjedhuraGlobal.map(p=>`<div class="pako-card" id="card-${p.id}" onclick="togglePako('${p.id}')"><div class="pako-row"><input type="checkbox" id="cb-${p.id}" onclick="event.stopPropagation();togglePako('${p.id}')"><div class="p-info"><div class="p-name">${p.emri}</div><div class="p-zone">${p.zona} · € ${p.shuma} mbulim</div></div><div class="p-right"><div class="p-price">€ ${p.primi_madh}</div><div class="p-per">${ei?'për vit':'për muaj'}</div></div></div><div class="pako-det"><div class="det-r"><div class="dl">Shuma e Siguruar</div><div class="dv">€ ${p.shuma}</div></div><div class="det-hdr" onclick="event.stopPropagation();tgl(this)">Trajtimet Hospitalore <span class="arr">▾</span></div><div class="det-rows"><div class="det-r"><div class="dl">Mbulimi</div><div class="dv">${p.hospitalore}</div></div></div><div class="det-hdr" onclick="event.stopPropagation();tgl(this)">Trajtimet Ambulantore <span class="arr">▾</span></div><div class="det-rows"><div class="det-r"><div class="dl">Mbulimi</div><div class="dv">${p.ambulatore}</div></div></div><div class="det-hdr open" onclick="event.stopPropagation();tgl(this)">Trajtime tjera <span class="arr">▾</span></div><div class="det-rows open"><div class="det-r"><div class="dl">Shtatzania dhe lindja</div><div class="dv">${p.shtatzania}</div></div><div class="det-r"><div class="dl">Kujdesi dentar</div><div class="dv">${p.dentar}</div></div><div class="det-r"><div class="dl">Kujdesi optik</div><div class="dv">${p.optik}</div></div><div class="det-r"><div class="dl">Kujdesi për dëgim</div><div class="dv">${p.degim}</div></div><div class="det-r"><div class="dl">Kujdesi psikiatrik</div><div class="dv">${p.psikiatrik}</div></div><div class="det-r"><div class="dl">Fizioterapia</div><div class="dv">${p.fizioterapi}</div></div><div class="det-r"><div class="dl">Autoambulanca</div><div class="dv">${p.autoambulanca}</div></div><div class="det-r"><div class="dl">Aksidenti</div><div class="dv">${p.aksidentit}</div></div><div class="det-r"><div class="dl">Trajtimet onkologjike</div><div class="dv">${p.onkologjike}</div></div></div><div class="primi-r"><div class="dl">Primi${!ei&&p.primi_femije?' (mbi 18 vjeç)':''}</div><div class="dv">€ ${p.primi_madh}${ei?'/vit':'/muaj'}</div></div>${!ei&&p.primi_femije?`<div class="primi-r" style="background:#f8fafc"><div class="dl">Primi (fëmijë nën 18)</div><div class="dv">€ ${p.primi_femije}/muaj</div></div>`:''}</div></div>`).join('')}
<div class="section-title">Mbrojtje shtesë (opsionale)</div>
<div class="opt-card" id="opt-jete" onclick="toggleOpt('jete')"><input type="checkbox" id="cb-opt-jete" onclick="event.stopPropagation();toggleOpt('jete')"><div class="opt-info"><h4>Jetë Plus Cash</h4><p>Kompensim financiar i menjëhershëm për familjen në rast ndodhie të papritur.</p></div><span class="opt-badge rec">Rekomanduar</span></div>
<div class="opt-card" id="opt-opinion" onclick="toggleOpt('opinion')"><input type="checkbox" id="cb-opt-opinion" onclick="event.stopPropagation();toggleOpt('opinion')"><div class="opt-info"><h4>Opinioni i Dytë Mjekësor</h4><p>Mendim i specializuar ndërkombëtar për diagnoza dhe trajtime të rëndësishme.</p></div><span class="opt-badge new">I ri</span></div>
<div class="app-banner"><div class="app-logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18.01" stroke-width="3" stroke-linecap="round"/></svg></div><div class="app-text"><div class="at-title">Sigal Kosova App</div><div class="at-free">FALAS: Paraqitja e rimbursimeve 100% online</div><div class="at-desc">Lexim automatik i faturave · Upload dokumentesh · Ndjekja e statusit</div><div class="app-stores"><a href="https://apps.apple.com/us/app/sigal-kosova/id6756305258" target="_blank" class="store-btn"><svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83"/><path d="M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>App Store</a><a href="https://play.google.com/store/apps/details?id=com.sigalkosova.einsureapp" target="_blank" class="store-btn"><svg viewBox="0 0 24 24"><path d="M3 20.5V3.5c0-.59.34-1.11.84-1.35L13.69 12l-9.85 9.85c-.5-.24-.84-.76-.84-1.35zm13.81-5.38L6.05 21.34l8.49-8.49 2.27 2.27zm2.59-1.46c.37.22.6.63.6 1.04s-.23.82-.6 1.04l-1.94 1.13-2.5-2.5 2.5-2.5 1.94 1.13zM6.05 2.66l10.76 6.22-2.27 2.27-8.49-8.49z"/></svg>Google Play</a></div></div></div>
<div class="net-section"><div class="net-hdr" onclick="this.nextElementSibling.classList.toggle('open')"><h4>Rrjeti Mjekësor SIGAL <span class="net-count">${ti}</span></h4><span style="font-size:10px;color:#6b7a8d">Shiko ▾</span></div><div class="net-body"><div class="net-cat">Spitalet (${RRJETI.spitalet.length})</div>${RRJETI.spitalet.map(s=>`<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}<div class="net-cat">Laboratoret (${RRJETI.laboratoret.length})</div>${RRJETI.laboratoret.map(s=>`<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}<div class="net-cat">Dentarët (${RRJETI.dentaret.length})</div>${RRJETI.dentaret.map(s=>`<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q}</span></div>`).join('')}<div class="net-cat">Ordinanca me zbritje (${RRJETI.ordinanca.length})</div>${RRJETI.ordinanca.map(s=>`<div class="net-item"><span class="net-dot"></span><span class="nn">${s.e}</span><span class="nl">${s.q} · ${s.z}</span></div>`).join('')}</div></div>
<div class="koment-box"><h3>Koment (opsional)</h3><textarea id="koment" placeholder="Keni pyetje ose kërkesa? Shkruani këtu..."></textarea></div>
<div class="action-btns"><button class="btn-confirm" onclick="paraKonfirmimit()">Konfirmoj Zgjedhjen</button><button class="btn-change" onclick="kerkoNdryshim()">Kërko Ndryshim</button></div>
<div class="social-proof"><strong>1,500+</strong> klientë të siguruar me SIGAL Health</div>
<div class="oferta-footer">© ${new Date().getFullYear()} SIGAL Insurance Group Kosovo<br><a href="https://sigal-ks.com">sigal-ks.com</a> · demet.shendetsore@sigal-ks.com · +383 38 240 241</div>`;
}

function togglePako(id){const c=document.getElementById('card-'+id),cb=document.getElementById('cb-'+id);c.classList.toggle('selected');cb.checked=c.classList.contains('selected');}
function toggleOpt(id){const c=document.getElementById('opt-'+id),cb=document.getElementById('cb-opt-'+id);c.classList.toggle('selected');cb.checked=c.classList.contains('selected');}
function tgl(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open');}
function getSelected(){return pakotZgjedhuraGlobal.filter(p=>{const cb=document.getElementById('cb-'+p.id);return cb&&cb.checked;});}
function paraKonfirmimit(){if(getSelected().length===0){alert('Ju lutem zgjidhni së paku një paketë!');return;}const oj=document.getElementById('cb-opt-jete'),oo=document.getElementById('cb-opt-opinion');if(oj&&oo&&!oj.checked&&!oo.checked){document.getElementById('popup-optional').classList.add('active');return;}dergoPako();}
function vazhdo(s){document.getElementById('popup-optional').classList.remove('active');if(s){document.querySelector('.opt-card').scrollIntoView({behavior:'smooth'});return;}dergoPako();}
async function dergoPako(){const sel=getSelected(),ofertat=JSON.parse(localStorage.getItem('ofertat'))||[],oferta=ofertat[ofertaId],pe=sel.map(p=>p.emri||p.id).join(', ');let ex=[];if(document.getElementById('cb-opt-jete')?.checked)ex.push('Jetë Plus Cash');if(document.getElementById('cb-opt-opinion')?.checked)ex.push('Opinioni i Dytë Mjekësor');ofertat[ofertaId].pakaZgjedhur=pe+(ex.length?' + '+ex.join(', '):'');ofertat[ofertaId].komentKlient=document.getElementById('koment').value;ofertat[ofertaId].konfirmuar=true;ofertat[ofertaId].dataKonfirmimit=new Date().toISOString().split('T')[0];localStorage.setItem('ofertat',JSON.stringify(ofertat));try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);await fetch('https://sigal-platform-production.up.railway.app/api/konfirmo-oferte',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({emriKlientit:oferta.emri,emailKlientit:oferta.email,pakaZgjedhur:pe+(ex.length?' + '+ex.join(', '):''),koment:document.getElementById('koment').value,emailAgjentit:oferta.krijuarNgaEmail||'gjonbalajagon@gmail.com'})});clearTimeout(t);}catch(e){console.error('Email error:',e);}document.getElementById('container').innerHTML='<div class="success-msg"><div class="check" style="background:#22c55e"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><h2>Faleminderit!</h2><p>Zgjedhja juaj u regjistrua me sukses.<br>Agjenti juaj do t\'ju kontaktojë së shpejti.</p></div>';}

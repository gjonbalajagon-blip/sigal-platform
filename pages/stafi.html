<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Stafi</title>
    <link rel="stylesheet" href="../css/theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .org-dega { margin-bottom: 28px; }
        .org-dega-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--sigal-navy); border-left: 4px solid var(--sigal-navy); padding-left: 10px; margin-bottom: 12px; }
        .org-karta-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .org-karta { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--sigal-border); border-radius: 10px; padding: 12px 16px; min-width: 260px; }
        .org-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sigal-navy); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .org-emri { font-size: 13px; font-weight: 700; color: var(--sigal-text); }
        .org-pozita { font-size: 11px; color: var(--sigal-text-light); }
        .org-role { font-size: 10px; font-weight: 700; color: var(--sigal-blue); text-transform: uppercase; }
        .org-kontakt { font-size: 10px; color: var(--sigal-text-muted); margin-top: 2px; }
        .tabs-stafi { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--sigal-border); }
        .tab-btn-stafi { padding: 8px 24px; border: none; background: none; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--sigal-text-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .tab-btn-stafi.active { color: var(--sigal-navy); border-bottom-color: var(--sigal-navy); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="../Sigal-KS-Logo.webp" alt="Sigal Logo">
            <div class="logo-text">
                <span class="logo-text-main">SIGAL</span>
                <span class="logo-text-sub">Insurance Group</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span class="nav-label">Dashboard</span></a>
            <a href="oferta.html" class="nav-item"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="rinovimet.html" class="nav-item"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="dokumentet.html" class="nav-item"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item active"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout" onclick="localStorage.removeItem('user_aktual')">
                <span class="nav-icon"><i data-lucide="log-out"></i></span>
                <span class="nav-label">Dilni</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Stafi</h1>
            <button class="btn-primary" onclick="shtoStaf()">
                <i data-lucide="plus" style="width:15px;height:15px;"></i> Shto Anëtar
            </button>
        </div>
        <div class="content-area">

            <div class="tabs-stafi">
                <button class="tab-btn-stafi active" onclick="ndryshoTab('lista')">Lista e Stafit</button>
                <button class="tab-btn-stafi" onclick="ndryshoTab('organogram')">Organogrami</button>
            </div>

            <!-- LISTA -->
            <div class="tab-content active" id="tab-lista">
                <div class="filter-bar">
                    <select id="filter-role" onchange="filtro()">
                        <option value="all">Të gjitha rolet</option>
                        <option value="management">Management</option>
                        <option value="dep_management">Dep. Management</option>
                        <option value="staff_hq">Staff HQ</option>
                        <option value="staff">Staff</option>
                    </select>
                    <select id="filter-dega" onchange="filtro()">
                        <option value="all">Të gjitha degët</option>
                        <option value="HQ">HQ</option>
                        <option value="Prishtinë">Prishtinë</option>
                        <option value="Prizren">Prizren</option>
                        <option value="Ferizaj">Ferizaj</option>
                        <option value="Pejë">Pejë</option>
                        <option value="Gjilan">Gjilan</option>
                        <option value="Gjakovë">Gjakovë</option>
                        <option value="Mitrovicë">Mitrovicë</option>
                    </select>
                    <input type="text" id="search-staf" placeholder="Kërko staf..." onkeyup="filtro()">
                </div>

                <div class="stats-container">
                    <div class="stats-row">
                        <div class="fstat-card small individ-card">
                            <span id="count-hq">0</span>
                            <p>HQ</p>
                        </div>
                        <div class="fstat-card big total-card">
                            <span id="count-total">0</span>
                            <p>Total Stafi</p>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Emri</th>
                                <th>Pozita</th>
                                <th>Roli</th>
                                <th>Dega</th>
                                <th>Email</th>
                                <th>Telefoni</th>
                                <th>Veprimet</th>
                            </tr>
                        </thead>
                        <tbody id="stafi-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- ORGANOGRAM -->
            <div class="tab-content" id="tab-organogram">
                <div id="organogram"></div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="mbyllModal()">
        <div class="modal modal-large" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title">Shto Staf</h2>
                <button onclick="mbyllModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Emri *</label>
                        <input type="text" id="m-emri" placeholder="Emri">
                    </div>
                    <div class="form-group">
                        <label>Mbiemri</label>
                        <input type="text" id="m-mbiemri" placeholder="Mbiemri">
                    </div>
                    <div class="form-group">
                        <label>Pozita</label>
                        <input type="text" id="m-pozita" placeholder="p.sh. Specialist Sigurimesh">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="m-email" placeholder="email@sigal.com">
                    </div>
                    <div class="form-group">
                        <label>Telefoni</label>
                        <input type="text" id="m-telefoni" placeholder="+383 4x xxx xxx">
                    </div>
                    <div class="form-group">
                        <label>Dega</label>
                        <select id="m-dega">
                            <option value="HQ">HQ</option>
                            <option value="Prishtinë">Prishtinë</option>
                            <option value="Prizren">Prizren</option>
                            <option value="Ferizaj">Ferizaj</option>
                            <option value="Pejë">Pejë</option>
                            <option value="Gjilan">Gjilan</option>
                            <option value="Gjakovë">Gjakovë</option>
                            <option value="Mitrovicë">Mitrovicë</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Roli *</label>
                        <select id="m-role">
                            <option value="staff">Staff</option>
                            <option value="staff_hq">Staff HQ</option>
                            <option value="dep_management">Dep. Management</option>
                            <option value="management">Management</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="m-username" placeholder="username">
                    </div>
                    <div class="form-group">
                        <label>Fjalëkalimi *</label>
                        <input type="password" id="m-password" placeholder="••••••••">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="mbyllModal()">Anulo</button>
                <button class="btn-primary" onclick="ruajStaf()">Ruaj</button>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/stafi.js"></script>
    <script>
        lucide.createIcons();
        function ndryshoTab(tab) {
            document.querySelectorAll('.tab-btn-stafi').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && tab === 'lista') || (i === 1 && tab === 'organogram'));
            });
            document.getElementById('tab-lista').classList.toggle('active', tab === 'lista');
            document.getElementById('tab-organogram').classList.toggle('active', tab === 'organogram');
        }
    </script>
</body>
</html>

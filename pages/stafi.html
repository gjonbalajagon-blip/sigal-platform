<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Stafi</title>
    <link rel="stylesheet" href="../css/theme-v2.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="../Sigal-KS-Logo.webp" alt="Sigal Logo">
            <div class="logo-text">
                <span class="logo-text-main">SIGAL</span>
                <span class="logo-text-sub">Insurance Group</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item" data-label="Dashboard"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span class="nav-label">Dashboard</span></a>
            <a href="oferta.html" class="nav-item" data-label="Oferta"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item" data-label="Kontratat"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item" data-label="Faturimi"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="rinovimet.html" class="nav-item" data-label="Rinovimet"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="debitoret.html" class="nav-item" data-label="Debitorët"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="raportet.html" class="nav-item" data-label="Raportet"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="#" class="nav-item" data-label="Detyrat"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="#" class="nav-item" data-label="Dokumentet"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item active" data-label="Stafi"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="nav-item logout" onclick="localStorage.removeItem('user_aktual')">
                <span class="nav-icon"><i data-lucide="log-out"></i></span>
                <span class="nav-label">Dilni</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Stafi</h1>
            <div class="topbar-right">
                <button class="btn-primary" onclick="shtoStaf()">
                    <i data-lucide="plus"></i> Shto Anëtar
                </button>
                <!-- bell + user tag injektohen automatikisht nga main.js -->
            </div>
        </div>

        <div class="content-area">
            <!-- Tabs: Lista / Organogrami -->
            <div class="tabs">
                <button class="tab-btn active" onclick="ndryshoTab('lista')">
                    <i data-lucide="list"></i> Lista e Stafit
                </button>
                <button class="tab-btn" onclick="ndryshoTab('organogram')">
                    <i data-lucide="network"></i> Organogrami
                </button>
            </div>

            <!-- LISTA -->
            <div class="tab-content active" id="tab-lista">
                <!-- KPI Cards (clickable për filtrim sipas rolit) -->
                <div class="stats-strip">
                    <div class="kpi-card" data-filter="all">
                        <div class="kpi-icon kpi-icon-total"><i data-lucide="users"></i></div>
                        <div class="kpi-body">
                            <div class="sm-lbl">Total Staf</div>
                            <div class="sm-num" id="count-total">0</div>
                        </div>
                        <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                    </div>
                    <div class="kpi-card" data-filter="management">
                        <div class="kpi-icon kpi-icon-aktive"><i data-lucide="crown"></i></div>
                        <div class="kpi-body">
                            <div class="sm-lbl">Management</div>
                            <div class="sm-num aktive-num" id="count-mgmt">0</div>
                        </div>
                        <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                    </div>
                    <div class="kpi-card" data-filter="staff_hq">
                        <div class="kpi-icon kpi-icon-skadon"><i data-lucide="building-2"></i></div>
                        <div class="kpi-body">
                            <div class="sm-lbl">Staff HQ</div>
                            <div class="sm-num skadon-num" id="count-hq">0</div>
                        </div>
                        <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                    </div>
                    <div class="kpi-card" data-filter="staff">
                        <div class="kpi-icon kpi-icon-skaduar" style="background:linear-gradient(135deg,#a78bfa,#7c3aed 60%,#5b21b6);box-shadow:0 10px 20px -4px rgba(124,58,237,0.45),inset 0 1px 0 rgba(255,255,255,0.25)"><i data-lucide="user"></i></div>
                        <div class="kpi-body">
                            <div class="sm-lbl">Staff</div>
                            <div class="sm-num" id="count-staff" style="color:#7c3aed">0</div>
                        </div>
                        <div class="kpi-arrow"><i data-lucide="arrow-up-right"></i></div>
                    </div>
                </div>

                <!-- Filter row (pa filter-role tani — KPI klikohen për atë) -->
                <div class="filters-row">
                    <input type="text" id="search-staf" placeholder="Kërko staf..." onkeyup="filtro()">
                    <select id="filter-dega" onchange="filtro()" class="filter-select">
                        <option value="all">Të gjitha degët</option>
                        <option value="HQ">HQ</option>
                        <option value="Prishtinë">Prishtinë</option>
                        <option value="Prizren">Prizren</option>
                        <option value="Ferizaj">Ferizaj</option>
                        <option value="Pejë">Pejë</option>
                        <option value="Gjilan">Gjilan</option>
                        <option value="Gjakovë">Gjakovë</option>
                        <option value="Mitrovicë">Mitrovicë</option>
                    </select>
                    <!-- hidden select për kompatibilitet me kodin ekzistues -->
                    <select id="filter-role" style="display:none">
                        <option value="all">Të gjitha rolet</option>
                        <option value="management">Management</option>
                        <option value="dep_management">Dep. Management</option>
                        <option value="staff_hq">Staff HQ</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>

                <!-- Tabela -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Emri</th>
                                <th>Pozita</th>
                                <th>Roli</th>
                                <th>Dega</th>
                                <th>Email</th>
                                <th>Telefoni</th>
                                <th style="text-align:right;">Veprimet</th>
                            </tr>
                        </thead>
                        <tbody id="stafi-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- ORGANOGRAM -->
            <div class="tab-content" id="tab-organogram">
                <div id="organogram"></div>
            </div>
        </div>
    </div>

    <!-- Drawer për shtim/edit -->
    <div class="drawer-overlay" id="modal-overlay" onclick="mbyllModal()">
        <div class="drawer-panel" onclick="event.stopPropagation()">
            <div class="drawer-panel-header">
                <h2 id="modal-title">Shto <span style="font-weight:500">Anëtar</span></h2>
                <button class="drawer-close" onclick="mbyllModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="drawer-panel-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Emri *</label>
                        <input type="text" id="m-emri" placeholder="Emri">
                    </div>
                    <div class="form-group">
                        <label>Mbiemri</label>
                        <input type="text" id="m-mbiemri" placeholder="Mbiemri">
                    </div>
                    <div class="form-group">
                        <label>Pozita</label>
                        <input type="text" id="m-pozita" placeholder="p.sh. Specialist Sigurimesh">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="m-email" placeholder="email@sigal.com">
                    </div>
                    <div class="form-group">
                        <label>Telefoni</label>
                        <input type="text" id="m-telefoni" placeholder="+383 4x xxx xxx">
                    </div>
                    <div class="form-group">
                        <label>Dega</label>
                        <select id="m-dega">
                            <option value="HQ">HQ</option>
                            <option value="Prishtinë">Prishtinë</option>
                            <option value="Prizren">Prizren</option>
                            <option value="Ferizaj">Ferizaj</option>
                            <option value="Pejë">Pejë</option>
                            <option value="Gjilan">Gjilan</option>
                            <option value="Gjakovë">Gjakovë</option>
                            <option value="Mitrovicë">Mitrovicë</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Roli *</label>
                        <select id="m-role">
                            <option value="staff">Staff</option>
                            <option value="staff_hq">Staff HQ</option>
                            <option value="dep_management">Dep. Management</option>
                            <option value="management">Management</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="m-username" placeholder="username">
                    </div>
                    <div class="form-group">
                        <label>Fjalëkalimi *</label>
                        <input type="password" id="m-password" placeholder="••••••••">
                    </div>
                </div>
            </div>
            <div class="drawer-footer">
                <button class="btn-cancel" onclick="mbyllModal()" type="button">Anulo</button>
                <button class="btn-save" onclick="ruajStaf()" type="button"><i data-lucide="check"></i> Ruaj</button>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/stafi.js"></script>
    <script>
        lucide.createIcons();

        function ndryshoTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (i === 0 && tab === 'lista') || (i === 1 && tab === 'organogram'));
            });
            document.getElementById('tab-lista').classList.toggle('active', tab === 'lista');
            document.getElementById('tab-organogram').classList.toggle('active', tab === 'organogram');
        }

        // KPI clickable filter
        document.addEventListener('DOMContentLoaded', function() {
            const kpiCards = document.querySelectorAll('.kpi-card[data-filter]');
            let activeKpi = 'all';
            const allCard = document.querySelector('.kpi-card[data-filter="all"]');
            if (allCard) allCard.classList.add('kpi-active');

            kpiCards.forEach(card => {
                card.addEventListener('click', function() {
                    const filter = this.dataset.filter;
                    if (activeKpi === filter && filter !== 'all') {
                        activeKpi = 'all';
                    } else {
                        activeKpi = filter;
                    }
                    kpiCards.forEach(c => c.classList.remove('kpi-active'));
                    document.querySelector('.kpi-card[data-filter="'+activeKpi+'"]').classList.add('kpi-active');

                    // Set hidden filter-role dhe re-render
                    const roleSel = document.getElementById('filter-role');
                    if (activeKpi === 'all') {
                        roleSel.value = 'all';
                    } else if (activeKpi === 'management') {
                        roleSel.value = 'management';
                    } else {
                        roleSel.value = activeKpi;
                    }
                    if (typeof filtro === 'function') filtro();
                });
            });
        });
    </script>
</body>
</html>

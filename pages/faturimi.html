<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Faturimi</title>
    <link rel="stylesheet" href="../css/theme.css">
    <script src="../js/auth.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.tabs{display:flex;gap:0;background:#e5e9f0;border-radius:8px;padding:2px}.tab-btn{padding:7px 18px;font-size:12px;font-weight:600;color:#6b7a8d;border-radius:6px;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s}.tab-btn.active{background:#fff;color:#002B5C;box-shadow:0 1px 3px rgba(0,0,0,.08)}.tab-btn .tab-count{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:700;background:#e5e9f0;color:#6b7a8d}.tab-btn.active .tab-count{background:#002B5C;color:#fff}
        .stats-strip{background:#002B5C;border-radius:14px;overflow:hidden;margin-bottom:14px}.strip-top{padding:16px 24px;display:flex;align-items:flex-end;justify-content:space-between}.strip-metrics{display:flex;gap:0}.strip-metric{padding:0 20px;border-right:1px solid rgba(255,255,255,.08)}.strip-metric:first-child{padding-left:0}.strip-metric:last-child{border-right:none}.strip-metric .sm-num{font-size:28px;font-weight:800;color:#fff;line-height:1}.strip-metric .sm-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}.strip-metric.asgje .sm-num{color:#94a3b8}.strip-metric.kerkesa .sm-num{color:#fbbf24}.strip-metric.process .sm-num{color:#60a5fa}.strip-metric.leshuar .sm-num{color:#4ade80}.strip-llojet{display:flex;gap:5px;padding-bottom:4px}.strip-chip{font-size:10px;padding:5px 10px;border-radius:10px;font-weight:500;color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;line-height:1}.strip-chip .sc-num{font-weight:800;font-size:13px;color:#fff}.strip-bottom{background:rgba(0,0,0,.15);padding:10px 24px;display:flex;align-items:center;gap:14px}.strip-bar{flex:1;display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}.strip-bar-seg{height:100%;transition:width .4s ease}.strip-legend{display:flex;gap:10px;flex-shrink:0}.strip-legend span{font-size:9px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px}.strip-legend .sl-dot{width:5px;height:5px;border-radius:1.5px}
        .filters-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.filters-row select,.filters-row input{font-family:inherit;font-size:11px;padding:6px 10px;border:1px solid #e5e9f0;border-radius:6px;background:#fff;color:#1a2332}.filters-row input{flex:1;max-width:260px}
        .table-container table th{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;padding:8px 12px}.table-container table td{padding:8px 12px;font-size:12px}.table-container tbody tr:nth-child(even){background:#f8fafc}.table-container tbody tr:hover{background:#f0f4ff}.klient-name{font-weight:600;font-size:12px;color:#1a2332}.klient-sub{font-size:10px;color:#b0b8c4;margin-top:1px}.skadon-cell{display:flex;align-items:center;gap:4px;font-size:11px}.skadon-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
        .action-icon-btns{display:flex;gap:3px}.action-icon-btns button{width:28px;height:28px;border-radius:6px;border:1px solid #e5e9f0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;padding:0}.action-icon-btns button:hover{background:#f0f4ff;border-color:#0047AB}.action-icon-btns button svg{width:13px;height:13px;stroke:#6b7a8d;stroke-width:2;fill:none}.action-icon-btns button:hover svg{stroke:#0047AB}
        .status-circles{display:flex;gap:4px;align-items:center}.status-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}.status-dot:hover{transform:scale(1.15);box-shadow:0 2px 8px rgba(0,0,0,.15)}
        .muaji-select{font-size:10px;padding:4px 6px;border:1px solid #e5e9f0;border-radius:6px;background:#fff;font-family:inherit;min-width:80px}
        /* Modal */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}.modal-overlay.active{display:flex}.modal{background:#fff;border-radius:12px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto}.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e9f0}.modal-header h2{font-size:16px;color:#002B5C}.modal-header button{width:28px;height:28px;border:none;background:#f4f6f9;border-radius:6px;cursor:pointer;font-size:16px;color:#6b7a8d}.modal-body{padding:16px 20px}.form-group{margin-bottom:12px}.form-group label{display:block;font-size:11px;font-weight:600;color:#6b7a8d;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}.form-group input,.form-group select{width:100%;padding:8px 10px;border:1px solid #e5e9f0;border-radius:6px;font-size:12px;font-family:inherit}.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid #e5e9f0}
        .lloji-selector{display:flex;gap:0}.lloji-btn{flex:1;padding:8px;font-size:11px;font-weight:700;border:1px solid #e5e9f0;background:#fff;color:#6b7a8d;cursor:pointer;font-family:inherit;transition:all .15s}.lloji-btn:first-child{border-radius:6px 0 0 6px}.lloji-btn:last-child{border-radius:0 6px 6px 0}.lloji-btn.active{background:#002B5C;color:#fff;border-color:#002B5C}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="../Sigal-KS-Logo.webp" alt="Sigal Logo"><div class="logo-text"><span class="logo-text-main">SIGAL</span><span class="logo-text-sub">Insurance Group</span></div></div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="nav-icon"><i data-lucide="layout-dashboard"></i></span><span class="nav-label">Dashboard</span></a>
            <a href="oferta.html" class="nav-item"><span class="nav-icon"><i data-lucide="clipboard-list"></i></span><span class="nav-label">Oferta</span></a>
            <a href="kontratat.html" class="nav-item"><span class="nav-icon"><i data-lucide="file-text"></i></span><span class="nav-label">Kontratat</span></a>
            <a href="faturimi.html" class="nav-item active"><span class="nav-icon"><i data-lucide="receipt"></i></span><span class="nav-label">Faturimi</span></a>
            <a href="rinovimet.html" class="nav-item"><span class="nav-icon"><i data-lucide="refresh-cw"></i></span><span class="nav-label">Rinovimet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="wallet"></i></span><span class="nav-label">Debitorët</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="bar-chart-3"></i></span><span class="nav-label">Raportet</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="check-circle"></i></span><span class="nav-label">Detyrat</span></a>
            <a href="#" class="nav-item"><span class="nav-icon"><i data-lucide="folder-open"></i></span><span class="nav-label">Dokumentet</span></a>
            <a href="stafi.html" class="nav-item"><span class="nav-icon"><i data-lucide="users"></i></span><span class="nav-label">Stafi</span></a>
        </nav>
        <div class="sidebar-footer"><a href="../index.html" class="nav-item logout"><span class="nav-icon"><i data-lucide="log-out"></i></span><span class="nav-label">Dilni</span></a></div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h1>Faturimi</h1>
            <div style="display:flex;gap:8px;align-items:center;">
                <button class="btn-secondary" id="btn-dergo-email" style="display:none" onclick="dergoEmailZgjedhurve()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    Dërgo Email (<span id="count-zgjedhur">0</span>)
                </button>
                <button class="btn-primary" onclick="shtoKlient()"><i data-lucide="plus" style="width:15px;height:15px;"></i> Shto Klient</button>
            </div>
        </div>
        <div class="content-area">
            <!-- TABS -->
            <div class="tabs-row">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-mujor" onclick="ndryshoTab('mujor')">Mujor <span class="tab-count" id="tab-count-mujor">0</span></button>
                    <button class="tab-btn" id="tab-vjetor" onclick="ndryshoTab('vjetor')">Vjetor <span class="tab-count" id="tab-count-vjetor">0</span></button>
                </div>
            </div>
            <!-- NAVY STRIP -->
            <div class="stats-strip">
                <div class="strip-top">
                    <div class="strip-metrics">
                        <div class="strip-metric"><div class="sm-num" id="st-total">0</div><div class="sm-lbl">Total</div></div>
                        <div class="strip-metric asgje"><div class="sm-num" id="st-asgje">0</div><div class="sm-lbl">Asgjë</div></div>
                        <div class="strip-metric kerkesa"><div class="sm-num" id="st-kerkesa">0</div><div class="sm-lbl">Kërkesë</div></div>
                        <div class="strip-metric process"><div class="sm-num" id="st-process">0</div><div class="sm-lbl">Në Proces</div></div>
                        <div class="strip-metric leshuar"><div class="sm-num" id="st-leshuar">0</div><div class="sm-lbl">E Lëshuar</div></div>
                    </div>
                    <div class="strip-llojet" id="st-llojet"></div>
                </div>
                <div class="strip-bottom"><div class="strip-bar" id="st-bar"></div><div class="strip-legend" id="st-legend"></div></div>
            </div>
            <!-- FILTERS -->
            <div class="filters-row">
                <select id="filter-status" onchange="filtroKlientet()"><option value="all">Të gjithë statuset</option><option value="asgje">Asgjë</option><option value="kerkesa">Kërkesë</option><option value="process">Në Proces</option><option value="leshuar">E Lëshuar</option></select>
                <select id="filter-muaji" onchange="filtroKlientet()">
                    <option value="1">Janar</option><option value="2">Shkurt</option><option value="3">Mars</option><option value="4">Prill</option><option value="5">Maj</option><option value="6">Qershor</option><option value="7">Korrik</option><option value="8">Gusht</option><option value="9">Shtator</option><option value="10">Tetor</option><option value="11">Nëntor</option><option value="12">Dhjetor</option>
                </select>
                <select id="filter-krijuar" onchange="filtroKlientet()"><option value="all">Të gjithë agjentët</option></select>
                <input type="text" id="search-klient" placeholder="Kërko klient..." onkeyup="filtroKlientet()">
                <select id="filter-viti" onchange="filtroKlientet()"><option value="all">Të gjitha vitet</option><option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option></select>
            </div>
            <!-- TABELA -->
            <div class="table-container">
                <table><thead><tr>
                    <th style="width:30px"><input type="checkbox" id="select-all" onchange="zgjidhTeGjitha(this.checked)"></th>
                    <th>Klienti</th>
                    <th style="width:90px">Nr. ID / NRB</th>
                    <th>Kontrata</th>
                    <th style="width:60px">Skadon</th>
                    <th style="width:90px">Muaji</th>
                    <th style="width:120px">Statusi</th>
                    <th style="width:100px">Veprimet</th>
                </tr></thead><tbody id="faturimi-tbody"></tbody></table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay" onclick="mbyllModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header"><h2 id="modal-title">Shto Klient</h2><button onclick="mbyllModal()">✕</button></div>
            <div class="modal-body">
                <div class="form-group"><label>Emri i Klientit / Biznesit</label><input type="text" id="m-emri" placeholder="p.sh. Kompania ABC"></div>
                <div class="form-group"><label>Nr. ID / NRB</label><input type="text" id="m-kontrata-nr" placeholder="Nr. Personal ose Nr. Biznesit"></div>
                <div class="form-group"><label>Data Fillimit</label><input type="text" id="m-data-fillimit" placeholder="dd/mm/yyyy" maxlength="10"></div>
                <div class="form-group"><label>Data Mbarimit</label><input type="text" id="m-data-mbarimit" placeholder="dd/mm/yyyy" maxlength="10"></div>
                <div class="form-group"><label>Mënyra e Dërgesës</label><select id="m-dergesa"><option value="email">Email</option><option value="direkt">Direkt</option><option value="poste">Postë</option></select></div>
                <div class="form-group"><label>Email</label><input type="email" id="m-email" placeholder="klienti@email.com"></div>
                <div class="form-group"><label>Faturimi</label>
                    <div class="lloji-selector"><button type="button" class="lloji-btn active" onclick="zgjidhFaturimin('mujor',this)">Mujor</button><button type="button" class="lloji-btn" onclick="zgjidhFaturimin('vjetor',this)">Vjetor</button></div>
                    <input type="hidden" id="m-faturimi-lloji" value="mujor">
                </div>
            </div>
            <div class="modal-footer"><button class="btn-secondary" onclick="mbyllModal()">Anulo</button><button class="btn-primary" onclick="ruajKlient()">Ruaj</button></div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/faturimi.js"></script>
    <script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigal Health | Platform</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:var(--sigal-bg)">
    <div class="login-container">
        <div class="login-box">
            <img src="Sigal-KS-Logo.webp" alt="Sigal Logo" class="logo">
            <h2>Health Insurance Platform</h2>
            <p class="subtitle">Identifikohuni në llogarinë tuaj</p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="username">
            </div>
            <div class="form-group">
                <label>Fjalëkalimi</label>
                <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button class="btn-login" onclick="handleLogin()">Hyr</button>
            <p class="error-msg" id="error-msg"></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        // Nese eshte veq i loguar, dergo ne dashboard
        if (localStorage.getItem('user_aktual')) {
            window.location.href = 'pages/ballina.html';
        }

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                document.getElementById('error-msg').textContent = 'Plotësoni të gjitha fushat!';
                return;
            }
            const result = login(username, password);
            if (result.success) {
                window.location.href = 'pages/ballina.html';
            } else {
                document.getElementById('error-msg').textContent = 'Username ose fjalëkalim i gabuar!';
            }
        }
    </script>
</body>
</html>
